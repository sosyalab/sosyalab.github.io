<style>

/* Layout: masa (desk) background with a single exam-paper sheet; review controls above the sheet, questions as numbered booklet items */
:root{
  --desk:#e6ecea; --paper:#ffffff; --ink:#18222a; --muted:#56656b; --rule:#cfd9d6; --faint:#eef3f1;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --easy:#2f7d3b; --easy-bg:#e3f2e4; --mid:#9a6400; --mid-bg:#fbefd6; --hard:#b0362c; --hard-bg:#fae3df;
  --key-bg:#f4f8f7; --material:#f7faf9; --shadow:0 1px 2px rgba(20,40,40,.06),0 8px 28px rgba(20,40,40,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0f1517; --paper:#182124; --ink:#e3ebe9; --muted:#9aaba9; --rule:#2e3b3e; --faint:#1f2a2d;
  --accent:#4cc2b3; --accent-ink:#06211e; --accent-soft:#173532;
  --easy:#7fcf88; --easy-bg:#1b3320; --mid:#e8b75a; --mid-bg:#3a2d12; --hard:#f08b7f; --hard-bg:#3d1f1b;
  --key-bg:#142023; --material:#1c272a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f1517; --paper:#182124; --ink:#e3ebe9; --muted:#9aaba9; --rule:#2e3b3e; --faint:#1f2a2d;
  --accent:#4cc2b3; --accent-ink:#06211e; --accent-soft:#173532;
  --easy:#7fcf88; --easy-bg:#1b3320; --mid:#e8b75a; --mid-bg:#3a2d12; --hard:#f08b7f; --hard-bg:#3d1f1b;
  --key-bg:#142023; --material:#1c272a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* review panel */
.panel{display:grid;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel h1{font-size:26px;line-height:1.2;font-weight:700}
.outcome{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.outcome p{margin:0;font-weight:600}
.comp{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.comp li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;font-size:14px}
.comp b{font-family:var(--f-mono);color:var(--accent)}
.comp .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.ghost{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ghost{border-radius:8px}
.note{font-size:13px;color:var(--muted);margin:0}

/* sheet */
.sheet{background:var(--paper);box-shadow:var(--shadow);border-radius:4px;padding:28px clamp(16px,4vw,44px) 32px;display:grid;gap:0}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px;font-size:13px}
.sheet-head strong{font-size:15px;letter-spacing:.02em}
.sheet-head span{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.level-head{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.level-head::after{content:"";flex:1;border-top:1px solid var(--rule)}
.lv-kolay{color:var(--easy)} .lv-orta{color:var(--mid)} .lv-zor{color:var(--hard)}

.q{display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 12px;padding:22px 0;border-bottom:1px dashed var(--rule)}
.q:last-child{border-bottom:0}
.qn{font-weight:700;font-size:20px;line-height:1.3;font-variant-numeric:tabular-nums}
.qbody{display:grid;gap:12px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.02em;white-space:nowrap}
.t-kolay{background:var(--easy-bg);color:var(--easy)} .t-orta{background:var(--mid-bg);color:var(--mid)} .t-zor{background:var(--hard-bg);color:var(--hard)}
.t-comp{background:var(--accent-soft);color:var(--accent)}
.t-mat{border:1px solid var(--rule);color:var(--muted)}
.pts{margin-left:auto;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--ink);border-radius:4px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stem{font-weight:600;margin:0;font-size:15.5px}
.lines{display:grid;gap:0;margin-top:2px}
.lines span{display:block;height:26px;border-bottom:1px dotted var(--rule)}

/* materials */
.mat{background:var(--material);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font-family:var(--f-text);font-size:15px;line-height:1.65;min-width:0}
.mat p{margin:0 0 8px}.mat p:last-child{margin:0}
.mat .cap{font-family:var(--f-ui);font-weight:700;font-size:14px;margin-bottom:8px;display:block}
.src{display:block;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);margin-top:8px;font-style:italic}
.diary{background-image:repeating-linear-gradient(to bottom,transparent 0 25.5px,var(--rule) 25.5px 26.5px);line-height:26.5px;padding-top:8px}
.diary .date{font-style:italic;color:var(--muted)}
.letter{font-style:italic}
.letter .sign{text-align:right}
.dialog{display:grid;gap:8px}
.dialog p{display:grid;grid-template-columns:auto 1fr;gap:8px;margin:0}
.dialog b{font-family:var(--f-ui);font-size:13.5px;white-space:nowrap}
.news .mast{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:8px;display:block}
.news h4{font-family:var(--f-text);font-size:18px;margin:0 0 6px;line-height:1.3}
.poster{font-family:var(--f-ui);border:2px solid var(--accent);background:var(--paper)}
.poster .ph{background:var(--accent);color:var(--accent-ink);margin:-14px -16px 12px;padding:12px 16px;border-radius:3px 3px 0 0}
.poster .ph b{display:block;font-size:18px;letter-spacing:.04em}
.poster ul{margin:0 0 8px;padding-left:18px;display:grid;gap:4px}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.profile{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-family:var(--f-ui);font-size:14px;background:var(--paper)}
.profile b{display:block;margin-bottom:2px}
.twosrc{display:grid;gap:10px}
.srclabel{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:13.5px;line-height:1.45}
table.t caption{text-align:left;font-weight:700;font-size:14px;padding-bottom:8px}
table.t th,table.t td{border:1px solid var(--rule);padding:7px 9px;vertical-align:top;text-align:left}
table.t th{background:var(--faint);font-weight:600}
/* timeline */
.tl{display:flex;flex-wrap:wrap;row-gap:10px;gap:10px 0;padding:6px 2px 4px;font-family:var(--f-ui)}
.tl li{list-style:none;flex:1 1 132px;max-width:200px;position:relative;padding-top:28px;padding-right:10px;font-size:13px;line-height:1.4}
.tl li::before{content:"";position:absolute;top:9px;left:0;right:0;border-top:2px solid var(--accent)}
.tl li::after{content:"";position:absolute;top:3px;left:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent)}
.tl li:last-child::before{right:40%}
.tl .age{display:block;font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--accent)}
.tl ol{display:flex;margin:0;padding:0}
/* bar chart */
.chart{font-family:var(--f-ui);display:grid;gap:8px}
.chart .row{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.chart .track{position:relative;height:22px;background:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 25%)}
.chart .bar{height:100%;background:var(--accent);border-radius:0 3px 3px 0;position:relative}
.chart .val{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chart .axis{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chart .ticks{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
/* concept map */
.cmap{display:grid;grid-template-columns:1fr auto 1fr;gap:14px 18px;align-items:center;font-family:var(--f-ui);font-size:13.5px}
.cnode{border:1.5px solid var(--accent);border-radius:8px;padding:8px 12px;background:var(--paper)}
.cnode b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.ccenter{grid-row:1/3;grid-column:2;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 18px;text-align:center;font-weight:700;line-height:1.3}
.ccenter small{display:block;font-weight:400}
.cl{grid-column:1;position:relative}.cr{grid-column:3;position:relative}
.cl::after,.cr::after{content:"";position:absolute;top:50%;width:18px;border-top:1.5px solid var(--accent)}
.cl::after{right:-19px}.cr::after{left:-19px}
.quote{margin-top:12px;border-left:3px solid var(--ink);padding:4px 0 4px 12px;font-style:italic}

/* answer key */
.reveal{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:7px 14px;font-weight:600;font-size:14px}
.reveal[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.reveal .ic{display:inline-block;transition:transform .2s}
.reveal[aria-expanded="true"] .ic{transform:rotate(90deg)}
.key{background:var(--key-bg);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:grid;gap:12px;font-size:14px}
.key h5{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.key p{margin:0}
.key ul{margin:0;padding-left:18px;display:grid;gap:3px}
.key .sample{font-family:var(--f-text);font-style:italic;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
.rub{border-collapse:collapse;width:100%;font-size:13.5px}
.rub td{border-top:1px solid var(--rule);padding:6px 4px;vertical-align:top}
.rub td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums;width:60px}
.rub tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;font-family:var(--f-mono)}
@media (max-width:560px){
  .q{grid-template-columns:1fr}
  .qn{font-size:18px}
  .cmap{grid-template-columns:1fr}
  .ccenter{grid-row:auto;grid-column:auto}
  .cl,.cr{grid-column:auto;margin-left:18px}
  .cl::after,.cr::after{left:-19px;right:auto}
  .pts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.reveal .ic{transition:none}}
.pick{min-width:0}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:grid;gap:1px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.35}
.chip b{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on b,.chip.on i{color:var(--accent-ink)}
.chip.wait{border-style:dashed}
.chip.dist{background:var(--faint)}
.chip.dist.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.dist.on b,.chip.dist.on i{color:var(--paper)}
.empty{color:var(--muted);padding:24px 0;margin:0}
.lv-dist{color:var(--accent)}
table.dist td.num,table.t td.num{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.t tr.sum td{background:var(--faint);font-weight:600}
table.t a{color:var(--accent)}
.wait-dot{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.key .sample{white-space:pre-line}
.grid-svg{width:100%;max-width:440px;min-width:300px;display:block;margin:0 auto}
.grid-svg .gl line{stroke:var(--rule);stroke-width:1}
.grid-svg .gl-main line{stroke:var(--ink);stroke-width:1.6}
.grid-svg .gt text{fill:var(--muted);font:11px var(--f-mono)}
.grid-svg .gt .gs{fill:var(--accent);font:600 11px var(--f-ui)}
.grid-svg .gp circle{fill:var(--accent)}
.grid-svg .gp text{fill:var(--ink);font:700 13px var(--f-ui)}
.wrap{max-width:900px}
.apphead{display:grid;gap:6px}
.apphead h1{font-size:28px;line-height:1.15;font-weight:700}
.apphead p{margin:0;color:var(--muted);max-width:62ch}
.builder{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:9px 14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.status{font-size:13.5px;margin:0;color:var(--muted);min-height:1.2em}
.status.warn{color:var(--hard)}
.saved{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.saved li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:13.5px;border-top:1px solid var(--rule);padding-top:6px}
.saved button{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:underline}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more[open] summary{margin-bottom:10px}

/* cover */
.cover{border:2px solid var(--ink);border-radius:4px;padding:36px 28px;display:grid;gap:22px;text-align:center;align-content:space-between;min-height:640px;margin-bottom:28px}
.cover .c-top{display:grid;gap:6px}
.cover .c-grade{font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.cover .c-subject{font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.cover .c-exam{font-family:var(--f-text);font-size:22px}
.cover .c-band{background:var(--ink);color:var(--paper);padding:14px 10px;font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.cover .c-info{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px;font-size:15px}
.cover .c-info b{font-variant-numeric:tabular-nums}
.cover .c-table{margin:0 auto;border-collapse:collapse;font-size:14px;min-width:min(100%,420px)}
.cover .c-table th,.cover .c-table td{border:1px solid var(--ink);padding:6px 10px;text-align:center;font-variant-numeric:tabular-nums}
.cover .c-sign{font-size:14px;color:var(--muted)}
.cover .c-sign b{color:var(--ink)}

.exam .meta .tag{display:none}
.exam .pts{margin-left:auto}
.swap{font:inherit;font-size:13px;background:none;border:1px dashed var(--rule);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
.swap:hover{color:var(--accent);border-color:var(--accent)}
.qtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keysec{margin-top:28px;border-top:2px solid var(--ink);padding-top:18px;display:grid;gap:18px}
.keysec h2{font-size:18px}
.keyitem{display:grid;gap:8px;break-inside:avoid}
.keyitem h3{font-size:15px}
.keyitem .key{display:grid}
.empty-exam{color:var(--muted);text-align:center;padding:40px 0}
.light{--desk:#e6ecea;--paper:#ffffff;--ink:#18222a;--muted:#56656b;--rule:#cfd9d6;--faint:#eef3f1;--accent:#0d7a70;--accent-ink:#ffffff;--accent-soft:#dff0ec;--easy:#2f7d3b;--easy-bg:#e3f2e4;--mid:#9a6400;--mid-bg:#fbefd6;--hard:#b0362c;--hard-bg:#fae3df;--key-bg:#f4f8f7;--material:#f7faf9;color:var(--ink);background:var(--paper)}

@media print{
  :root{--desk:#fff;--paper:#fff;--ink:#000;--muted:#333;--rule:#999;--faint:#eee;--accent:#000;--accent-ink:#fff;--accent-soft:#eee;--key-bg:#fff;--material:#fff;color-scheme:light}
  @page{size:A4;margin:14mm}

material:`<div class="mat news"><span class="mast">Genel ağdan bir haber</span>
<h4>Yusufeli Barajı Nedeniyle Yerleşim Yerleri Değişen Köylüler Yeni Yuvalarına Alıştı</h4>
<p>Artvin'in Yusufeli ilçesinde Çoruh Nehri üzerine Yusufeli Barajı'nın inşa edilmesiyle Yeniköy, Tekkale, Irmakyanı, Çeltikdüzü, Çevreli, İşnan ve Meşecik köyleri sular altında kalmıştı. Bu köylerin sakinleri, yaklaşık bir yıl önce taşındıkları yeni yerleşim yerlerindeki hayatlarına alıştı. Modern villa şeklinde inşa edilen yeni evler, eski yerleşim yerlerini geride bırakırken hüzünlenen köy sakinlerini mutlu etti. Yeni yapılan yedi köyde toplamda beş yüz yedi konutun yanı sıra bazı iş yerleri, oyun parkları ve sosyal yaşam alanları da yapıldı.</p>
<span class="src">Kaynak: Ders kitabında yer alan genel ağ haberinden özetlenmiştir.</span></div>`,
stem:"Haberdeki değişimi farklı açılardan sorgulayınız. (1) Barajın yapılmasıyla değişen doğal ve beşerî çevre unsurlarından ikişer tane yazınız. (2) Köy sakinlerinin “hüzünlenmesi” ile “mutlu olması” aynı anda nasıl mümkün olmuştur? Açıklayınız. (3) Barajın Artvin'e iki olumlu ve iki olumsuz etkisi neler olabilir? (4) Sizce bu tür büyük projelerde insanların yaşamını kolaylaştırmak için başka neler yapılmalıdır? Bir öneri yazınız.",
lines:11,
key:{
 expected:"(1) Doğal: Çoruh Nehri'nin akışı/su kaynakları (baraj gölü oluşumu), bitki örtüsü/tarım arazilerinin sular altında kalması. Beşerî: yedi köyün sular altında kalması, yeni yerleşim yerleri (507 konut), iş yerleri, parklar, yollar. (2) Hüzün: doğup büyüdükleri yerleri, anılarını, eski evlerini kaybetmek; mutluluk: modern, konforlu yeni evler, parklar ve sosyal alanlar. Değişimin hem kaybettiren hem kazandıran yönü vardır. (3) Olumlu: elektrik enerjisi üretimi, sel kontrolü, sulama, modern konutlar, turizm/istihdam. Olumsuz: köylerin, tarım alanlarının, bitki örtüsünün ve tarihi/doğal alanların sular altında kalması, insanların göç etmek zorunda kalması, alışkanlıkların değişmesi. (4) Öneri: halkın görüşünün alınması, tarihi eserlerin taşınması, yeni yerde iş imkânı, eski köylerin hatırasını yaşatacak müze vb.",
 sample:"(1) Doğal çevrede Çoruh Nehri'nin üzerinde bir baraj gölü oluşmuş ve köylerdeki tarım alanları ile bitki örtüsü sular altında kalmıştır. Beşerî çevrede yedi köy sular altında kalmış, yerine 507 konuttan oluşan yeni köyler, iş yerleri ve oyun parkları yapılmıştır. (2) Köylüler doğup büyüdükleri yerleri ve anılarını geride bıraktıkları için hüzünlenmiş, modern ve konforlu yeni evlere kavuştukları için de mutlu olmuşlardır. Bu durum değişimin hem kaybettiren hem kazandıran yönleri olduğunu gösterir. (3) Olumlu etkiler: elektrik üretimi ve yeni, modern yaşam alanlarının yapılması. Olumsuz etkiler: köylerin ve tarım alanlarının sular altında kalması ile insanların yaşadıkları yerden taşınmak zorunda kalması. (4) Bu tür projelerde köylülerin görüşü alınmalı ve eski köylerin hatırasını yaşatmak için bir köy müzesi kurulmalıdır.",
 elements:["İkişer değişen unsur","Hüzün-mutluluk açıklaması","İkişer olumlu-olumsuz etki","Öneri"],
 rubric:[["Değişen ikişer doğal ve beşerî unsur",4],["Hüzün ve mutluluğun birlikte yaşanmasının açıklanması",5],["İki olumlu ve iki olumsuz etki",6],["Uygulanabilir ve gerekçeli öneri",5]],
 partial:["Olumlu ya da olumsuz etkilerden yalnızca biri yazılmışsa üçüncü ölçütten 3 puan."]
}},
{lvl:"zor",comp:"ç",mat:"Sözlü tarih → balık kılçığı",
material:`<div class="mat"><span class="cap">Alper'in babasıyla sohbetinden notlar</span>
<ul>
<li>Eskiden mahallede tek katlı, bahçeli evler vardı; şimdi yüksek katlı siteler var.</li>
<li>Çocuklar eskiden boş alanlarda ve sokakta oynardı; şimdi parklarda ve spor salonlarında vakit geçiriyor.</li>
<li>Gölde yirmi çeşit balık vardı, şimdi üç çeşit kaldı; göl seviyesi düştü.</li>
<li>Yeni köprü yapıldı, tarihi taş köprü araç trafiğine kapatıldı.</li>
<li>Köylerden şehre göç arttı; nüfus hızla çoğaldı; konut, hastane, okul ihtiyacı arttı.</li>
<li>Mahalle bakkallarının yerini büyük alışveriş merkezleri aldı.</li>
<li>Araba sayısı arttı; trafik, gürültü ve egzoz dumanı çoğaldı.</li>
<li>Tarihi cami yaklaşık sekiz asırdır ayakta; çevresindeki eski yerleşim alanında dar sokaklar duruyor.</li>
</ul>
<span class="src">Kaynak: Ders kitabı yazarlarının hazırladığı metinden özetlenmiştir.</span></div>`,
stem:"Notlardaki bilgilere dayanarak ildeki değişimin neden ve sonuçlarını bir balık kılçığı diyagramı (veya dört bölümlü tablo) ile ifade ediniz. Diyagramınız şu dört bölümden oluşsun: “Doğal çevredeki değişimin nedenleri”, “Doğal çevredeki değişimin sonuçları”, “Beşerî çevredeki değişimin nedenleri”, “Beşerî çevredeki değişimin sonuçları”. Her bölüme en az iki bilgi yazınız. Ardından notlarda değişmeden kalan bir unsuru belirleyiniz ve bu unsurun korunmasının neden önemli olduğunu açıklayınız.",
lines:12,
key:{
 expected:"Doğal nedenler: küresel ısınma, iklim değişikliği, kuraklık, kirlilik (egzoz). Doğal sonuçlar: göl seviyesinin düşmesi, balık türlerinin azalması (20→3), hava kirliliği. Beşerî nedenler: göç ve nüfus artışı, fabrikaların çoğalması, araba sayısının artması, ihtiyaçların çeşitlenmesi. Beşerî sonuçlar: yüksek katlı siteler, yeni köprü ve geniş yollar, AVM'ler, okul-hastane ihtiyacı, trafik ve gürültü, çocukların oyun alışkanlıklarının değişmesi. Değişmeyen: tarihi cami, eski yerleşim alanı/dar sokaklar (tarihi taş köprü de kabul). Önemi: geçmişin izlerini taşıyan kültürel miras, gelecek nesillere aktarılmalı, şehrin kimliği.",
 sample:"Doğal çevredeki değişimin nedenleri: Küresel ısınma ve kuraklık; araba sayısının artmasıyla oluşan egzoz dumanı.\nDoğal çevredeki değişimin sonuçları: Göl seviyesinin düşmesi; göldeki balık türlerinin yirmiden üçe inmesi.\nBeşerî çevredeki değişimin nedenleri: Köylerden şehre göçün artması ve nüfusun çoğalması; araba sayısının artması.\nBeşerî çevredeki değişimin sonuçları: Tek katlı evlerin yerini yüksek katlı sitelerin alması; mahalle bakkalları yerine alışveriş merkezlerinin açılması; trafiğin ve gürültünün artması.\nDeğişmeden kalan unsur yaklaşık sekiz asırdır ayakta duran tarihi camidir. Bu caminin korunması önemlidir, çünkü şehrin geçmişini ve kültürel mirasını gelecek nesillere aktarır.",
 elements:["Dört bölümde en az ikişer bilgi","Değişmeyen unsur","Korumanın önemi"],
 rubric:[["Doğal çevre nedenleri ve sonuçlarının (en az ikişer) doğru yazılması",6],["Beşerî çevre nedenleri ve sonuçlarının (en az ikişer) doğru yazılması",6],["Değişmeden kalan unsurun belirlenmesi",3],["Bu unsurun korunmasının öneminin açıklanması",5]],
 partial:["Neden ile sonuç yer değiştirmişse ilgili bilgiler puan almaz."]
}},
{lvl:"zor",comp:"a",mat:"İki görsel betimleme",
material:`<div class="mat twosrc">
<div><span class="srclabel">Konya – eski bir fotoğraf</span><p>Alaaddin Tepesi ve üzerindeki cami görülüyor. Tepenin çevresinde tek katlı, kerpiç evler ve dar sokaklar var. Yollarda at arabaları dikkat çekiyor. Şehrin dışında geniş tarlalar uzanıyor.</p></div>
<div><span class="srclabel">Konya – günümüzde</span><p>Alaaddin Tepesi ve cami yerinde duruyor; tepe yeşil bir park hâline getirilmiş. Çevresinde çok katlı binalar, geniş caddeler, tramvay hattı ve otomobiller var. Eskiden tarla olan alanlarda yeni mahalleler ve sanayi bölgeleri kurulmuş.</p></div>
<span class="src">Ders kitabındaki Konya görsellerinden betimlenmiştir.</span></div>`,
stem:"İki betimlemeyi karşılaştırarak Konya'nın doğal ve beşerî çevresindeki değişime neden olan unsurları inceleyiniz. (1) Değişen üç ve değişmeyen bir unsuru belirleyiniz. (2) Değişen her unsur için değişime neden olmuş olabilecek bir etkeni yazınız (nüfus artışı, teknolojinin gelişmesi, ihtiyaçların çeşitlenmesi vb.). (3) Tarla alanlarının yerleşime açılmasının nedenini ve bu durumun ileride hangi soruna yol açabileceğini açıklayınız. (4) Değişmeyen unsurun korunmasında yerel yönetimlere ve vatandaşlara düşen birer görev yazınız.",
lines:11,
key:{
 expected:"(1) Değişen: evler (kerpiç tek katlı → çok katlı), ulaşım (at arabası → otomobil, tramvay), yollar (dar sokak → geniş cadde), arazi kullanımı (tarla → mahalle ve sanayi), tepenin parka dönüşmesi. Değişmeyen: Alaaddin Tepesi ve cami. (2) Etkenler: nüfus artışı ve göç → çok katlı binalar, yeni mahalleler; teknolojinin gelişmesi → otomobil, tramvay; ihtiyaçların çeşitlenmesi → park, sanayi bölgesi. (3) Neden: nüfus artışı, konut ve sanayi ihtiyacı. Sorun: tarım alanlarının azalması, gıda üretiminin düşmesi, doğal alanların kaybı. (4) Yerel yönetim: restorasyon, koruma alanı ilan etme, temizlik/bakım; vatandaş: tarihi mekâna zarar vermemek, çöp atmamak, yazı yazmamak, koruma çalışmalarına destek.",
 sample:"(1) Değişen unsurlar evler, ulaşım araçları ve şehrin çevresindeki tarlalardır. Değişmeyen unsur ise Alaaddin Tepesi ve üzerindeki camidir. (2) Tek katlı kerpiç evlerin yerini çok katlı binaların alması nüfus artışından kaynaklanmıştır. At arabalarının yerini otomobil ve tramvayın alması teknolojinin gelişmesiyle olmuştur. Tarlaların yerine sanayi bölgelerinin kurulması ise ihtiyaçların çeşitlenmesinin sonucudur. (3) Nüfus arttıkça konut ve iş yeri ihtiyacı arttığı için tarlalar yerleşime açılmıştır. Bu durum ileride tarım alanlarının azalmasına ve yeterli gıda üretilememesine yol açabilir. (4) Belediye Alaaddin Camii'nin bakım ve restorasyonunu düzenli yapmalıdır. Vatandaşlar da bu tarihi alanda çevreyi temiz tutmalı ve esere zarar vermemelidir.",
 elements:["Üç değişen, bir değişmeyen unsur","Her değişime neden","Tarla dönüşümünün nedeni ve olası sorun","Koruma görevleri"],
 rubric:[["Değişen üç ve değişmeyen bir unsurun belirlenmesi",4],["Değişen her unsur için uygun neden (her biri 2)",6],["Tarlaların yerleşime açılma nedeni ve olası sorun",5],["Yerel yönetim ve vatandaşa birer koruma görevi",5]],
 partial:["Neden genel yazılıp unsurla eşleştirilmemişse ikinci ölçütten en fazla 3 puan."]
}},
{lvl:"zor",comp:"b",mat:"Projeler",
material:`<div class="mat twosrc">
<div><span class="srclabel">Proje 1 · Yeşil Vatan</span><p>Millî Eğitim Bakanlığı, çevre ve sürdürülebilirlik faaliyetlerinin uygulanması hedefiyle “Yeşil Vatan-Benim Okulum Geleceğe Çare” etkinliklerini hayata geçirdi. Öğrencilerin çevreye duyarlı ve sorumluluk sahibi bireyler olarak yetişmeleri esas alınarak “Yeşil Vatan'ı korumak, vatanı korumaktır!” anlayışı tüm etkinliklere yansıtılmaktadır.</p></div>
<div><span class="srclabel">Proje 2 · Atatürk Köşkü</span><p>Mustafa Kemal Atatürk'ün Trabzon ziyaretlerinde konakladığı Atatürk Köşkü'ndeki yıpranmalar nedeniyle Kültür ve Turizm Bakanlığınca restorasyon projesi başlatıldı. Çalışma boyunca ziyarete kapatılan köşk, projenin tamamlanmasıyla Cumhuriyetimizin 100. yılında kapılarını ziyaretçilerine yeniden açtı.</p></div>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"İki projeyi, çevredeki değişimden etkilenen unsurları korumak açısından inceleyiniz. (1) Her projenin hangi tür çevre unsurunu (doğal/beşerî) korumaya yönelik olduğunu ve hangi değişime karşı yapıldığını belirtiniz. (2) Atatürk Köşkü restore edilmeseydi hangi unsurların olumsuz etkilenebileceğini iki örnekle açıklayınız. (3) “Yeşil Vatan'ı korumak, vatanı korumaktır!” sözünü doğal çevredeki değişimle ilişkilendirerek yorumlayınız. (4) Kendi ilinizde değişimden etkilenen bir doğal ya da beşerî unsuru korumak için okulunuzda yapılabilecek bir etkinlik öneriniz.",
lines:11,
key:{
 expected:"(1) Proje 1: doğal çevre – ormansızlaşma, kirlilik, kaynakların bilinçsiz tüketimi gibi değişimlere karşı çevre bilinci. Proje 2: beşerî çevre (tarihi yapı) – zamanla yıpranma/eskimeye karşı. (2) Köşk yıkılabilir veya zarar görebilir; kültürel miras ve Atatürk'e ait hatıralar kaybolur; turizm ve ziyaretçi sayısı azalır; gelecek nesiller tarihini yakından tanıyamaz. (3) Vatan yalnızca toprak değil, ormanları, suları ve doğasıyla bir bütündür; doğanın bozulması (erozyon, kuraklık, kirlilik) vatanın geleceğini tehdit eder, bu yüzden doğayı korumak vatanı korumaktır. (4) Uygulanabilir etkinlik: fidan dikimi, tarihi çeşme temizliği, atık toplama, su tasarrufu kampanyası vb.",
 sample:"(1) Proje 1 doğal çevreyi korumaya yöneliktir; çevre kirliliği ve kaynakların bilinçsizce tüketilmesi gibi değişimlere karşı öğrencilerde çevre bilinci oluşturmayı amaçlar. Proje 2 ise beşerî çevredeki tarihi bir yapıyı, zamanla yıpranmaya karşı korumaya yöneliktir. (2) Atatürk Köşkü restore edilmeseydi yıpranma artarak bina zarar görebilir ve Atatürk'e ait hatıralar kaybolabilirdi. Ayrıca köşkü ziyaret eden turistlerin sayısı azalır, Trabzon'un turizmi etkilenirdi. (3) Bu söz, vatanın yalnızca toprak değil ormanları, suları ve doğasıyla bir bütün olduğunu anlatır. Ormanlar yok olur, sular kirlenirse vatanımızın geleceği de tehlikeye girer. (4) Okulumuzda mahallemizdeki tarihi çeşmenin çevresini temizlemek ve tanıtıcı bir pano hazırlamak için bir gönüllü etkinlik düzenlenebilir.",
 elements:["Projelerin korunan unsur ve değişim türü","Restorasyon yapılmamasının etkileri","Sözün yorumu","Okul etkinliği önerisi"],
 rubric:[["İki projenin korunan unsur türü ve karşı olduğu değişimin belirlenmesi",5],["Restorasyon yapılmasaydı etkilenecek iki unsur",5],["Sözün doğal çevredeki değişimle ilişkilendirilerek yorumlanması",5],["Uygulanabilir okul etkinliği önerisi",5]],
 partial:["Etkinlik önerisi ille ilişkilendirilmemişse son ölçütten 3 puan."]
}}
]});

material:`<div class="mat"><span class="cap">Doğa olayı mı, afet mi?</span>
<p>Rüzgâr eser, yağmur yağar, kar yağar, sel olur, çığ düşer, deprem olur. Doğa olayları yaşamımızın bir parçasıdır. Örneğin yağmur tarıma katkıda bulunur, kar yağışı göllerin ve barajların dolmasını sağlar. Doğa olaylarının şiddetinin fazla olması ya da doğa olaylarına karşı yeterince tedbirin alınmaması afet riskini ortaya çıkarabilmektedir. Afetler, insanlar için maddi ve manevi kayıplara neden olan, yaşamı olumsuz etkileyen, doğa veya insan kaynaklı olaylardır.</p>

<div><span class="srclabel">Haber 1</span><p>Paris'te çıkan yangında büyük hasar gören Notre Dame Katedrali, 2010'da oluşturulan üç boyutlu dijital kopyası sayesinde bire bir restore edilebilecek. UNESCO, Dünya Mirası Listesi'nde yer alan katedralin onarılması için destek vereceğini açıkladı.</p></div>
<div><span class="srclabel">Bilgi kutusu</span><p>Ortak kültürel miras ögelerini korumak, yaşatmak ve gelecek nesillere aktarmak tüm insanların sorumluluğudur. Ülkemizdeki kültürel miras ögelerinin korunmasında Kültür ve Turizm Bakanlığına bağlı Vakıflar Genel Müdürlüğü ile Kültür Varlıkları ve Müzeler Genel Müdürlüğü sorumludur. Valilikler, yerel yönetimler ve sivil toplum kuruluşları da bu konuda bazı görev ve sorumluluklara sahiptir.</p></div>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"Kaynaklardan hareketle (1) UNESCO'nun başka bir ülkedeki eserin onarımına destek vermesinden ortak miras kavramına ilişkin bir çıkarım yapınız. (2) Notre Dame örneğinden, eserlerin dijital kayıtlarının alınmasının neden önemli olduğuna dair bir çıkarım yapınız. (3) Bilgi kutusuna göre ortak mirası korumak yalnızca devletin mi görevidir? Gerekçesiyle açıklayınız.",
lines:7,
key:{
 expected:"(1) Ortak miras yalnızca bulunduğu ülkenin değil bütün insanlığın mirasıdır; bu yüzden korunması uluslararası bir sorumluluktur. (2) Dijital kayıtlar eser zarar gördüğünde aslına uygun onarım yapılmasını sağlar; bilgi kaybını önler. (3) Hayır; bilgi kutusu korumanın tüm insanların sorumluluğu olduğunu söyler; bakanlık birimleri yanında valilik, yerel yönetim, STK ve bireyler de sorumludur.",
 sample:"(1) UNESCO'nun Fransa'daki bir katedralin onarımına destek vermesi, ortak mirasın yalnızca bulunduğu ülkeye değil bütün insanlığa ait olduğunu gösterir. (2) Notre Dame'ın üç boyutlu dijital kopyası sayesinde aslına uygun onarılabilmesi, eserlerin dijital kayıtlarının zarar görmeleri durumunda onları kurtarmak için çok önemli olduğunu gösterir. (3) Hayır, yalnızca devletin görevi değildir. Bilgi kutusunda ortak mirası korumanın tüm insanların sorumluluğu olduğu yazmaktadır; bakanlıklar yanında valilikler, belediyeler, sivil toplum kuruluşları ve biz vatandaşlar da sorumluyuz.",
 elements:["Ortak miras çıkarımı","Dijital kayıt çıkarımı","Koruma sorumluluğu"],
 rubric:[["UNESCO desteğinden ortak mirasa ilişkin çıkarım",5],["Dijital kaydın önemine ilişkin çıkarım",5],["Korumanın herkesin sorumluluğu olduğunun gerekçelendirilmesi",5]],
 partial:["Üçüncü soruda yalnızca “hayır” yazılmışsa 1 puan."]
}},

{lvl:"zor",comp:"b",mat:"UNESCO kriterleri",
material:`<div class="mat"><span class="cap">UNESCO Dünya Mirası Listesi'ne alınma kriterlerinden bazıları</span>
<ol>
<li>İnsanlık tarihinde önemli bir aşamayı veya aşamaları gösteren bir öge olmalıdır.</li>
<li>Yaşayan ya da ortadan yok olmuş bir kültürel geleneğe veya bir medeniyete tanıklık etmelidir.</li>
<li>Evrensel öneme sahip olaylar veya yaşayan gelenekler, fikirler, inançlar, sanatsal ve edebî eserler ile doğrudan ilgili olmalıdır.</li>
<li>Dikkat çeken, kitleleri etkileme gücü olan, farklı bir doğal güzelliğe ve estetik öneme sahip alanları içermelidir.</li>
</ol>
<span class="src">Kaynak: Ders kitabındaki bilgi kutusundan alınmıştır.</span></div>`,
stem:"Yaşadığınız ilde (veya bildiğiniz bir ilde) bulunan bir somut ya da somut olmayan kültürel miras ögesini seçerek UNESCO'ya sunulacak kısa bir “aday tanıtım dosyası” hazırlayınız. Dosyanızda (1) ögenin adı, bulunduğu il ve türü (somut/somut olmayan), (2) ögenin kısa tanıtımı (2-3 cümle), (3) ögenin uyduğu iki kriterin numarası ve her birinin gerekçesi, (4) ögeyi korumak için yapılması gereken iki çalışma yer alsın.",
lines:12,
key:{
 expected:"Tutarlı bir dosya: gerçek ya da uygun bir öge (ör. bir cami, han, köprü, kale, höyük, halk oyunu, el sanatı, yemek kültürü); türü doğru; tanıtım öğrencinin bilgisiyle tutarlı; iki kriter numarası doğru gerekçeyle ögeye bağlanmış; iki koruma çalışması uygulanabilir (restorasyon, bakım, tanıtım, kurs açma, dijital kayıt, ziyaretçi kuralları).",
 sample:"(1) Öge: Divriği Ulu Camii ve Darüşşifası – Sivas – somut kültürel miras.\n(2) Tanıtım: Divriği Ulu Camii ve Darüşşifası, yaklaşık sekiz yüz yıl önce yapılmış bir cami ve hastane yapısıdır. Taş kapılarındaki süslemeler, dönemin taş işçiliği sanatının ne kadar geliştiğini göstermektedir.\n(3) Kriterler: Kriter 2'ye uyar, çünkü Anadolu Selçuklu dönemine ait bir medeniyete tanıklık eder. Kriter 4'e uyar, çünkü taş kapılarındaki eşsiz süslemeleriyle ziyaretçileri etkileyen estetik bir öneme sahiptir.\n(4) Koruma çalışmaları: Yapının düzenli bakım ve restorasyonu uzmanlar tarafından yapılmalı ve taş süslemelerin üç boyutlu dijital kaydı alınmalıdır.",
 elements:["Öge, il ve tür","Kısa tanıtım","İki kriter ve gerekçe","İki koruma çalışması"],
 rubric:[["Ögenin adı, ili ve türünün doğru belirtilmesi",3],["2-3 cümlelik tutarlı tanıtım",4],["İki kriterin numarası ve ögeye uygun gerekçesi (her biri 4)",8],["Uygulanabilir iki koruma çalışması",5]],
 partial:["Kriter numarası yazılıp gerekçe verilmemişse her biri için 1 puan."]
}},
{lvl:"zor",comp:"c",mat:"Akran değerlendirmesi",
material:`<div class="mat"><span class="cap">Sınıf panosundaki iki afiş</span>
<div class="profiles">
<div class="profile"><b>Kerem'in afişi</b><p>Başlık: “Pamukkale”. Afişte büyük bir Pamukkale fotoğrafı var. Altında yalnızca “Çok güzel bir yer, mutlaka gidin!” yazıyor.</p></div>
<div class="profile"><b>Nisa'nın afişi</b><p>Başlık: “Beyaz Cennet Pamukkale ve Hierapolis”. Travertenlerin kalsiyumlu sulardan oluştuğu, Hierapolis'in Antik Çağ'dan kalan önemli bir kent olduğu, UNESCO listesinde yer aldığı yazıyor. Altında “Travertenlerde ayakkabıyla yürümeyelim, mirasımızı koruyalım!” uyarısı ve kaynak olarak ders kitabı belirtilmiş.</p></div>
</div>
<span class="src">Bilgiler ders kitabından alınmıştır; afişler kurgusaldır.</span></div>`,
stem:"İki afişi, ortak mirasın önemini paylaşma açısından değerlendiriniz. (1) Hangi afişin amaca daha uygun olduğunu iki gerekçeyle açıklayınız. (2) Kerem'e afişini geliştirmesi için iki öneride bulununuz. (3) Kerem'e geri bildiriminizi kırıcı olmadan nasıl ileteceğinizi bir cümleyle yazınız. (4) Afişlerin sınıf dışında daha çok kişiyle paylaşılması için bir yol öneriniz ve paylaşırken dikkat edilmesi gereken bir kuralı belirtiniz.",
lines:11,
key:{
 expected:"(1) Nisa'nın afişi: bilgilendirici (oluşum, tarihî önem, UNESCO), korumaya çağrı içeriyor, kaynak gösterilmiş; Kerem'in afişi yalnızca kişisel görüş içeriyor, mirasın önemini açıklamıyor. (2) Öneriler: Pamukkale'nin oluşumu ve tarihî önemi hakkında bilgi eklemek, korumaya yönelik çağrı yazmak, kaynak belirtmek, daha açıklayıcı başlık, Hierapolis'i eklemek. (3) Olumlu başlayan, öneriyi nazikçe sunan cümle. (4) Okul sitesi/sosyal medya (izinle), veli toplantısı, okul koridoru, halk kütüphanesi; kural: izin almak, doğru bilgi ve kaynak göstermek, görsel telif/kişisel bilgilere dikkat.",
 sample:"(1) Nisa'nın afişi daha uygundur. Birincisi, Pamukkale'nin nasıl oluştuğu ve Hierapolis'in tarihî önemi gibi bilgilerle mirasın neden önemli olduğunu açıklamaktadır. İkincisi, mirası korumaya yönelik bir çağrı içermekte ve kaynak belirtmektedir. Kerem'in afişi ise yalnızca kişisel bir görüş içermektedir. (2) Kerem, travertenlerin kalsiyumlu sulardan oluştuğunu ve UNESCO listesinde yer aldığını ekleyebilir. Ayrıca afişine mirası korumaya yönelik bir uyarı cümlesi yazabilir. (3) “Kerem, fotoğrafın çok etkileyici olmuş; altına Pamukkale'nin neden önemli olduğunu anlatan birkaç bilgi eklersen afişin daha da güzel olur.” (4) Afişler okul idaresinin izniyle okulun genel ağ sitesinde paylaşılabilir; paylaşırken bilgilerin doğru olmasına ve kaynağın belirtilmesine dikkat edilmelidir.",
 elements:["Daha uygun afiş ve iki gerekçe","İki geliştirme önerisi","Kırıcı olmayan geri bildirim","Paylaşım yolu ve kural"],
 rubric:[["Daha uygun afişin iki gerekçeyle belirlenmesi",5],["Kerem'e iki geliştirme önerisi",5],["Kırıcı olmayan, yapıcı geri bildirim cümlesi",4],["Paylaşım yolu ve dikkat edilecek kural",6]],
 partial:["Geri bildirim cümlesi eleştirel ama kırıcı değilse tam puan verilir."]
}},
{lvl:"zor",comp:"a",mat:"Yerel miras durumu",
material:`<div class="mat"><span class="cap">Bir ilçedeki tarihi taş köprü</span>
<p>Yaklaşık dört yüz yıllık taş köprü, ilçenin simgesi olarak bilinir. Eskiden köprünün yanında her yıl bir bahar şenliği düzenlenir, köprünün yapılışını anlatan bir türkü söylenirdi. Bugün köprünün bazı taşları düşmüş, üzerine yazılar yazılmış ve çevresi çöplerle dolmuştur. Bahar şenliği de uzun yıllardır yapılmamaktadır; türküyü yalnızca birkaç yaşlı bildiğini söylemektedir.</p>
<span class="src">Kurgusal örnek olaydır.</span></div>`,
stem:"Örnek olaydan hareketle çıkarımlar yapınız. (1) Metindeki somut ve somut olmayan kültürel miras ögelerini belirleyiniz. (2) Her iki miras ögesinin karşı karşıya olduğu tehlikeyi ve bu tehlikenin olası nedenlerini yazınız. (3) Somut olmayan miras ögesinin kaybolmasının ilçe için ne gibi sonuçları olabileceğine dair iki çıkarım yapınız. (4) Bu örnekten hareketle “Somut ve somut olmayan miras birbirini tamamlar.” ifadesini açıklayınız.",
lines:11,
key:{
 expected:"(1) Somut: tarihi taş köprü. Somut olmayan: bahar şenliği, köprünün türküsü. (2) Köprü: taş düşmesi, yazı yazılması, çöp – bakımsızlık, bilinçsizlik, koruma çalışmalarının yapılmaması. Şenlik/türkü: unutulma – şenliğin düzenlenmemesi, bilenlerin azalması, gençlere aktarılmaması, göç/değişen yaşam. (3) İlçenin kimliğinin ve ortak hafızasının zayıflaması; insanlar arasındaki birlik ve bir araya gelme fırsatının azalması; köprünün hikâyesinin unutulması, turizm kaybı. (4) Köprü türküye ve şenliğe anlam ve mekân verir, türkü ve şenlik de köprünün hikâyesini yaşatır; biri kaybolunca diğerinin anlamı da eksilir.",
 sample:"(1) Tarihi taş köprü somut kültürel miras, bahar şenliği ve köprünün yapılışını anlatan türkü ise somut olmayan kültürel mirastır. (2) Köprü, taşlarının düşmesi, üzerine yazı yazılması ve çevresinin kirlenmesi tehlikesiyle karşı karşıyadır; bunun nedeni bakım yapılmaması ve insanların bilinçsiz davranmasıdır. Şenlik ve türkü ise unutulma tehlikesindedir; çünkü şenlik yıllardır düzenlenmemekte ve türkü gençlere öğretilmemektedir. (3) Türkü ve şenlik kaybolursa ilçe halkı köprünün hikâyesini unutur ve ilçenin kimliği zayıflar. Ayrıca insanların her yıl bir araya gelip kaynaştığı bir gelenek ortadan kalkar. (4) Köprü türküye ve şenliğe anlam ve mekân kazandırırken türkü ve şenlik de köprünün hikâyesini yaşatır. Bu nedenle somut ve somut olmayan miras birbirini tamamlar; biri kaybolursa diğerinin anlamı da eksik kalır.",
 elements:["Somut ve somut olmayan ögeler","Tehlikeler ve nedenleri","İki çıkarım","İfadenin açıklanması"],
 rubric:[["Somut ve somut olmayan ögelerin belirlenmesi",3],["İki ögenin tehlikesi ve olası nedenleri",6],["Somut olmayan mirasın kaybına ilişkin iki çıkarım",6],["Somut ve somut olmayan mirasın birbirini tamamladığının açıklanması",5]],
 partial:["Tehlike yazılıp neden belirtilmemişse her öge için 1,5 puan."]
}},

material:`<div class="mat"><span class="cap">5/C sınıfının “Mirasımız Dijitalde” projesi</span>

lines:12,
key:{

}}

<div><span class="srclabel">Kaynak 1 · Değerlerin işlevi</span>
<p>Değerler bireylerin hayatına rehberlik eder ve insanlar arasında bağ kurar. Değerler sosyal dayanışmayı ortaya çıkarır ve sürmesini sağlar. Toplumu oluşturan bireylerin birliğini ve kaynaşmasını sağlar, toplumsal ayrışmanın önüne geçer.</p></div>
<div><span class="srclabel">Kaynak 2 · İstiklal Yolu</span>
<p>Millî Mücadele başladığında ordular dağıtılmış, silah ve cephaneye el konmuştu. Cephaneler İnebolu Limanı'na ulaştırılıyor, buradan demirciler ve kayıkçılar tarafından karaya çıkarılıyordu. Kastamonu halkının kadınları, yaşlıları ve çocukları bu cephaneleri zorlu yollardan Ankara'ya taşıdı. Şerife Bacı, Halime Çavuş ve Necibe Nine bu mücadelenin kahramanları arasında yer aldı. Bu fedakârlıklar Türkiye Büyük Millet Meclisi tarafından takdir edildi ve kahramanlar 11 Şubat 1924'te İstiklal Madalyası ile onurlandırıldı.</p></div>
<span class="src">Kaynak 1: Sağlam (2016) ve Yeniyol (2016)'dan uyarlanan ders kitabı metni. Kaynak 2: Ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Kaynak 1'de değerlerin toplumdaki işlevlerinden ikisini belirleyiniz. Bu iki işlevin Kaynak 2'de anlatılan İstiklal Yolu olayında nasıl görüldüğünü, olaydaki kişi ve gruplardan örnekler vererek yorumlayınız. Son olarak bu olayda halkı bir araya getiren iki millî değeri yazınız.",
lines:7,
key:{

{lvl:"zor",comp:"b",mat:"Üç metin → kavram haritası",
material:`<div class="mat twosrc">
<div><span class="srclabel">Metin 1 · Nevruz</span>
<p>Doğayla iç içe yaşayan atalarımız baharın gelişini ve toprağın uyanışını bayram sevinciyle kutlamıştır. Nevruz, bugün Türk dünyası başta olmak üzere Türklerin yaşadığı hemen her yerde kutlanan, birlik ve beraberliğin sembolü olan bir kültür mirasıdır.</p></div>
<div><span class="srclabel">Metin 2 · Erzurum barı</span>
<p>Düğünlerde ve asker uğurlamalarında oynanan halk oyunları gelenek ve göreneklerimizi yaşatır. Erzurum barı, oynandığı geniş coğrafyada yiğitlik ve kahramanlık duygularını yansıtmak amacıyla sergilenir.</p></div>
<div><span class="srclabel">Metin 3 · Vakıflar</span>
<p>Milletimiz vakıflar aracılığıyla aşevleri, kervansaraylar ve misafirhaneler kurmuştur. Bu yapılar ihtiyaç sahiplerine yardım etmekle kalmamış, toplumda birlik ve beraberlik duygusunu da pekiştirmiştir.</p></div>
<span class="src">Metinler ders kitabındaki bilgilerden yararlanılarak hazırlanmıştır.</span></div>`,
stem:"Üç metindeki bilgileri, merkezinde “Toplumsal Birliğimiz” yazan bir kavram haritasına dönüştürünüz. Haritada her metin için üç bilgi bulunmalıdır: kültürel ögenin adı, ilişkili olduğu kültürel bağ unsuru (dil, din, tarih, sanat, gelenek-görenek) ve yaşattığı bir millî değer. Haritanın altına, üç ögenin toplumsal birliğe ortak katkısını metinlerden kopmadan tek cümleyle yazınız.",

<div><span class="srclabel">Kaynak 2 · Göreceli konum</span>

stem:"Kaynakları birlikte kullanarak her çekim yerinin Türkiye'nin hangi uç noktası olduğunu ve o noktadan geçen paralel veya meridyeni belirleyiniz. Kerem Bey'in ekibi yerel saatle 06.00'da Dilucu'da gün doğumunu çekmiştir. Gökçeada'daki ekibin, enlem farkını dikkate almadan yalnızca meridyen farkına göre, gün doğumunu yerel saatle yaklaşık kaçta çekeceğini işlemleriyle hesaplayınız. Son olarak İnceburun ile Topraktutan arasındaki yaklaşık kuş uçuşu mesafeyi bulunuz.",
lines:9,

{lvl:"zor",comp:"b",mat:"Bilgi metni + üç haber",
material:`<div class="mat twosrc">

<p>Lehçe, şive ve ağız farklılıkları olsa da ortak bir dil (Türkçe); yörelere göre çeşitlense de ortak özellikler taşıyan töre, gelenek ve görenekler; din ve ahlak anlayışı; sanat ve edebiyat; tarih şuuru ve birlikte yaşama kültürü gibi değerler birliği Türk dünyası kültürünü oluşturur.</p>

<p>• TÜRKSOY Ressamlar Buluşması kapsamında Kuzey Makedonya'dan ressamların eserleri Ankara'da sergilendi.</p>

lines:9,
key:{
 expected:"Ortak Türk Alfabesi → ortak dil (Türkçe) → yazıda ortaklık sağlayarak lehçe farklılıklarına rağmen birbirini anlamayı kolaylaştırır. TÜRKSOY resim sergisi → sanat (ve edebiyat) → sanatçıları ve halkı buluşturarak ortak sanat mirasını tanıtır. Belgesel festivali → sanat / tarih şuuru / birlikte yaşama kültürü → belgesellerle ortak tarih, gelenek ve yaşamın anlatılmasını ve paylaşılmasını sağlar. Sonuç: Kültürel iş birlikleri, Türk dünyasının ortak değerlerine dayanır ve bu değerleri güçlendirerek dayanışmayı artırır.",

 elements:["Üç iş birliği","Her biri için Kaynak 1'den doğru değer","Güçlendirme açıklaması","Karşılıklı ilişkiyi gösteren sonuç cümlesi"],
 rubric:[["Birinci satır: alfabe – dil – açıklama",5],["İkinci satır: sergi – sanat – açıklama",5],["Üçüncü satır: festival – uygun değer – açıklama",5],["İki kaynaktan kopmadan yazılmış sonuç cümlesi",5]],

{lvl:"zor",comp:"c",mat:"Bilgi kartı + iki özet",
material:`<div class="mat twosrc">
<div><span class="srclabel">Asıl bilgi</span>
<p>Türk Devletleri Teşkilatı, 3 Ekim 2009'da “Türk Dili Konuşan Ülkeler İş Birliği Konseyi” adıyla kurulmuş, 12 Kasım 2021'de bugünkü adını almıştır. Amacı, Türk devletleri arasındaki iş birliğini ve dayanışmayı ortak tarih, dil ve kültür mirası çerçevesinde geliştirmektir. Türkiye, Azerbaycan, Kazakistan, Kırgızistan ve Özbekistan üye; Macaristan, Türkmenistan ve KKTC gözlemci ülkelerdir.</p></div>
<div><span class="srclabel">Ayşe'nin özeti</span>
<p>Türk Devletleri Teşkilatı 2009'da farklı bir adla kurulmuş, 2021'de bugünkü adını almıştır. Ortak tarih, dil ve kültüre dayanarak Türk devletleri arasında iş birliğini ve dayanışmayı geliştirmeyi amaçlar. Beş üye ve üç gözlemci ülkesi vardır.</p></div>
<div><span class="srclabel">Kerem'in özeti</span>
<p>Türk Devletleri Teşkilatı 2021'de kurulan ve yalnızca ekonomik iş birliğini amaçlayan bir kuruluştur. Macaristan ve Türkmenistan dahil yedi üyesi vardır. Bu teşkilat sayesinde Türk dünyası artık dünyanın en güçlü birliği olmuştur.</p></div>
<span class="src">Asıl bilgi ders kitabından alınmıştır. Özetler kurgusaldır.</span></div>`,

lines:9,
key:{

 elements:["Doğru özetin seçimi ve gerekçesi","Kerem'in özetinde en az üç hata","Hataların asıl bilgiyle karşılaştırılması","Doğru, nesnel yeniden yazım"],
 rubric:[["Ayşe'nin özetinin seçilmesi ve gerekçelendirilmesi",4],["Kerem'in özetindeki üç hatanın asıl bilgiyle karşılaştırılarak gösterilmesi (her biri 3)",9],["Kerem'in özetinin doğru, nesnel ve anlamı koruyarak yeniden yazılması",7]],

<p>“… Bugün biz bu kitlelerden dil bakımından, gelenek, görenek, tarih bakımından ayrılmış; çok uzağa düşmüşüz. … Onların bize yaklaşmasını bekleyemeyiz. Bizim onlara yaklaşmamız gerekli. Köklerimize inmeli ve olayların böldüğü tarihimizin içinde bütünleşmeliyiz. Tarih bağı kurmamız lazım, folklor bağı kurmamız lazım. Bunları kim yapacak? Elbette biz! Nasıl yapacağız? İşte görüyorsunuz, dil encümenleri, tarih encümenleri kuruluyor. Dilimizi onun diline yaklaştırmaya ve böylece birbirimizi daha kolay anlar hâle gelmeye çalışıyoruz. …”</p>

 sample:"Atatürk'e göre Türk dünyasındaki topluluklarla zaman içinde dil, gelenek ve tarih bakımından birbirimizden uzaklaştık. Bu durumda onların bize yaklaşmasını beklemek yerine bizim onlara yaklaşmamız gerekir. Bunun için ortak köklerimize dönmeli, tarih ve folklor bağları kurmalı, dilimizi birbirimizi daha kolay anlayacak şekilde yaklaştırmalıyız. Günümüzde kabul edilen Ortak Türk Alfabesi, Atatürk'ün söylediği dili yaklaştırma yoluna bir örnektir. TÜRKSOY'un düzenlediği sanat buluşmaları da folklor ve kültür bağı kurma çabasının bir parçasıdır.",

{lvl:"zor",comp:"ç",mat:"Dört kaynak türü",
material:`<div class="mat twosrc">
<div><span class="srclabel">Bilgi notu</span><p>Tarihçiler ilk Türk devletleri hakkındaki bilgileri öncelikle Çin ve diğer komşu devletlerin kaynaklarından elde etmiştir. Bunun temel nedeni, Türklerin konargöçer bir yaşam sürmeleri ve II. Göktürk Devleti'ne kadar yazılı eser bırakmamış olmalarıdır. Türk tarihinin ilk yazılı belgesi olan Orhun Kitabeleri, II. Göktürk Devleti Dönemi'nde yazılmıştır. Destanlar ise sözlü kültürümüze ait edebî eserlerdir.</p>
<span class="src">Ders kitabından.</span></div>
<div><span class="srclabel">Elif'in proje ödevi için seçtiği kaynaklar</span>
<p><b>A.</b> Bilge Kağan'ın ağzından yazılmış Orhun Kitabeleri'nin çevirisi<br>
<b>B.</b> Göktürklerle savaşmış bir Çin hanedanının saray yıllıkları<br>
<b>C.</b> Ergenekon Destanı<br>
<b>D.</b> Yazarı belli olmayan, kaynak göstermeyen “Tarihin Gizemleri” adlı bir internet sitesi</p></div>
<span class="src">Bilgi notu ders kitabından alınmıştır. Elif'in kaynak listesi kurgusaldır.</span></div>`,
stem:"Elif, II. Göktürk Devleti'nin yönetim anlayışı hakkında bilgi toplamaktadır. Dört kaynağın her birinin bu konuda bilgi toplamak için güçlü ve zayıf yönlerini değerlendiriniz. Elif'in hangi iki kaynağı birlikte kullanırsa daha doğru bilgiye ulaşacağını ve bunun nedenini açıklayınız.",
lines:9,
key:{
 expected:"A – Güçlü: Türklerin kendi yazdığı, döneme ait ilk el kaynak; yönetim anlayışını doğrudan anlatır. Zayıf: Kağanın ağzından yazıldığı için kendi başarılarını öne çıkarabilir. B – Güçlü: Döneme ait yazılı kaynak, tarihleri ve olayları kaydeder. Zayıf: Göktürklerle savaşmış bir devletin kaynağıdır, taraflı olabilir. C – Güçlü: Kültür, inanç ve değerleri yansıtır. Zayıf: Sözlü edebî eserdir, olağanüstü unsurlar içerir, kesin tarihî bilgi için tek başına yetersizdir. D – Zayıf: Yazarı ve kaynakçası yok, doğruluğu kontrol edilemez; güvenilir değildir. En iyi birlikte kullanım: A ve B; Türklerin kendi anlatımı ile dışarıdan bir anlatım karşılaştırılarak doğrulanabilir (çapraz kontrol).",
 sample:"A kaynağı Türklerin kendi yazdığı ve o döneme ait bir belge olduğu için çok değerlidir; ancak Bilge Kağan'ın ağzından yazıldığı için kendi başarılarını öne çıkarmış olabilir. B kaynağı da o döneme aittir ve olayları kaydetmiştir; fakat Göktürklerle savaşmış bir hanedanın yıllığı olduğu için Türkleri olumsuz anlatmış olabilir. C kaynağı, yani Ergenekon Destanı, Türklerin inançlarını ve değerlerini gösterir; ama sözlü bir edebî eser olduğu ve olağanüstü olaylar içerdiği için yönetim hakkında kesin bilgi vermez. D kaynağının yazarı ve kaynakçası olmadığı için bilgilerinin doğruluğu kontrol edilemez; bu yüzden güvenilir değildir. Elif A ve B kaynaklarını birlikte kullanmalıdır. Böylece Türklerin kendi anlattıklarını komşularının anlattıklarıyla karşılaştırabilir ve iki kaynakta da yer alan bilgileri daha güvenilir kabul edebilir.",
 elements:["Her kaynak için güçlü ve zayıf yön","D kaynağının güvenilmezliği","A ve B'nin birlikte kullanılması","Çapraz kontrol gerekçesi"],
 rubric:[["A kaynağının değerlendirilmesi",3],["B kaynağının değerlendirilmesi",3],["C kaynağının değerlendirilmesi",3],["D kaynağının değerlendirilmesi",3],["Birlikte kullanılacak iki kaynağın seçimi ve karşılaştırma gerekçesi",8]],
 partial:["Kaynak için yalnızca güçlü ya da yalnızca zayıf yön yazılmışsa ilgili ölçütten 1,5 puan.","A ve C seçilip gerekçesi tutarlı biçimde (ör. Türklerin kendi bakış açısı) açıklanırsa son ölçütten 5 puan.","D kaynağı seçilmişse son ölçütten puan verilmez."]

{lvl:"zor",comp:"d",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Toplum yapısı</span><p>Aile (oguş) sosyal hayatın en küçük birimiydi. Ailelerin birleşmesiyle urug (sülale), urugların birleşmesiyle boylar oluşurdu. Boylar bir araya gelerek budunu (millet) oluşturuyordu. Devlet ise “il” olarak adlandırılıyordu.</p>
<span class="src">Ahmetbeyoğlu (2018)'den ders kitabına alınan metin.</span></div>
<div><span class="srclabel">Kaynak 2 · Bilgi kutusu</span><p>Her boyun kendine ait adı ve damgası bulunuyordu. Türkistan'daki boylardan bazılarının adlarına günümüzde Anadolu'daki yerleşim yerlerinde rastlanmaktadır: Bayat (Afyonkarahisar, Çorum), Çiğil (Konya), Kınık (İzmir).</p></div>
<div><span class="srclabel">Kaynak 3 · Töre</span><p>Töre, sosyal hayatı düzenleyen yazısız kurallardı. Değişen şartlara göre bazı hükümleri değişebilirdi; ancak könilik (adalet), uzluk (iyilik), tüzlük (eşitlik) ve kişilik (insanlık) ilkeleri kesinlikle değişmezdi.</p>
<span class="src">Çift ve Taşağıl (2022)'den ders kitabına alınan metin.</span></div></div>`,
stem:"Üç kaynaktaki bilgilere dayanarak üç çıkarım yapınız: (1) Kaynak 1'den ailenin devletle ilişkisine dair bir çıkarım, (2) Kaynak 2'den Türkistan ile Anadolu arasındaki bağa dair bir çıkarım, (3) Kaynak 3'ten törenin günümüz hukuk anlayışımıza katkısına dair bir çıkarım. Her çıkarımınızı ilgili kaynaktaki bir bilgiye dayandırınız.",
lines:9,
key:{
 expected:"(1) Devlet ailelerin birleşmesiyle aşama aşama oluşan bir yapıdır; aile devletin temelidir, aile güçlü olursa devlet de güçlü olur. (2) Türkistan'daki boy adlarının Anadolu'daki yer adlarında bulunması, bu boyların Türkistan'dan Anadolu'ya göç ettiğini ve Anadolu'yu yurt edindiğini gösterir; Anadolu ile Türkistan arasında köklü bir tarihî bağ vardır. (3) Adalet, eşitlik, iyilik ve insanlık ilkeleri günümüz hukukunun da temel ilkeleridir; töre bu değerleri kuşaktan kuşağa aktararak hukuk anlayışımıza katkı sağlamıştır.",
 sample:"Birincisi, Kaynak 1'e göre aileler birleşerek sülaleleri, sülaleler boyları, boylar da milleti oluşturuyordu. Buna göre ilk Türk devletlerinde aile devletin temel taşıydı; aileler güçlü olmadan devlet de güçlü olamazdı. İkincisi, Bayat, Çiğil ve Kınık gibi Türkistan'daki boy adlarının Afyonkarahisar, Konya ve İzmir'deki yerleşim yerlerinde bulunması, bu boyların zamanla Anadolu'ya gelip yerleştiğini gösterir; yani Anadolu ile Türkistan arasında köklü bir bağ vardır. Üçüncüsü, törenin değişmeyen ilkeleri olan adalet, eşitlik, iyilik ve insanlık günümüz hukukunda da temel ilkelerdir. Bu da ilk Türk devletlerindeki hukuk anlayışının bugünkü hukuk anlayışımıza katkı sağladığını gösterir.",
 elements:["Aile-devlet çıkarımı","Türkistan-Anadolu bağı çıkarımı","Töre-günümüz hukuku çıkarımı","Her çıkarımın kaynağa dayanması"],
 rubric:[["Birinci çıkarım ve Kaynak 1'e dayanması",6],["İkinci çıkarım ve Kaynak 2'ye dayanması",7],["Üçüncü çıkarım ve Kaynak 3'e dayanması",7]],
 partial:["Kaynak bilgisi tekrar edilmiş ama çıkarım yapılmamışsa ilgili ölçütün en fazla üçte biri verilir.","Çıkarım yapılmış ama kaynakla ilişkilendirilmemişse ilgili ölçütün yarısı verilir."]
}},
{lvl:"zor",comp:"d",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Yaşam biçimi</span><p>Yüksek dağların arasında geniş ve kurak düzlüklere sahip Türkistan'da temel geçim kaynağı hayvancılıktı. İnsanlar hayvanlarına otlak bulmak için yazın yaylalara, kışın ovalara göç ederek konargöçer bir yaşam sürmüş, çadırlarda yaşamışlardır.</p></div>
<div><span class="srclabel">Kaynak 2 · Sanat</span><p>Bu dönemin sanat anlayışı taşınabilir eşyaların süslemelerinde görülür. Kemer tokaları, kılıç ve hançer kabzaları, at koşum takımları üzerinde pars, kurt, geyik, at gibi hayvan figürleri işlenmiştir. Ahşap oymacılığı ve maden işlemeciliği gelişmiştir.</p></div>
<div><span class="srclabel">Kaynak 3 · Uygurlar</span><p>Uygurların yerleşik hayata geçmesi sanat anlayışlarını da etkilemiştir. Mimari eserler, özellikle tapınaklar bu dönemde görülür; minyatür sanatı örneklerine rastlanır.</p></div>
<span class="src">Kaynaklar ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Kaynakları birlikte değerlendirerek (1) ilk Türklerde sanat eserlerinin genellikle taşınabilir olmasının nedenini, (2) eserlerde hayvan figürlerinin çok kullanılmasının nedenini ve (3) mimarinin en çok Uygurlarda görülmesinin nedenini çıkarım yoluyla açıklayınız. Son olarak üç çıkarımınızdan hareketle bir toplumun yaşam biçimi ile sanatı arasındaki ilişkiye dair genel bir sonuç cümlesi yazınız.",
lines:9,
key:{
 expected:"(1) Konargöçer yaşamda sürekli göç edildiği için eşyaların kolay taşınabilir olması gerekiyordu; sanat bu eşyalar üzerinde gelişti. (2) Geçim hayvancılığa dayandığı ve insanlar doğayla, hayvanlarla iç içe yaşadığı için hayvanlar sanatın konusu oldu. (3) Uygurlar yerleşik hayata geçtiği için kalıcı yapılar (tapınaklar) inşa etmeye başladılar; konargöçer toplumlar kalıcı yapı yapmaz. Genel sonuç: Bir toplumun yaşam biçimi ve geçim kaynağı sanatının türünü, malzemesini ve konusunu belirler.",
 sample:"İlk Türkler konargöçer bir hayat sürdükleri ve yazın yaylalara, kışın ovalara göç ettikleri için yanlarında kolayca taşıyabilecekleri eşyaları süslemişlerdir; bu yüzden sanat eserleri genellikle taşınabilirdir. Geçimlerini hayvancılıkla sağladıkları ve hayvanlarla iç içe yaşadıkları için pars, kurt, geyik ve at gibi hayvanlar eserlerinde sıkça yer almıştır. Uygurlar ise yerleşik hayata geçtikleri için kalıcı yapılar yapmaya başlamış, bu nedenle mimari eserlere en çok onlarda rastlanmıştır. Bu üç çıkarım bize, bir toplumun nasıl yaşadığının ve nasıl geçindiğinin sanatını da belirlediğini göstermektedir.",
 elements:["Taşınabilirlik çıkarımı","Hayvan figürü çıkarımı","Uygur mimarisi çıkarımı","Genel sonuç"],
 rubric:[["Taşınabilirliğin konargöçer yaşamla açıklanması",5],["Hayvan figürlerinin hayvancılık ve doğayla açıklanması",5],["Uygur mimarisinin yerleşik hayatla açıklanması",5],["Yaşam biçimi ile sanat arasındaki ilişkiye dair genel sonuç",5]],
 partial:["Çıkarım yerine yalnızca kaynak bilgisi tekrar edilmişse ilgili ölçütten 2 puan.","Genel sonuç yalnızca Türkler için yazılmışsa (genelleme yapılmamışsa) son ölçütten 3 puan."]
}},

material:`<div class="mat"><span class="cap">Türkistan'da kurulan ilk Türk devletleri</span>
<ol class="tl">

<li><span class="age">682</span>II. Göktürk Devleti kuruldu (Kutluk / İlteriş Kağan).</li>
<li><span class="age">744</span>Uygur Devleti kuruldu.</li>

<p style="margin-top:8px">Mustafa Kemal Atatürk, Türk tarihinin araştırılmasının millî kimliğin oluşmasında etkili olacağını düşünerek Türk Tarih Kurumunun kurulmasına öncülük etmiştir. Atatürk'e göre Türk çocuğu atalarını tanıdıkça daha büyük işler yapmak için kendinde kuvvet bulacaktır.</p>
<span class="src">Kaynak: Ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Zaman şeridindeki devletlerden biriyle ilgili, medeniyetimize katkılarını araştırmak üzere merak ettiğiniz bir konuyu belirleyiniz. Konunuzu bir araştırma sorusu biçiminde yazarak sınırlarını (hangi devlet, hangi dönem, hangi alan) belirtiniz. Bu konuyu araştırmanın neden önemli olduğunu bilgi notundan yararlanarak açıklayınız. Konunuz hakkında bilgi toplamak için kullanacağınız iki farklı türde kaynağı ve bu kaynakları neden seçtiğinizi yazınız.",
lines:9,
key:{
 expected:"Cevap açık uçludur. Beklenen: (1) Zaman şeridindeki bir devlete ve medeniyet alanına (yönetim, ordu, sanat, ekonomi, yazı, hukuk vb.) odaklanan, cevabı tek kelime olmayan bir araştırma sorusu (ör. “II. Göktürk Devleti Dönemi'nde Orhun Kitabeleri'nin yazılması Türk dili ve tarih yazımına nasıl bir katkı sağlamıştır?”). (2) Sınırların açıkça belirtilmesi: devlet, tarih aralığı (ör. 682–745), alan. (3) Önem: Atatürk'ün atalarını tanımanın güç verdiği görüşü, millî kimlik, TTK'nın amacıyla ilişkilendirme. (4) İki farklı kaynak türü ve gerekçesi (ör. birinci el kaynak: Orhun Kitabeleri çevirisi; araştırma eseri: TTK yayını / akademik kitap; müze, kazı raporu).",
 sample:"Araştırma sorum: “II. Göktürk Devleti Dönemi'nde (682–745) yazılan Orhun Kitabeleri, Türk dilinin ve tarih yazıcılığının gelişmesine nasıl katkı sağlamıştır?” Konumun sınırları: devlet II. Göktürk Devleti, dönem 682–745, alan dil ve yazı. Bu konuyu araştırmak önemlidir, çünkü Atatürk'e göre atalarımızı tanıdıkça daha büyük işler yapmak için güç buluruz; Türklerin kendi yazdığı ilk belgeyi tanımak millî kimliğimizi anlamamızı sağlar. Bilgi toplamak için önce Orhun Kitabeleri'nin güvenilir bir çevirisini kullanırım, çünkü bu, Türklerin kendi yazdığı birinci el kaynaktır. İkinci olarak Türk Tarih Kurumunun yayımladığı bir araştırma kitabını kullanırım, çünkü uzman tarihçilerin değerlendirmelerini içerir.",
 elements:["Araştırma sorusu","Sınırlar: devlet, dönem, alan","Önem ve bilgi notuyla bağlantı","İki farklı kaynak türü ve gerekçesi"],

}}

material:`<div class="mat"><span class="cap">Hz. Muhammed (sav) Dönemi'nde eğitim (622–632)</span>
<p>Hz. Muhammed (sav) ilme, eğitime ve öğretime önem vermiştir. Onun döneminde Mescid-i Nebevi'nin arkasına, kimsesiz Müslümanların barınabileceği ve aynı zamanda ilim öğrenebileceği “suffe” adı verilen bir bölüm yapılmıştır. “Küttâb” adı verilen eğitim kurumlarında çocuklara ilk dinî eğitimler verilmiştir. Hz. Muhammed (sav), Bedir Savaşı'nda esir alınan Mekkeli müşriklerden okuma yazma bilenlerin, on Müslüman'a okuma yazma öğretmeleri karşılığında serbest bırakılmasını sağlamıştır.</p>

stem:"Metinde Hz. Muhammed (sav) Dönemi'nde eğitime verilen önemi gösteren üç uygulamayı belirleyiniz. Bu uygulamalardan birinin okuma yazmanın yaygınlaşmasına nasıl katkı sağladığını açıklayınız.",
lines:4,
key:{

material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1</span><p>Müslümanlar arasındaki yaygın kanaate göre Kur'an-ı Kerim Hz. Peygamber Dönemi'nde yazılmış, ilk halife Hz. Ebu Bekir Dönemi'nde bir araya getirilerek iki kapak arasına alınmış, üçüncü halife Hz. Osman Dönemi'nde ise çoğaltılmıştır.</p><span class="src">Aydın (2008)'den ders kitabına alınan metin.</span></div>
<div><span class="srclabel">Kaynak 2</span><p>Hz. Ömer'in talimatıyla Kûfe, Basra ve Fustat (Kahire) şehirleri kurulmuş; bu şehirlere vali, kadı ve çeşitli görevliler atanmıştır. Hz. Ömer Dönemi'nde başlangıcı hicret yılı olan 622 kabul edilen hicri takvim kullanılmaya başlanmış, divan teşkilatı kurulmuştur. Hz. Ömer açıklık ve hesap verebilirlik ilkeleri doğrultusunda beytülmal (devlet hazinesi) teşkilatını kurmuştur.</p><span class="src">Akkuş (2023)'ten ders kitabına alınan metin.</span></div>
<div><span class="srclabel">Kaynak 3</span><p>Hz. Ali eğitime ve bilime büyük önem vermiş, açtığı okullara öğretmenler görevlendirmiş, kendisi de bu okullarda derslere katılmıştır. “İlim bayrağımdır, nereye gitsem benimledir.” sözü bunu göstermektedir.</p></div></div>`,
stem:"Kaynaklardan yararlanarak Dört Halife Dönemi'nde Hz. Ebu Bekir, Hz. Ömer, Hz. Osman ve Hz. Ali'nin İslam medeniyetine yaptığı katkıları belirleyiniz. Her halife için en az bir katkı yazınız ve Hz. Ömer Dönemi'ndeki gelişmelerden birinin devletin kurumsallaşmasına nasıl katkı sağladığını açıklayınız.",
lines:6,
key:{

stem:"İki kaynaktan hareketle İslam medeniyetinin hukuk alanında insanlığın ortak mirasına katkısına dair iki çıkarım yapınız. Çıkarımlarınızdan birinde Veda Hutbesi ile İnsan Hakları Evrensel Bildirgesi arasındaki benzerliğin ne gösterdiğini, diğerinde Medine Vesikası'nın farklı toplulukların bir arada yaşamasına katkısını açıklayınız.",
lines:6,
key:{

lines:6,

{lvl:"zor",comp:"c",mat:"Bilgi metni + akış",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1</span><p>VII-XIII. yüzyıllar arasında Avrupa'da karanlık bir dönem yaşanırken İslam medeniyeti bilimsel açıdan altın çağını yaşamıştır.</p></div>
<div><span class="srclabel">Kaynak 2</span><p>Fetihler sebebiyle geniş bir alana yayılan Müslümanlar; Eski Yunan, İran ve kısmen Hint kültürüyle temas kurmuş, antik dünyanın bilim ve felsefe eserlerini Arapçaya çevirmiştir. Emeviler Dönemi'nde başlayan bu faaliyetler Abbasiler Dönemi'nde cebir ve geometri gibi alanları da kapsayacak şekilde genişlemiştir. Müslümanlar yalnızca tercüme yapmakla kalmamış, dinî ve pozitif bilimlerde değerli eserler yazmıştır. Bu eserler İspanya aracılığıyla Avrupa'ya geçerek Avrupa'yı etkilemiştir.</p></div>
<div><span class="srclabel">Kaynak 3</span><p>Avrupalıların kâğıt kullanımını Endülüs'teki Müslümanlardan öğrenmesi, bilginin hızlı yayılmasına zemin hazırlamıştır.</p></div>
<span class="src">Kaynaklar ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Kaynaklardaki bilgileri kullanarak antik dünyanın bilgi birikiminin Avrupa'ya ulaşma sürecini en az dört aşamalı bir akış olarak yazınız. Bu akıştan hareketle İslam medeniyetinin bilim tarihindeki rolünü anlatmak için neden “köprü” benzetmesinin kullanılabileceğine dair bir çıkarım yapınız. Bu köprünün yalnızca taşıma değil aynı zamanda geliştirme işlevi gördüğünü kaynaklardan bir bilgiyle gösteriniz.",
lines:9,
key:{
 expected:"Akış: Antik Yunan, İran, Hint bilim ve felsefe eserleri → Müslümanların bu kültürlerle teması → eserlerin Arapçaya çevrilmesi (Emeviler, Abbasilerde genişleme) → Müslümanların yeni eserler yazması → eserlerin İspanya (Endülüs) aracılığıyla Avrupa'ya geçmesi; kâğıdın yardımıyla bilginin hızla yayılması → Avrupa'nın etkilenmesi. Köprü çıkarımı: Avrupa'nın karanlık döneminde antik bilgiyi koruyup sonraki çağlara ve Avrupa'ya aktaran İslam medeniyeti iki dünya arasında bağlantı kurmuştur. Geliştirme: Müslümanlar yalnızca tercüme etmemiş, cebir ve geometri gibi alanlarda yeni eserler yazmıştır.",
 sample:"1. Antik Yunan, İran ve Hint medeniyetlerinde bilim ve felsefe eserleri yazıldı. → 2. Fetihlerle bu kültürlerle tanışan Müslümanlar eserleri Arapçaya çevirdi. → 3. Müslümanlar bu bilgileri geliştirerek yeni eserler yazdı. → 4. Bu eserler İspanya üzerinden Avrupa'ya geçti; kâğıdın kullanılması da bilginin hızla yayılmasını sağladı. Avrupa'nın karanlık bir dönem yaşadığı yüzyıllarda antik bilgi Müslümanlar sayesinde korunmuş ve Avrupa'ya ulaşmıştır; bu yüzden İslam medeniyeti eski çağlarla Avrupa arasında bir köprü gibidir. Ancak bu köprü bilgiyi yalnızca taşımamıştır; Müslümanlar cebir ve geometri gibi alanlarda yeni eserler yazarak bilgiyi geliştirmiştir.",
 elements:["Dört aşamalı doğru sıralı akış","Köprü benzetmesine dayanan çıkarım","Geliştirme işlevini gösteren bilgi"],
 rubric:[["Akışın en az dört doğru aşamayla ve doğru sırayla yazılması",8],["Köprü benzetmesinin Kaynak 1 ve akışla ilişkilendirilen çıkarımı",7],["Geliştirme işlevinin kaynaktan bir bilgiyle gösterilmesi",5]],
 partial:["Akışta sıra karışıksa ilk ölçütten 4 puan.","Üç aşamalı akış için ilk ölçütten 5 puan.","Köprü çıkarımı Avrupa'nın durumuna (Kaynak 1) değinmeden yapılmışsa ikinci ölçütten 4 puan."]
}},
{lvl:"zor",comp:"c",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Emeviler ve Abbasiler</span><p>Emeviler Arap olmayan Müslümanları “mevali” olarak adlandırmış ve Arap Müslümanları onlardan üstün görmüştür. Bu düşünce biçimi İslamiyet'in yayılmasını yavaşlatmıştır. Abbasiler ise mevali politikasına son vererek Müslümanlar arasındaki eşitsizliği ortadan kaldırmış; bu durum İslamiyet'in yayılmasını hızlandırmıştır.</p></div>
<div><span class="srclabel">Kaynak 2 · Beytülhikme</span><p>Farklı etnik ve dinî kökenlere ait düşüncelerin de değerli görüldüğü Beytülhikme'de dünyanın değişik coğrafyalarından bilginler buluşmuştur.</p></div>
<div><span class="srclabel">Kaynak 3 · Endülüs</span><p>Endülüs'te farklı toplumlarla bir arada yaşayan Müslümanlar çeşitli kültürlerle etkileşime girmiş, bu etkileşim bilim alanında da kendini göstermiştir. Farklı bilimsel birikimlerin bir araya gelmesiyle kendine özgü bir düşünce yapısı oluşmuştur.</p></div>
<span class="src">Kaynaklar ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Üç kaynağı birlikte değerlendirerek farklılıklara açık olmanın ve eşitliğin İslam medeniyetinin gelişmesine etkisine dair bir çıkarım yapınız. Çıkarımınızı Kaynak 1'deki iki farklı politikanın sonuçlarını karşılaştırarak ve Kaynak 2 ile Kaynak 3'ten birer örnekle destekleyiniz. Son olarak bu çıkarımın günümüz bilim dünyası için ne anlama gelebileceğini bir cümleyle yazınız.",
lines:9,
key:{
 expected:"Çıkarım: Farklı kökenden insanlara eşit davranıldığında ve farklı düşünceler değerli görüldüğünde medeniyet daha hızlı yayılmış ve bilimde daha çok gelişmiştir. Karşılaştırma: Emevilerin ayrımcı mevali politikası yayılmayı yavaşlatmış; Abbasilerin eşitlik politikası hızlandırmıştır. Destek: Beytülhikme'de farklı coğrafya, etnik ve dinî kökenlerden bilginlerin buluşması; Endülüs'te farklı kültürlerin etkileşimiyle özgün bir düşünce yapısının oluşması. Günümüz: Bilimde farklı ülkelerden ve kültürlerden insanların iş birliği yapması yeni bilgilerin üretilmesini kolaylaştırır.",
 sample:"Kaynaklara göre farklılıklara açık olmak ve insanlara eşit davranmak İslam medeniyetinin gelişmesini hızlandırmıştır. Emeviler Arap olmayan Müslümanları aşağı gördüğünde İslamiyet'in yayılması yavaşlamış; Abbasiler bu eşitsizliği kaldırdığında ise yayılma hızlanmıştır. Beytülhikme'de farklı etnik ve dinî kökenlerden bilginlerin bir araya gelmesi, bu açıklığın bilime de yansıdığını gösterir. Endülüs'te de farklı kültürlerle bir arada yaşanması, farklı bilgilerin birleşerek kendine özgü bir düşünce yapısı oluşturmasını sağlamıştır. Bu çıkarım günümüzde de farklı ülkelerden bilim insanlarının birlikte çalışmasının bilimi daha hızlı ilerleteceğini düşündürmektedir.",
 elements:["Açık bir çıkarım","Mevali ve eşitlik politikalarının sonuçlarının karşılaştırılması","Kaynak 2'den örnek","Kaynak 3'ten örnek","Günümüze yönelik cümle"],
 rubric:[["Farklılıklara açıklık ve eşitliğin etkisine dair açık çıkarım",4],["Kaynak 1'deki iki politikanın sonuçlarının karşılaştırılması",5],["Kaynak 2'den destekleyici örnek",3.5],["Kaynak 3'ten destekleyici örnek",3.5],["Çıkarımın günümüz bilim dünyasıyla ilişkilendirilmesi",4]],
 partial:["Politikalar ayrı ayrı anlatılmış ama sonuçları karşılaştırılmamışsa ikinci ölçütten 2,5 puan.","Günümüze yönelik cümle kaynaklardaki çıkarımla ilgisizse son ölçütten 1 puan."]
}},
{lvl:"zor",comp:"c",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · İslam şehirlerinin yapısı</span><p>Kurulan İslam şehirlerinin çekirdeğini oluşturan en önemli yapılar cami ve dârülimâre (yönetim binası) idi. Özellikle cami, her zaman şehrin çekirdeğinde yer aldığı için şehir merkezini belirleyen en önemli unsur olmuştur. Divan, beytülmal, hamam, hapishane ve mezarlık gibi unsurlar da şehirde yer almıştır.</p><span class="src">Çil (2009)'dan ders kitabına alınan metin.</span></div>
<div><span class="srclabel">Kaynak 2 · Yeni şehirler</span><p>Hz. Ömer'in talimatıyla Kûfe, Basra ve Fustat şehirleri kurulmuş; bu şehirlere vali, kâtip, kadı ve askerlik, güvenlik, vergi ve maliyeden sorumlu memurlar atanmıştır.</p></div>
<div><span class="srclabel">Kaynak 3 · Samerra</span><p>Abbasi Halifesi Mu'tasım, Bağdat'ın yaklaşık 100 km kuzeyinde Samerra şehrini kurmuştur. Samerra'nın mükemmel planı, cami ve saraylarının mimari özellikleri İslam medeniyetinin ihtişamını ve sanata verilen değeri yansıtır.</p></div>
<span class="src">Kaynaklar ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Kaynaklara dayanarak İslam şehirlerinin yapısından hareketle üç çıkarım yapınız: (1) caminin şehrin merkezinde yer almasından toplumsal hayata dair, (2) şehirlerde bulunan yönetim yapıları ve atanan görevlilerden devlet düzenine dair, (3) Samerra örneğinden mimari ve şehir planlamasına dair. Son olarak bu çıkarımlardan birini günümüz şehirleriyle karşılaştırınız.",
lines:9,
key:{
 expected:"(1) Caminin merkezde olması, toplumsal hayatın ibadet, eğitim ve bir araya gelme etrafında şekillendiğini; caminin yalnızca ibadet değil buluşma ve eğitim yeri olduğunu gösterir. (2) Dârülimâre, divan, beytülmal ile vali, kadı, vergi memuru gibi görevlilerin bulunması; şehirlerin planlı bir yönetim, adalet ve maliye düzeniyle yönetildiğini, devletin kurumsallaştığını gösterir. (3) Samerra'nın planlı kurulması, mimaride ihtişam ve estetiğe, şehir planlamasına önem verildiğini gösterir. Günümüzle karşılaştırma: Günümüz şehirlerinde de valilik, adliye, belediye gibi kurumlar ve merkezde meydanlar, cami gibi buluşma yerleri bulunur; planlı şehircilik bugün de önemlidir.",
 sample:"Caminin şehrin tam ortasında yer alması, insanların günlük hayatının caminin çevresinde şekillendiğini, caminin ibadetin yanında bir buluşma ve eğitim yeri olduğunu gösterir. Şehirlerde yönetim binası, divan ve devlet hazinesinin bulunması ve vali, kadı, vergi memuru gibi görevlilerin atanması, şehirlerin düzenli bir yönetim, adalet ve maliye sistemiyle yönetildiğini gösterir. Samerra'nın mükemmel bir planla kurulması ise İslam medeniyetinde şehirlerin önceden planlandığını ve mimariye büyük önem verildiğini gösterir. Günümüzde de illere vali atanır, adliyeler ve belediyeler şehirlerin düzenini sağlar; yani İslam şehirlerindeki yönetim düzeni bugünkü şehirlerimize benzemektedir.",
 elements:["Cami ve toplumsal hayat çıkarımı","Yönetim yapıları ve devlet düzeni çıkarımı","Samerra ve planlama çıkarımı","Günümüzle karşılaştırma"],
 rubric:[["Birinci çıkarım (cami ve toplumsal hayat)",5],["İkinci çıkarım (yönetim yapıları, görevliler ve devlet düzeni)",5],["Üçüncü çıkarım (Samerra, mimari ve şehir planlaması)",5],["Çıkarımlardan birinin günümüz şehirleriyle karşılaştırılması",5]],
 partial:["Kaynak bilgisi yalnızca tekrar edilmişse ilgili çıkarımdan 2 puan.","Karşılaştırmada yalnızca benzerlik ya da yalnızca farklılık açıklanmışsa tam puan verilir; ancak karşılaştırma kaynaktaki bir bilgiyle ilişkilendirilmelidir."]
}}
]});

material:`<div class="mat twosrc">

lines:10,
key:{
 expected:"Proje Kaynak 1'deki üç boyutu karşılamalı: ulaşım, uygun etkinlik ve ortak sosyal alan; aile yükü. Örnek: “Hafta Sonu Birlikteyiz” – belediyenin erişilebilir servisiyle gençleri spor salonu, sinema ve kütüphaneye götürmesi; gönüllü akran eşlikçiler; uyarlanmış etkinlikler (sesli betimlemeli film, oturarak oynanan sporlar); ailelere mola. Kaynak 2'den yararlanma: uzman eşliğinde etkinlik ve ailelere zaman kazandırma fikri. Farklılık: gençlerin akranlarıyla birlikte ortak alanlarda (kapsayıcı) vakit geçirmesi, ulaşım desteği. Sürdürülebilirlik: belediye bütçesi, gönüllü ağı, okul kulüpleriyle iş birliği, düzenli değerlendirme anketi.",

lines:10,

 sample:"Durum A için önermem, Türk toplumunun suyu tasarruflu kullanma kampanyalarına geniş katılım göstereceği ve belediyelerle birlikte su kaynaklarını koruma çalışmaları yapacağıdır. Bilgi notunda bireylerin yalnızca kendilerinden değil çevrelerinden de sorumlu olduklarını anladıkları yazmaktadır. Nitekim 6 Şubat depremlerinden sonra da toplum ortak bir amaç için birlikte çalışmıştır. Durum B için önermem, toplumun bilim insanlarımızı sahipleneceği ve başarılarını gururla kutlayacağıdır; bilgi notuna göre toplum bilimden spora her alanda ortak bir irade etrafında kenetlenir. Aziz Sancar'ın Nobel ödülü ve Alper Gezeravcı'nın uzaya gitmesi de ülke genelinde gururla karşılanmıştır. Su tasarrufu kampanyasına herkesin katılması toplumsal birlikteliğe katkı sağlar, çünkü insanlar ortak bir sorunu birlikte çözdüklerini gördükçe birbirlerine güvenir ve aynı milletin parçası olma duyguları güçlenir.",

material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Millî kimlik</span><p>Millî kimlik; bir milletin kendine özgü düşünüş, yaşayış, dil, töre ve gelenekleri ile toplumsal değer yargılarından oluşan özellikler bütünüdür. İnsan millî kimliği sayesinde kim olduğunu, nereden geldiğini ve hangi değerlere sahip olduğunu anlar. Orhun Yazıtları, Türk milletinin birlik ve beraberliğini, yöneticilerin millete karşı sorumluluklarını ve vatan sevgisini anlatan millî kimlik bilincinin en güzel örneklerinden biridir.</p></div>
<div><span class="srclabel">Kaynak 2 · Tekâlif-i Millîye</span><p>Millî Mücadele'de halk, elindeki yiyecek, giyecek, araç ve gereçleri orduyla paylaşmıştır.</p></div>
<div><span class="srclabel">Kaynak 3 · 6 Şubat depremleri</span><p>Deprem sonrasında tüm Türkiye tek yürek oldu; devlet kurumları, sivil toplum kuruluşları ve vatandaşlar birlikte çalıştı.</p></div>

<span class="src">Kaynaklar ders kitabındaki bilgilerden derlenmiştir.</span></div>`,
stem:"Kaynak 2, 3 ve 4'teki tutum ve davranışları toplumsal birlikteliğe etkisi açısından değerlendiriniz. Değerlendirmenizde bu davranışların Kaynak 1'deki millî kimlik bilinciyle ilişkisini açıklayınız. Son olarak dayanışmanın yalnızca zor zamanlarda değil günlük hayatta da sürdürülmesinin neden önemli olduğunu gerekçesiyle belirtiniz.",
lines:10,
key:{
 expected:"Değerlendirme: Tekâlif-i Millîye – bireysel imkânların ortak amaç için paylaşılması, fedakârlık; bağımsızlığın kazanılmasını ve millî birliği sağlamıştır. Deprem dayanışması – farklı kurum ve kişilerin “tek yürek” olması; güveni ve kardeşlik duygusunu güçlendirmiştir. Madalyaların millete armağanı – bireysel başarının toplumla paylaşılması; vefa, millî aidiyet ve gurur. Millî kimlikle ilişkisi: Ortak değerler (vatan sevgisi, birlik, sorumluluk) bireylerin kendilerini aynı milletin parçası hissetmesini sağlar; bu davranışlar millî kimliğin günlük hayata yansımasıdır, Orhun Yazıtları'ndaki birlik ve sorumluluk anlayışının devamıdır. Günlük hayatta sürdürme: Dayanışma yalnızca krizde kalırsa birlik duygusu zayıflar; günlük yardımlaşma, komşuluk, kurallara uyma, çevreyi koruma güveni ve toplumsal bağları sürekli güçlü tutar, zor zamanlara hazırlıklı olmayı sağlar.",
 sample:"Tekâlif-i Millîye'de halkın elindekini orduyla paylaşması, herkesin kendi imkânını ortak amaç için kullanmasıdır; bu fedakârlık bağımsızlığın kazanılmasını ve milletin birlik olmasını sağlamıştır. 6 Şubat depremlerinden sonra devletin, kurumların ve vatandaşların birlikte çalışması insanlara yalnız olmadıklarını göstermiş, birbirine güveni artırmıştır. Naim Süleymanoğlu'nun madalyalarını millete armağan etmesi ise bireysel bir başarının bütün milletle paylaşılmasıdır; bu da millî aidiyet ve gurur duygusunu güçlendirir. Bu davranışların hepsi Kaynak 1'deki millî kimlik bilinciyle ilgilidir; çünkü insanlar kim olduklarını ve hangi değerlere sahip olduklarını bildikleri için birbirlerine karşı sorumluluk hisseder. Orhun Yazıtları'nda anlatılan birlik ve sorumluluk anlayışı bugün de bu davranışlarda yaşamaktadır. Dayanışmanın günlük hayatta da sürdürülmesi önemlidir; çünkü komşuluk, yardımlaşma ve çevreyi koruma gibi davranışlar toplumsal bağları her zaman güçlü tutar ve zor zamanlarda birlikte hareket etmeyi kolaylaştırır.",
 elements:["Üç kaynaktaki davranışların toplumsal birlikteliğe etkisi","Millî kimlik bilinciyle ilişki","Günlük hayatta dayanışmanın önemi"],
 rubric:[["Kaynak 2'deki davranışın toplumsal birlikteliğe etkisinin değerlendirilmesi",4],["Kaynak 3'teki davranışın toplumsal birlikteliğe etkisinin değerlendirilmesi",4],["Kaynak 4'teki davranışın toplumsal birlikteliğe etkisinin değerlendirilmesi",4],["Davranışların Kaynak 1'deki millî kimlik bilinciyle ilişkilendirilmesi",4],["Dayanışmanın günlük hayatta sürdürülmesinin öneminin gerekçelendirilmesi",4]],
 partial:["Davranış yalnızca özetlenip toplumsal birlikteliğe etkisi değerlendirilmemişse ilgili ölçütten 1,5 puan."]
}},

{lvl:"zor",comp:"b",mat:"Üç kaynak → kavram haritası",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · İletişim</span><p>Genel ağın ve mobil cihazların yaygınlaşmasıyla bilgiye ulaşmak kolaylaşmıştır. Görüntülü ve sesli iletişim cihazları sayesinde ekonomik ilişkiler hızlanmış, uzaktaki tanıdıklarla canlı görüşmek mümkün olmuştur. E-ticaret sayesinde evden çıkmadan başka ülkelerle alışveriş yapılabilmektedir.</p></div>
<div><span class="srclabel">Kaynak 2 · Kültür ve değerler</span><p>Kültürel etkileşimle birlikte konuşma dilinde bozulmalar, hazır gıda tüketiminin artması, aşırı ve gereksiz alışveriş gibi sorunlar ortaya çıkmaktadır. Bireylerin küreselleşmenin imkânlarından yararlanırken bilinçli tercihler yapmaları önemlidir.</p></div>
<div><span class="srclabel">Kaynak 3 · Sağlık</span><p>Türk İş Birliği ve Koordinasyon Ajansı (TİKA), Senegal'in Touba kentinde yılda yaklaşık 25 bin kişiye hizmet veren bir halk sağlığı merkezinin acil servis birimini modern tıbbi ekipmanlarla donatmıştır.</p></div>
<span class="src">Kaynaklar ders kitabındaki bilgi ve haberlerden derlenmiştir.</span></div>`,
stem:"Üç kaynaktaki bilgileri, merkezinde “Küreselleşme” yazan bir kavram haritasına dönüştürünüz. Haritanızda “İnsan hayatına etkileri” ve “Toplum hayatına etkileri” olmak üzere iki ana dal; bu dalların altında da kaynaklardan alınmış en az ikişer örnek bulunsun. Her örneğin yanına olumlu (+) ya da olumsuz (−) işareti koyunuz. Haritanın altına, haritanızdan çıkardığınız genel sonucu bağlamdan kopmadan bir cümleyle yazınız.",
lines:10,
key:{
 expected:"İnsan hayatına etkileri (örnekler): bilgiye kolay ulaşma (+), uzaktaki yakınlarla canlı görüşme (+), evden başka ülkelerle alışveriş (+), konuşma dilinde bozulma (−), hazır gıda tüketiminin artması (−), aşırı/gereksiz alışveriş (−). Toplum hayatına etkileri: ekonomik ilişkilerin hızlanması (+), ülkeler arası sağlık iş birliği – Senegal'de 25 bin kişiye hizmet veren acil servisin donatılması (+), kültürel değerlerin zayıflama riski (−). Genel sonuç: Küreselleşme insan ve toplum hayatına hem olumlu hem olumsuz etkiler yapmaktadır; bu yüzden imkânlarından yararlanırken bilinçli tercih yapmak gerekir.",
 sample:"Küreselleşme\n├─ İnsan hayatına etkileri\n│   ├─ (+) Bilgiye ulaşmak kolaylaştı (Kaynak 1)\n│   ├─ (+) Uzaktaki yakınlarla canlı görüşülebiliyor (Kaynak 1)\n│   └─ (−) Hazır gıda tüketimi ve gereksiz alışveriş arttı (Kaynak 2)\n└─ Toplum hayatına etkileri\n    ├─ (+) Ekonomik ilişkiler hızlandı (Kaynak 1)\n    ├─ (+) Ülkeler sağlık alanında iş birliği yapıyor; Senegal'de bir acil servis donatıldı (Kaynak 3)\n    └─ (−) Konuşma dilinde bozulmalar görülüyor (Kaynak 2)\nGenel sonuç: Küreselleşme hem insan hem toplum hayatına olumlu ve olumsuz etkiler yaptığı için imkânlarından bilinçli tercihler yaparak yararlanmalıyız.",
 elements:["İki ana dal","Her dalda en az iki kaynaktan örnek","Doğru +/− işaretleri","Bağlamdan kopmayan genel sonuç"],
 rubric:[["“İnsan hayatına etkileri” dalında en az iki kaynağa dayalı örnek",5],["“Toplum hayatına etkileri” dalında en az iki kaynağa dayalı örnek",5],["Olumlu/olumsuz işaretlerinin doğru kullanılması",4],["Haritadan çıkarılan, kaynaklarla tutarlı genel sonuç",6]],
 partial:["Örnekler kaynaklarda yer almıyorsa ilgili daldan puan verilmez.","Genel sonuç yalnızca bir yönü (yalnızca olumlu) içeriyorsa son ölçütten 3 puan."]
}},
{lvl:"zor",comp:"a",mat:"Bilgi metni + öğrenci notu",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Ders kitabından</span><p>Özgürlük, bireyin kendi kararlarını verebilmesi ve seçim yapabilmesi açısından önemli bir değerdir. Ancak özgürlük sorumlulukla birlikte anlam kazanır. Bireyler dilini, kültürünü ve millî-manevi değerlerini koruma sorumluluğunu da taşımalıdır. Medya içeriklerini seçerken eleştirel düşünmeli, tüketim alışkanlıklarında bilinçli davranmalıdır. Ülkemizde düzenlenen Kültür Yolu Festivalleri sayesinde geleneksel el sanatlarımız, tarihimiz ve millî musikimiz modern dijital sergiler, konserler ve tiyatrolarla geniş kitlelere ulaştırılmaktadır.</p></div>
<div><span class="srclabel">Kaynak 2 · Bir öğrencinin haftalık notu</span><p>“Bu hafta 14 saat yabancı dizi izledim. Arkadaşlarımla konuşurken cümlelerimin yarısında İngilizce kelimeler kullandığımı fark ettim. İnternette indirim görünce ihtiyacım olmadığı hâlde iki tişört aldım. Hafta sonu ilimizde düzenlenen Kültür Yolu Festivali'nde ebru atölyesine katıldım, çok sevdim.”</p></div>
<span class="src">Kaynak 1 ders kitabından uyarlanmıştır. Kaynak 2 kurgusaldır.</span></div>`,
stem:"Kaynak 2'deki notu Kaynak 1'deki bilgiler ışığında inceleyiniz. Öğrencinin haftasında küreselleşmenin bireye olumsuz etkisini gösteren üç davranışı belirleyerek her birinin hangi değeri ya da sorumluluğu zayıflattığını açıklayınız. Nottaki olumlu bir davranışın bu olumsuz etkilere karşı nasıl bir örnek oluşturduğunu yorumlayınız. Son olarak özgürlük ile sorumluluk arasındaki dengeyi öğrencinin bir davranışı üzerinden açıklayınız.",
lines:10,
key:{
 expected:"Olumsuz davranışlar: (1) haftada 14 saat yabancı dizi – medya içeriklerinde eleştirel ve bilinçli seçim sorumluluğu, kültürel değerlere sahip çıkma; (2) konuşmada çok sayıda İngilizce kelime – dil bozulması, ana dili koruma sorumluluğu; (3) ihtiyacı olmadan indirim nedeniyle alışveriş – bilinçli tüketim, israf. Olumlu davranış: Kültür Yolu Festivali'nde ebru atölyesine katılmak – geleneksel sanatı modern platformda tanıyıp sahiplenmek; küreselleşmenin olumsuz etkilerine karşı kültürel kimliği güçlendirir. Denge: Öğrencinin dizi izleme ya da alışveriş yapma özgürlüğü vardır; ancak bu özgürlüğü dilini, kültürünü koruma ve bilinçli tüketme sorumluluğuyla birlikte kullanmalıdır.",
 sample:"Öğrencinin haftada 14 saat yabancı dizi izlemesi, medya içeriklerini eleştirel düşünerek seçme sorumluluğunu zayıflatmaktadır. Konuşurken cümlelerinin yarısında İngilizce kelimeler kullanması, ana dilini koruma sorumluluğunu zayıflatır ve dilin bozulmasına yol açabilir. İhtiyacı olmadığı hâlde indirim nedeniyle tişört alması ise bilinçli tüketim davranışına aykırıdır ve israfa yol açar. Buna karşılık Kültür Yolu Festivali'nde ebru atölyesine katılması olumlu bir örnektir; geleneksel bir sanatımızı modern bir etkinlikte tanıyıp sevmesi kültürel kimliğini güçlendirir. Öğrencinin dizi izleme özgürlüğü vardır; ancak özgürlük sorumlulukla anlam kazandığı için izleyeceği içerikleri bilinçli seçmeli ve kendi kültürüne de zaman ayırmalıdır.",
 elements:["Üç olumsuz davranış ve zayıflattığı değer/sorumluluk","Olumlu davranışın yorumu","Özgürlük–sorumluluk dengesi"],
 rubric:[["Üç olumsuz davranışın belirlenip zayıflattığı değer ya da sorumlulukla açıklanması (her biri 4)",12],["Olumlu davranışın olumsuz etkilere karşı örnek olarak yorumlanması",4],["Özgürlük ile sorumluluk dengesinin bir davranış üzerinden açıklanması",4]],
 partial:["Davranış belirlenmiş ama değer/sorumlulukla ilişkilendirilmemişse her biri için 2 puan."]
}},

material:`<div class="mat twosrc">
<div><span class="srclabel">Haber 1</span><p>Çin'de ortaya çıkan COVID-19 kısa sürede bütün dünyaya yayıldı. Salgının yayılmasını engellemek için ülkeler arasında giriş çıkışlar yasaklandı; bu durum ticareti olumsuz etkiledi.</p></div>
<div><span class="srclabel">Haber 2</span><p>Salgın sürecinde ülkeler araştırma sonuçlarını iletişim teknolojileri aracılığıyla paylaşarak ortak çözüm yolları geliştirdi.</p></div>
<div><span class="srclabel">Haber 3</span><p>TİKA, Senegal'de yılda yaklaşık 25 bin kişiye hizmet veren bir halk sağlığı merkezinin acil servis birimini modern tıbbi ekipmanlarla donattı.</p></div>
<span class="src">Haberler ders kitabındaki bilgi ve haberlerden özetlenmiştir.</span></div>`,
stem:"Üç haberdeki bilgileri kullanarak “Küreselleşme ve Sağlık” başlıklı, 4–5 cümlelik nesnel bir paragraf yazınız. Paragrafınızda küreselleşmenin sağlık alanında hem sorun oluşturan hem de çözüme katkı sağlayan yönleri yer almalı ve her yön en az bir haberle desteklenmelidir. Paragrafınızda kişisel görüş, abartı veya haberlerde olmayan bilgi bulunmamalıdır.",
lines:9,
key:{
 expected:"Paragraf: (1) Sorun yönü – küreselleşmeyle hastalıkların hızla yayılması, COVID-19 örneği; sınır yasaklarının ticareti olumsuz etkilemesi (Haber 1). (2) Çözüm yönü – ülkelerin iletişim teknolojileriyle araştırma paylaşıp ortak çözüm geliştirmesi (Haber 2); ülkeler arası sağlık iş birliği, Senegal'de acil servisin donatılması (Haber 3). (3) Dengeli sonuç: küreselleşme sağlık alanında hem sorunları hem çözüm imkânlarını dünya geneline yaymaktadır. Nesnellik: “en kötü”, “mükemmel” gibi yargılar ya da haberlerde olmayan bilgiler yer almamalıdır.",
 sample:"Küreselleşme ve Sağlık\nKüreselleşmeyle birlikte ülkeler arasındaki bağlantılar arttığı için hastalıklar da daha hızlı yayılabilmektedir; Çin'de ortaya çıkan COVID-19 kısa sürede bütün dünyaya yayılmıştır. Salgını önlemek için ülkeler arasında giriş çıkışların yasaklanması ise ticareti olumsuz etkilemiştir. Öte yandan aynı süreçte ülkeler araştırma sonuçlarını iletişim teknolojileriyle paylaşarak ortak çözüm yolları geliştirmiştir. Ülkeler arasındaki sağlık iş birliği de artmaktadır; örneğin TİKA, Senegal'de yılda yaklaşık 25 bin kişiye hizmet veren bir acil servisi modern ekipmanlarla donatmıştır. Bu örnekler, küreselleşmenin sağlık alanında hem sorunları hem de çözüm imkânlarını dünya geneline taşıdığını göstermektedir.",
 elements:["Sorun yönü ve haber desteği","Çözüm yönü ve haber desteği","Dengeli sonuç","Nesnellik ve 4–5 cümle"],
 rubric:[["Sorun oluşturan yönün en az bir haberle doğru aktarılması",5],["Çözüme katkı sağlayan yönün en az bir haberle doğru aktarılması",5],["İki yönü dengeleyen sonuç",4],["Nesnel dil, haberlere bağlılık ve paragraf bütünlüğü",6]],
 partial:["Haberlerde olmayan bilgi veya kişisel yargı varsa son ölçütten en fazla 2 puan.","Yalnızca bir yön aktarılmışsa ilgili diğer ölçütten ve sonuç ölçütünden puan verilmez."]
}}
]});

{lvl:"zor",comp:"a",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Ara buluculuk</span><p>Türk diplomasisi 2025 yılını oldukça yoğun geçirdi. Türkiye birçok uluslararası krizde ara bulucu rolü üstlendi ve tarafların bir araya gelerek sorunlarını çözebilmeleri için ev sahipliği yaptı. Etiyopya ile Somali arasındaki sorunların çözümünde ve Bosna Hersek'ten Filipinler'e kadar farklı bölgelerde ara buluculuk görevini yerine getirdi.</p></div>
<div><span class="srclabel">Kaynak 2 · Kültürel iş birliği</span><p>Türk Devletleri Teşkilatı toplantılarında 34 harften oluşan “Ortak Türk Alfabesi” oy birliğiyle kabul edildi. Türk dünyasında ortak alfabe çalışmaları, arkeolojik kazılar ve soydaşlara yönelik sosyal yardımlar yürütülmektedir.</p></div>
<div><span class="srclabel">Kaynak 3 · Barış</span><p>Dünya barışının sağlanabilmesi için ülkeler arasında dostça ilişkilerin kurulması ve sorunların uzlaşma yoluyla çözülmesi büyük önem taşır. Toplumların barış, dayanışma ve ortak değerler etrafında kenetlenmesi muhtemel savaşların engellenmesi için büyük önem taşımaktadır.</p></div>
<span class="src">Kaynaklar ders kitabındaki metin ve haberlerden alınmıştır.</span></div>`,
stem:"Üç kaynağı birlikte çözümleyiniz. (1) Kaynak 1 ve Kaynak 2'deki faaliyetlerin hangi tür sorunlara (bölgesel/küresel; siyasi/kültürel) yönelik olduğunu belirleyiniz. (2) Her iki faaliyetin Kaynak 3'te belirtilen barış koşullarından hangisine nasıl hizmet ettiğini açıklayınız. (3) “Kültürel iş birlikleri, ara buluculuk kadar barışa katkı sağlar.” ifadesine katılıp katılmadığınızı kaynaklardan kanıtlarla gerekçelendiriniz.",

 sample:"(1) Kaynak 1'deki ara buluculuk faaliyetleri ülkeler arasındaki siyasi anlaşmazlıklara yöneliktir ve Afrika'dan Asya'ya kadar farklı bölgeleri kapsadığı için hem bölgesel hem küresel niteliktedir. Kaynak 2'deki Ortak Türk Alfabesi ise Türk dünyasıyla kültürel bağları güçlendirmeye yönelik bölgesel bir kültürel iş birliğidir. (2) Ara buluculuk, Kaynak 3'te belirtilen “sorunların uzlaşma yoluyla çözülmesi” koşuluna hizmet eder, çünkü tarafları aynı masada buluşturur. Kültürel iş birliği ise “dostça ilişkilerin kurulması” ve “toplumların ortak değerler etrafında kenetlenmesi” koşullarına hizmet eder. (3) Bu ifadeye katılıyorum. Ara buluculuk çıkmış bir sorunu çözerken kültürel iş birlikleri toplumlar arasında güven ve dostluk oluşturarak sorunların ortaya çıkmasını baştan engeller. Kaynak 3'e göre ortak değerler etrafında kenetlenmek savaşların önlenmesinde büyük önem taşıdığı için iki faaliyet farklı yollarla da olsa barışa aynı ölçüde katkı sağlar.",

material:`<div class="mat"><span class="cap">Sınıfın “Merak Ettiğimiz Konular” panosu</span>
<div class="profiles">
<div class="profile"><b>Kart 1</b><p>Fatih Sultan Mehmed hangi renk kaftanları severdi?</p></div>
<div class="profile"><b>Kart 2</b><p>İskân politikası uygulanmasaydı Balkanlardaki fetihler kalıcı olabilir miydi?</p></div>
<div class="profile"><b>Kart 3</b><p>Osmanlı Devleti neden önce batıya doğru ilerlemeyi tercih etti?</p></div>
<div class="profile"><b>Kart 4</b><p>Osmanlı ordusunda kaç asker vardı?</p></div>
<div class="profile"><b>Kart 5</b><p>Mısır Seferi'nin ardından Baharat Yolu'nun denetiminin Osmanlıya geçmesi devletin ekonomisini nasıl etkiledi?</p></div>
</div>
<p style="margin-top:8px">Ders kitabında Osmanlı Devleti'nin cihan devleti hâline gelmesini sağlayan politikalar şöyle sıralanmaktadır: güçlü merkezî otorite, fetih politikası, iskân politikası, istimalet politikası, Anadolu Türk siyasi birliğine verilen önem.</p>
<span class="src">Merak kartları kurgusaldır. Politikalar ders kitabından alınmıştır.</span></div>`,
stem:"Panodaki kartları, “Osmanlı Devleti'nin cihan devleti hâline gelmesini sağlayan politikalar” konusunu araştırmaya uygunluk açısından değerlendiriniz. (1) Araştırma konusuna en uygun iki kartı seçip hangi politikayla ilgili olduklarını gerekçesiyle belirtiniz. (2) Uygun olmayan iki kartın neden uygun olmadığını açıklayınız ve bu kartlardan birini konuya uygun hâle getirecek şekilde yeniden yazınız. (3) Ders kitabındaki politikalardan panoda hiç yer almayan birini seçerek o politika hakkında kendi merak ettiğiniz konuyu belirleyiniz ve neden önemli olduğunu açıklayınız.",
lines:11,
key:{
 expected:"(1) Uygun kartlar: Kart 2 (iskân politikası – fetihlerin kalıcılığı), Kart 3 (fetih politikası – batı yönünde ilerleme), Kart 5 (fetih politikası/ekonomik sonuçlar). Herhangi ikisi gerekçeyle. (2) Uygun olmayanlar: Kart 1 – kişisel zevkle ilgili, politikalarla ilişkisiz; Kart 4 – tek bir sayıya yönelik, nedensellik/politika sorgulaması içermiyor, dönem belirtilmemiş. Yeniden yazım örneği: “Fatih'in farklı dilleri bilmesi ve bilime ilgisi İstanbul'un fethinden sonraki yönetim politikalarını nasıl etkiledi?” veya “Kuruluş Dönemi'nde Türkmenlerin orduya katılması Osmanlı'nın askeri gücünü nasıl artırdı?” (3) Panoda olmayanlar: güçlü merkezî otorite, istimalet, Anadolu Türk siyasi birliği. Örnek merak: “Anadolu beyliklerinin çeyiz ve satın alma yoluyla katılması savaşa göre ne gibi avantajlar sağladı?” Önemi gerekçelendirilmelidir.",
 sample:"(1) Kart 2 iskân politikasıyla ilgilidir; fethedilen yerlerin kalıcı hâle gelmesinde bu politikanın rolünü sorgulamaktadır. Kart 3 fetih politikasıyla ilgilidir; Osmanlı'nın batı yönünde ilerleme politikasının nedenlerini araştırmaktadır. (2) Kart 1 uygun değildir, çünkü padişahın kişisel zevkleri devletin politikalarıyla ilgili değildir. Kart 4 de uygun değildir, çünkü yalnızca bir sayı sormakta, hangi döneme ait olduğunu belirtmemekte ve politikaların etkisini sorgulamamaktadır. Kart 4'ü şöyle yeniden yazarım: “Kuruluş Dönemi'nde Türkmenlerin ve Ahilerin desteği Osmanlı'nın askeri gücünü ve fetihlerini nasıl etkiledi?” (3) Panoda istimalet politikasıyla ilgili bir kart yoktur. Ben “İstimalet politikası, Balkanlardaki gayrimüslim halkın Osmanlı yönetimini benimsemesini nasıl sağladı?” konusunu merak ediyorum. Bu konu önemlidir, çünkü Osmanlı'nın farklı din ve kültürlerden halkları yüzyıllarca bir arada nasıl yönetebildiğini anlamamı sağlar.",
 elements:["Uygun iki kart ve politikası","Uygun olmayan iki kart ve gerekçe","Kartın yeniden yazımı","Panoda olmayan politikaya yönelik merak konusu ve önemi"],
 rubric:[["Uygun iki kartın ilgili politikayla gerekçeli seçimi",5],["Uygun olmayan iki kartın gerekçesiyle belirlenmesi",4],["Bir kartın konuya uygun biçimde yeniden yazılması",4],["Panoda olmayan bir politikaya yönelik merak konusunun belirlenip öneminin açıklanması",7]],
 partial:["Merak konusu panodaki politikalardan birine aitse son ölçütten en fazla 3 puan."]
}},
{lvl:"zor",comp:"d",mat:"Üç kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Merkezî otorite</span><p>Osmanlı Devleti'nin kısa sürede büyüyüp güçlü bir cihan devleti hâline gelmesinde merkezî otoritenin sağlam tutulması oldukça önemliydi. Hükümdar ülke yönetiminde önemli bir yetkiye sahipti. Hükümdara yardımcı olan devlet görevlileri ve kurumlar, alınan kararların uygulanmasını sağlayarak ülkenin farklı bölgelerinde düzenin korunmasına katkıda bulunurdu.</p></div>
<div><span class="srclabel">Kaynak 2 · Mısır Seferi'nin sonuçları</span><p>Yavuz Sultan Selim'den sonra Osmanlı padişahları halife unvanını taşımaya başladı. Mekke ve Medine Osmanlı topraklarına katıldı. Baharat Yolu Osmanlı Devleti'nin denetimine geçti. Mısır'dan alınan vergiler ve verimli tarım alanları Osmanlı ekonomisini güçlendirdi.</p></div>
<div><span class="srclabel">Kaynak 3 · Preveze (1538)</span><p>Barbaros Hayreddin Paşa donanmasını hilal şeklinde düzenledi ve kadırgaların hızlı hareket kabiliyetini kullanarak Haçlı donanmasına saldırdı. Zaferle Akdeniz âdeta bir “Türk gölü” hâline geldi ve deniz ticaret yolları güvence altına alındı.</p></div>
<span class="src">Kaynaklar ders kitabından özetlenmiştir.</span></div>`,
stem:"Üç kaynaktaki bilgileri birlikte değerlendirerek çıkarım yapınız. (1) Her kaynağın Osmanlı'nın cihan devleti olmasına hangi alanda (siyasi, dinî, ekonomik, askerî) katkı sağladığını belirleyiniz. (2) Kaynak 2 ve Kaynak 3 arasındaki ortak noktayı bularak Osmanlı'nın ticaret yollarına neden önem verdiğine dair bir çıkarım yapınız. (3) Kaynak 1'deki güçlü merkezî otoritenin, Kaynak 2 ve 3'teki başarıların elde edilmesini nasıl kolaylaştırmış olabileceğini açıklayınız. (4) Üç kaynağa dayanarak “cihan devleti” kavramını kendi cümlelerinizle tanımlayınız.",
lines:11,
key:{
 expected:"(1) Kaynak 1: siyasi/idari (düzen, kararların uygulanması). Kaynak 2: dinî (halifelik, kutsal şehirler) ve ekonomik (Baharat Yolu, vergiler), siyasi. Kaynak 3: askerî (denizde üstünlük) ve ekonomik (deniz ticaret yolları). (2) Ortak nokta: ticaret yollarının denetimi. Çıkarım: Ticaret yolları devlete gelir (vergi, gümrük) sağlıyor, ekonomiyi güçlendiriyor, güçlü ekonomi de ordunun ve devletin gücünü sürdürmesini sağlıyordu. (3) Merkezî otorite kararların hızlı ve düzenli uygulanmasını, büyük ordu ve donanmanın tek elden hazırlanıp yönetilmesini, geniş toprakların düzen içinde tutulmasını sağladı; bu sayede uzak seferler (Mısır) ve büyük donanma hazırlıkları yapılabildi. (4) Cihan devleti: geniş topraklara, güçlü ordu ve donanmaya, ekonomik zenginliğe sahip, dünya çapında siyasi, askerî, dinî ve ekonomik etkisi olan devlet.",
 sample:"(1) Kaynak 1 siyasi ve idari alanda katkı sağlamıştır, çünkü düzenin korunmasını ve kararların uygulanmasını anlatmaktadır. Kaynak 2 dinî (halifelik, Mekke ve Medine) ve ekonomik (Baharat Yolu, vergiler) alanlarda katkı sağlamıştır. Kaynak 3 ise askerî alanda denizlerde üstünlük kurulmasını ve ekonomik alanda deniz ticaret yollarının güvenliğini göstermektedir. (2) Kaynak 2 ve 3'ün ortak noktası ticaret yollarının Osmanlı denetimine geçmesidir. Buradan Osmanlı'nın ticaret yollarına, devlete gelir sağladığı ve ekonomiyi güçlendirdiği için önem verdiği çıkarımını yapabiliriz; güçlü ekonomi de güçlü bir ordu ve donanmanın sürdürülmesini sağlamıştır. (3) Güçlü merkezî otorite sayesinde padişahın kararları ülkenin her yerinde hızla uygulanmış, büyük ordular ve donanmalar tek elden hazırlanıp yönetilebilmiştir. Bu yüzden Mısır gibi uzak bir yere sefer yapmak ve Preveze'de büyük bir donanmayı başarıyla savaştırmak mümkün olmuştur. (4) Cihan devleti; geniş topraklara, güçlü bir orduya ve donanmaya, zengin bir ekonomiye sahip olan ve dünya çapında siyasi, askerî, dinî ve ekonomik etkisi bulunan devlettir.",
 elements:["Kaynakların alanlarla eşleştirilmesi","Ticaret yolları çıkarımı","Merkezî otorite–başarı ilişkisi","Cihan devleti tanımı"],
 rubric:[["Üç kaynağın katkı alanlarının doğru belirlenmesi",4],["Kaynak 2 ve 3'ün ortak noktası ve ticaret yollarına ilişkin çıkarım",5],["Merkezî otoritenin diğer başarılara etkisinin açıklanması",6],["Üç kaynağa dayalı cihan devleti tanımı",5]],
 partial:["Tanım yalnızca “büyük devlet” şeklindeyse son ölçütten 2 puan.","Ortak nokta bulunup çıkarım yapılmamışsa ikinci ölçütten 2 puan."]
}},

material:`<div class="mat"><span class="cap">Arda'nın araştırma raporundan bölümler</span>
<ol>

<li>Mısır Seferi'nde Osmanlı ordusu Mercidabık (1516) ve Ridaniye (1517) savaşlarını kazanmıştır.</li>

<li>Barbaros Hayreddin Paşa Preveze'de donanmasını düz bir hat şeklinde dizmiştir.</li>

</ol>
<p><b>Arda'nın kullandığı kaynaklar:</b> bir tarih ansiklopedisi, adı bilinmeyen bir blog, ders kitabı.</p>
<span class="src">Rapor bölümleri kurgusaldır; doğru bilgiler ders kitabından alınmıştır.</span></div>`,
stem:"Arda'nın raporundaki bilgilerin doğruluğunu ders kitabında öğrendiklerinize göre değerlendiriniz. (1) Yanlış olan iki bilgiyi belirleyip doğrularını yazınız. (2) Yanlış bilgilerin hangi kaynaktan gelmiş olabileceğini gerekçesiyle tahmin ediniz. (3) Arda'nın raporundaki bilgileri doğrulamak için izleyebileceği üç adımlık bir yol öneriniz. (4) Raporu düzeltirken Arda'nın “Preveze Deniz Zaferi'nin Akdeniz'de üstünlük kurulmasına katkısı” hakkında ekleyebileceği bir kanıtı yazınız.",
lines:11,
key:{
 expected:"(1) Yanlış: 3. bilgi – Mısır Seferi ile Baharat Yolu Osmanlı denetimine geçmiştir (İpek Yolu İstanbul'un fethiyle denetime geçmişti). 4. bilgi – Barbaros donanmasını hilal şeklinde düzenlemiştir. (2) Adı bilinmeyen blog; yazarı, uzmanlığı ve kaynakları belli değildir, denetimden geçmemiştir. (3) Adımlar: bilgiyi ders kitabıyla karşılaştırmak; en az iki güvenilir kaynakta (ansiklopedi, uzman tarihçi eseri, resmî kurum sitesi) aramak; kaynağın yazarını ve kaynakçasını kontrol etmek; çelişen bilgide güvenilir kaynağı esas almak. (4) Kanıt: Akdeniz'in “Türk gölü” hâline gelmesi; deniz ticaret yollarının güvence altına alınması; Osmanlı'nın denizlerde de güçlü olduğunu dünyaya göstermesi; Haçlı donanmasının geri çekilmesi.",
 sample:"(1) Üçüncü bilgi yanlıştır; Mısır Seferi sonucunda Baharat Yolu Osmanlı denetimine geçmiştir. Dördüncü bilgi de yanlıştır; Barbaros Hayreddin Paşa donanmasını hilal şeklinde düzenlemiştir. (2) Bu yanlış bilgiler büyük ihtimalle adı bilinmeyen blogdan gelmiştir, çünkü yazarı ve dayandığı kaynaklar belli değildir; ansiklopedi ve ders kitabı ise uzmanlar tarafından hazırlanıp denetlenmektedir. (3) Arda önce her bilgiyi ders kitabıyla karşılaştırmalı, sonra aynı bilgiyi en az iki güvenilir kaynakta aramalı, son olarak çelişen bilgilerde yazarı ve kaynakçası belli olan kaynağı esas almalıdır. (4) Arda, zaferden sonra Akdeniz'in âdeta bir “Türk gölü” hâline geldiğini ve deniz ticaret yollarının güvence altına alındığını kanıt olarak ekleyebilir.",

<p>Sultan III. Ahmed ve sadrazam Nevşehirli Damat İbrahim Paşa döneminde Batı örnek alınarak kültür, sanat ve bilim alanlarında yenilikler yapılmıştır. İstanbul'da kütüphaneler, çeşmeler, köşkler inşa edilmiştir. 1727'de İbrahim Müteferrika tarafından ilk Türk matbaası açılmış, kitap basımı hızlanmış ve bilgiye erişim kolaylaşmıştır. Yirmisekiz Mehmed Çelebi, Avrupa'daki gelişmeleri rapor etmesi için Fransa'ya elçi olarak gönderilmiştir. İstanbul'da ahşap evler çok olduğu için büyük yangınlara müdahale yetersiz kalıyordu; bu nedenle 1720'de ilk itfaiye teşkilatı olan Tulumbacılar Ocağı kurulmuştur.</p>
<span class="src">Kaynak: Ders kitabından uyarlanmıştır.</span></div>`,
stem:"Metindeki yeniliklerden ikisini seçiniz. Seçtiğiniz her yeniliğin yapılma nedenini ve sonucunu (katkısını) metne dayanarak birer cümleyle ifade ediniz.",

key:{

material:`<div class="mat"><span class="cap">Sanayi İnkılabı</span>
<p>XVIII. yüzyılın ikinci yarısında İngiltere'de başlayan Sanayi İnkılabı'nda James Watt'ın buhar makinesini geliştirmesi üretimde büyük değişimlere yol açmıştır. Küçük atölyelerde el emeğine dayalı üretim yerini makinelerin kullanıldığı fabrikalara bırakmıştır. Kısa sürede daha fazla ve ucuz mal üretilmiş, ticaret gelişmiş ve şehirler hızla büyümüştür. Buharlı makineler tren, gemi ve dokuma tezgâhlarında da kullanılmıştır. Kırsal alanlardan şehirlere göçler artmış, fabrikalarda çalışan işçi sınıfı ortaya çıkmıştır. Üretim arttıkça ham madde ve pazar ihtiyacı da artmış; Avrupa devletleri Afrika, Asya ve Amerika'ya yönelik sömürgecilik faaliyetlerini hızlandırmıştır.</p>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"Metne göre Sanayi İnkılabı'nın etkilediği üç farklı unsuru (üretim, ulaşım, nüfus/şehirler, toplum yapısı, uluslararası ilişkiler vb.) belirleyiniz ve her unsurda meydana gelen değişimi metinden bir örnekle yazınız.",
lines:4,
key:{

 sample:"Üretim: Küçük atölyelerdeki el emeği yerini makinelerin kullanıldığı fabrikalara bırakmış, daha fazla ve ucuz mal üretilmiştir.\nŞehirler: Kırsal alanlardan şehirlere göç artmış ve şehirler hızla büyümüştür.\nUluslararası ilişkiler: Ham madde ve pazar ihtiyacı artınca Avrupa devletleri Afrika, Asya ve Amerika'da sömürgeciliği hızlandırmıştır.",
 elements:["Üç unsur","Her unsurda metinden değişim örneği"],

}},
{lvl:"kolay",comp:"c",mat:"Metin",
material:`<div class="mat"><span class="cap">Büyük deniz seyahatlerinin Osmanlı'ya etkisi</span>
<p>Avrupalı devletlerin gerçekleştirdiği büyük deniz seyahatleri Osmanlı Devleti'ni özellikle ekonomi alanında olumsuz etkilemiştir. Yeni ticaret yollarının bulunmasıyla Osmanlı Devleti'nin kontrolündeki İpek ve Baharat Yolları önemini kaybetmiştir. Karadeniz ve Akdeniz ticaretinin canlılığı azalmış, Osmanlı liman şehirleri eski önemini yitirmiştir. Devletin gelirlerinde büyük oranda azalmalar meydana gelmiştir. Osmanlı Devleti bu yolları yeniden canlandırmak için Avrupalı devletlere ticari ayrıcalıklar vermiştir. Ancak bu ayrıcalıklar yolların ve Akdeniz ticaretinin eski önemini kazanması için yeterli olmamıştır.</p>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"“Büyük deniz seyahatleri Osmanlı ekonomisini olumsuz yönde etkilemiştir.” yargısını metinden iki kanıtla destekleyiniz. Osmanlı Devleti'nin bu soruna karşı aldığı önlemin neden başarılı olamadığını sorgulayarak kendi düşüncenizi yazınız.",
lines:5,
key:{
 expected:"Kanıtlar: İpek ve Baharat Yollarının önemini kaybetmesi; Karadeniz ve Akdeniz ticaretinin canlılığının azalması; liman şehirlerinin önem yitirmesi; devlet gelirlerinin azalması. Önlem: Avrupalılara ticari ayrıcalıklar. Başarısızlık nedeni (yorum): Ticaret artık okyanus yollarına kaymıştı, ayrıcalıklar ticaretin yönünü değiştiremezdi; ayrıca ayrıcalıklar Avrupalı tüccarlara kazanç sağlarken Osmanlı'nın gelirini ve yerli tüccarı zayıflatmış olabilir.",
 sample:"Metne göre yeni ticaret yolları bulununca İpek ve Baharat Yolları önemini kaybetmiş ve bunun sonucunda devletin gelirleri büyük oranda azalmıştır. Ayrıca Osmanlı liman şehirleri de eski önemini yitirmiştir. Osmanlı Devleti Avrupalılara ticari ayrıcalıklar vererek yolları canlandırmak istemiştir; ancak bence bu önlem yeterli olmamıştır, çünkü Avrupalılar artık okyanus yollarını kullanarak Doğu'ya daha kolay ulaşabiliyordu ve ayrıcalıklar ticaretin bu yeni yönünü değiştiremezdi.",
 elements:["İki kanıt","Önlemin başarısızlığının sorgulanması"],

}},

{lvl:"orta",comp:"b",mat:"Metin → tablo",
material:`<div class="mat"><span class="cap">II. Mahmud Dönemi yenilikleri</span>
<p>II. Mahmud 1826'da Yeniçeri Ocağı'nı kaldırmış (Vaka-i Hayriye), yerine Asâkir-i Mansûre-i Muhammediye adlı yeni bir ordu kurmuştur. Divan teşkilatı kaldırılarak yerine nazırlıklar (bakanlıklar) kurulmuştur. İlk kez nüfus sayımı yapılmış, posta teşkilatı kurulmuş, karantina ve sağlık hizmetleri düzenlenmiştir. 1831'de ilk resmî gazete Takvim-i Vekayi çıkarılmıştır. Devlet memuru yetiştirmek için Mekteb-i Maârif-i Adliyye, doktor yetiştirmek için Mekteb-i Tıbbiye, subay yetiştirmek için Mekteb-i Harbiye açılmıştır. Devlet görevlileri için fes, ceket, pantolon zorunlu hâle getirilmiştir.</p>
<span class="src">Kaynak: Ders kitabındaki alıntıdan (Beydilli, 2003) özetlenmiştir.</span></div>`,
stem:"II. Mahmud Dönemi yeniliklerinin etkilediği unsurları incelemek için yenilikleri “Askerî”, “Yönetim (idari)”, “Eğitim” ve “Sosyal hayat” başlıklarından oluşan bir tabloya yerleştiriniz. Her başlığa en az iki yenilik yazınız. Tablonun altına, bu yeniliklerin birden fazla alanı birlikte etkilediğini gösteren bir örnek yazınız.",
lines:7,
key:{
 expected:"Askerî: Yeniçeri Ocağı'nın kaldırılması, Asâkir-i Mansûre-i Muhammediye, Mekteb-i Harbiye. Yönetim: Divan yerine nazırlıklar, nüfus sayımı, Takvim-i Vekayi, posta teşkilatı. Eğitim: Mekteb-i Maârif-i Adliyye, Mekteb-i Tıbbiye, Mekteb-i Harbiye. Sosyal hayat: fes-ceket-pantolon, karantina ve sağlık hizmetleri, posta, gazete. Çoklu etki örneği: Mekteb-i Harbiye hem eğitim hem askerî; Mekteb-i Tıbbiye eğitim ve sağlık; Takvim-i Vekayi yönetim ve sosyal hayat (halkın bilgilendirilmesi); nüfus sayımı yönetim ve askerlik (asker toplama).",
 sample:"Askerî: Yeniçeri Ocağı'nın kaldırılması; Asâkir-i Mansûre-i Muhammediye ordusunun kurulması.\nYönetim: Divan yerine nazırlıkların kurulması; ilk nüfus sayımı.\nEğitim: Mekteb-i Tıbbiye; Mekteb-i Maârif-i Adliyye.\nSosyal hayat: Devlet görevlilerine fes, ceket ve pantolon zorunluluğu; karantina ve sağlık hizmetlerinin düzenlenmesi.\nÖrneğin Mekteb-i Harbiye hem eğitim alanını hem de subay yetiştirerek askerî alanı etkilemiştir.",
 elements:["Dört başlıkta en az ikişer doğru yenilik","Çoklu etki örneği"],
 rubric:[["Dört başlık altında en az ikişer yeniliğin doğru yerleştirilmesi (her başlık 3)",12],["Birden fazla alanı etkileyen yenilik örneği ve açıklaması",3]],
 partial:["Bir başlıkta tek doğru yenilik varsa o başlık için 1,5 puan.","Uygun gerekçesi varsa bir yenilik farklı başlıkta kabul edilir."]
}},
{lvl:"orta",comp:"a",mat:"Metin",
material:`<div class="mat"><span class="cap">Fransız İhtilali (1789)</span>
<p>XVIII. yüzyılda Fransa'da kralların uzun süren savaşlar için yaptığı harcamalar ülke ekonomisini zayıflatmıştır. Buna rağmen soylular ve din görevlileri vergi vermezken vergi yükü büyük ölçüde halkın üzerinde kalmıştır. Ayrıca kralların halktan uzak bir yaşam sürmesi ve Aydınlanma Çağı ile yayılan özgürlük, eşitlik ve adalet düşünceleri halkın değişim isteğini artırmıştır. Kral XVI. Louis ekonomik krizi çözmek için yeni vergiler koymak isteyince halkın tepkisi artmıştır. 14 Temmuz 1789'da halkın Bastille Hapishanesini ele geçirmesiyle isyan başlamıştır.</p>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"Metinde Fransız İhtilali'ne yol açan nedenleri “uzun süreli (hazırlayıcı) nedenler” ve “kısa süreli (tetikleyici) neden” olarak inceleyiniz. Uzun süreli nedenlerden en az üçünü, tetikleyici nedeni de bir tane olarak yazınız. Aydınlanma Çağı'nın bu nedenler arasında neden farklı bir yeri olduğunu açıklayınız.",
lines:6,
key:{

{lvl:"zor",comp:"b",mat:"Venn için iki kaynak",
material:`<div class="mat twosrc">
<div><span class="srclabel">Lale Devri (1718-1730)</span><p>Batı örnek alınarak kültür, sanat ve bilim alanlarında yenilikler yapıldı. İstanbul'da kütüphaneler, çeşmeler, köşkler inşa edildi. 1727'de ilk Türk matbaası açıldı. Yirmisekiz Mehmed Çelebi Fransa'ya geçici elçi olarak gönderildi. 1720'de Tulumbacılar Ocağı kuruldu; çiçek aşısı yaygınlaştı. Dönem Patrona Halil İsyanı ile sona erdi.</p></div>
<div><span class="srclabel">III. Selim Dönemi (1789-1807)</span><p>Yeniçeri Ocağı'nın yanında Avrupa usullerine göre eğitilen Nizâm-ı Cedid Ordusu kuruldu. Kara Mühendishanesi açıldı, Avrupa dillerinden bilimsel eserler tercüme edildi. Islahat giderleri için İrâd-ı Cedid Hazinesi kuruldu. Beykoz'da kâğıt, Azatlı'da kumaş fabrikaları açıldı. Londra, Paris, Berlin ve Viyana'da ilk daimî elçilikler açıldı.</p></div>
<span class="src">Kaynak: Ders kitabındaki metinlerden özetlenmiştir.</span></div>`,
stem:"İki dönemin yeniliklerini etkiledikleri unsurlar açısından inceleyiniz. (1) Yalnızca Lale Devri'ne ait, yalnızca III. Selim Dönemi'ne ait ve iki dönemin ortak özelliklerinden ikişer tane yazarak bir Venn şeması (veya üç sütunlu tablo) oluşturunuz. (2) Lale Devri yeniliklerinin daha çok hangi alanları, III. Selim yeniliklerinin ise hangi alanları etkilediğini karşılaştırınız. (3) Dış ilişkilerdeki yeniliklerin (geçici elçi – daimî elçilik) Osmanlı'nın Avrupa'yı takip etme biçimini nasıl değiştirdiğini açıklayınız.",
lines:11,
key:{
 expected:"(1) Lale Devri: matbaa, Tulumbacılar Ocağı, kütüphane-çeşme-köşk imarı, çiçek aşısı, geçici elçi. III. Selim: Nizâm-ı Cedid Ordusu, Kara Mühendishanesi, İrâd-ı Cedid Hazinesi, fabrikalar, daimî elçilikler. Ortak: Batı/Avrupa örnek alınması, Avrupa ile ilişkilerin geliştirilmesi (elçi gönderme), bilgi/bilim aktarımı (matbaa – tercüme), tepkiyle/isyanla karşılaşma (ders kitabında Lale Devri isyanla bitmiştir; III. Selim'in sonu da tepkiyle olmuştur – kabul). (2) Lale Devri: kültür, sanat, imar, bilim, şehir hayatı. III. Selim: askerî, eğitim (askerî eğitim), ekonomi/sanayi, diplomasi; daha kapsamlı ve köklü. (3) Geçici elçi tek seferlik gözlem/rapor sağlıyordu; daimî elçilikler Avrupa'daki siyasi, askerî, bilimsel gelişmelerin sürekli ve yakından izlenmesini sağladı; diplomasi kurumsallaştı.",
 sample:"(1) Yalnızca Lale Devri: İlk Türk matbaası; Tulumbacılar Ocağı.\nYalnızca III. Selim Dönemi: Nizâm-ı Cedid Ordusu; Beykoz kâğıt fabrikası.\nOrtak özellikler: Avrupa örnek alınmıştır; Avrupa ile ilişkileri geliştirmek için elçiler gönderilmiştir.\n(2) Lale Devri yenilikleri daha çok kültür, sanat, imar ve şehir hayatını etkilemiştir. III. Selim Dönemi yenilikleri ise askerî alanı başta olmak üzere eğitim, ekonomi ve diplomasiyi etkilemiş, daha kapsamlı bir yenileşme olmuştur. (3) Lale Devri'nde Fransa'ya giden geçici elçi yalnızca bir süreliğine gözlem yapıp rapor hazırlamıştır. III. Selim'in açtığı daimî elçilikler sayesinde ise Avrupa'daki gelişmeler sürekli ve yakından izlenmeye başlanmıştır.",
 elements:["Venn şeması: üç bölüm ikişer","Etkilenen alanların karşılaştırılması","Elçilik değişiminin etkisi"],
 rubric:[["Venn şemasının üç bölümünün ikişer doğru özellikle doldurulması",8],["İki dönemin etkilediği alanların karşılaştırılması",6],["Geçici elçiden daimî elçiliğe geçişin etkisinin açıklanması",6]],
 partial:["Venn şemasında her yanlış yerleştirilen özellik için 1 puan düşülür.","Karşılaştırmada yalnızca bir dönemin alanları yazılmışsa ikinci ölçütten 3 puan."]
}},
{lvl:"zor",comp:"c",mat:"İki kaynak + öğrenci görüşü",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Matbaa</span><p>...Said Mehmed Efendi, babası elçilik ile Fransa'ya gittiği zaman o da beraber gitmiş ve Paris'teki matbaaları gezerek az zamanda binlerce kitap basıldığını görüp bunun Türkiye'de de tesisini arzu etmişti... İstanbul'a dönüşünde Müteferrika İbrahim Efendi ile görüşüp birlikte Sadrazama müracaat etmişlerdir... Damad İbrahim Paşa müteşebbisleri teşvik etti... fakat bu yeniliğe engel olan bir kısım ulema ve yazı ile geçinen hattatların muhalefetiyle karşılaşıldı...</p><span class="src">Uzunçarşılı, 2011, s. 158-160 (ders kitabından)</span></div>
<div><span class="srclabel">Kaynak 2 · Aydınlanma'nın Osmanlı'ya etkisi</span><p>Aydınlanma düşüncesi Avrupa'da bilim ve teknolojinin hızla gelişmesini sağlamıştır. Osmanlı Devleti ise bu gelişmeleri yeterince takip edememiş; Avrupa'nın gerisinde kaldığını fark ederek askerî ve teknik alanda ıslahatlara yönelmiştir. Yapılan bazı yenilikler kalıcı bir devlet politikası hâline getirilemediğinden istenilen başarı sağlanamamıştır.</p></div>
<div><span class="srclabel">Sınıftan bir görüş</span><p><b>Burak:</b> “Osmanlı yenilikleri tamamen başarısızdı, hiçbir işe yaramadı.”</p></div>
<span class="src">Burak'ın görüşü kurgusaldır.</span></div>`,
stem:"Kaynaklardan yararlanarak Osmanlı yeniliklerinin etkilerini sorgulayınız. (1) Matbaanın kurulmasında elçiliğin rolünü ve matbaaya karşı çıkılmasının olası nedenlerini Kaynak 1'e dayanarak açıklayınız. (2) Kaynak 2'ye göre yeniliklerin istenen başarıya ulaşamamasının temel nedenini belirtiniz. (3) Burak'ın görüşünü sorgulayınız; görüşün neden aşırı bir genelleme olduğunu ders kitabında öğrendiğiniz en az iki yeniliğin kalıcı etkisiyle gösteriniz. (4) Yeniliklerin başarılı olması için ne gerektiğine dair kendi değerlendirmenizi yazınız.",
lines:11,
key:{
 expected:"(1) Elçilik: Said Mehmed Efendi Paris'te matbaaların az zamanda binlerce kitap bastığını görmüş, fikri İstanbul'a taşımış; elçilik Avrupa'daki yeniliklerin tanınmasını sağlamıştır. Karşı çıkma nedenleri: hattatların geçim kaynaklarını (el yazması kitap) kaybetme kaygısı; bazı ulemanın yeniliğe/değişime kuşkuyla bakması, dinî kitapların basılmasından çekinmesi. (2) Yeniliklerin kalıcı bir devlet politikası hâline getirilememesi; Avrupa'yı geç ve yeterince takip edememek. (3) Aşırı genelleme: “tamamen”, “hiçbir”. Kalıcı etki örnekleri: matbaa (bilgiye erişim, kitap basımı); Tulumbacılar Ocağı (itfaiye); Kara Mühendishanesi, Mekteb-i Tıbbiye, Mekteb-i Harbiye (bugünkü kurumların temeli); nazırlıklar (bakanlıklar), nüfus sayımı, posta, resmî gazete; Tanzimat ile hak ve güvenceler, Meclis. (4) Değerlendirme: süreklilik/kalıcı devlet politikası, halkın ve kurumların desteği, sermaye-teknoloji-nitelikli iş gücü, eğitimle desteklenme, karşı çıkanlara ikna/çözüm üretme.",
 sample:"(1) Said Mehmed Efendi, babasının Fransa elçiliği sırasında Paris'teki matbaaların kısa sürede binlerce kitap bastığını görmüş ve bu fikri İstanbul'a getirmiştir; yani elçilik, Avrupa'daki yeniliğin Osmanlı'ya taşınmasını sağlamıştır. Kitapları elle yazarak geçimini sağlayan hattatlar işlerini kaybetmekten korktukları için, bazı ulema ise yeniliğe kuşkuyla baktıkları için matbaaya karşı çıkmış olabilir. (2) Kaynak 2'ye göre yeniliklerin başarısız olmasının temel nedeni, bazı yeniliklerin kalıcı bir devlet politikası hâline getirilememesidir. (3) Burak'ın görüşü “tamamen” ve “hiçbir” ifadeleri nedeniyle aşırı bir genellemedir. Örneğin İbrahim Müteferrika'nın matbaası kitap basımını hızlandırmış ve bilgiye ulaşmayı kolaylaştırmıştır. II. Mahmud Dönemi'nde kurulan nazırlıklar bugünkü bakanlıkların, Mekteb-i Tıbbiye ise tıp eğitiminin temelini oluşturmuştur. (4) Bence yeniliklerin başarılı olması için padişah değişse de sürdürülen kalıcı bir devlet politikası olmaları, eğitimle desteklenmeleri ve halkın neden gerekli olduklarını anlayarak bu yenilikleri benimsemesi gerekir.",
 elements:["Elçiliğin rolü ve karşı çıkma nedenleri","Başarısızlığın temel nedeni","Genellemenin iki kalıcı etkiyle sorgulanması","Kişisel değerlendirme"],
 rubric:[["Elçiliğin rolü ve matbaaya karşı çıkılma nedenlerinin Kaynak 1'e dayalı açıklanması",5],["Kaynak 2'ye göre başarısızlığın temel nedeni",3],["Burak'ın görüşünün iki kalıcı yenilik örneğiyle sorgulanması",7],["Yeniliklerin başarı koşullarına ilişkin gerekçeli değerlendirme",5]],
 partial:["Yalnızca bir kalıcı yenilik örneği verilmişse üçüncü ölçütten 4 puan.","Hattatlar ya da ulemadan yalnızca biri açıklanmışsa ilk ölçütten 3 puan."]
}},

<p style="margin-top:8px"><b>İpucu bilgileri:</b> Tanzimat Fermanı ile Osmanlı Devleti'nin iç düzenini iyileştirmek ve Avrupa devletlerinin baskısını azaltmak amaçlanmış; devlet halkına bazı temel hak ve güvenceler sağlamayı kabul etmiştir. Padişah ilk kez kendi yetkilerini kendi eliyle sınırlamıştır. Avrupa'nın ucuz malları karşısında Osmanlı esnafı rekabet edemeyerek atölyelerini kapatmak zorunda kalmıştır.</p>
<span class="src">Kaynak: Ders kitabındaki bilgilerden derlenmiştir; tablo kurgusaldır.</span></div>`,
stem:"Tablodaki soru işaretli yerleri ders kitabında öğrendiklerinize ve ipucu bilgilerine dayanarak doldurunuz. Ardından tablodaki yeniliklerden birini seçerek nedenini, uygulanışını ve sonucunu birbirine bağlayan, “çünkü”, “bu nedenle”, “sonuç olarak” bağlaçlarını kullandığınız 3-4 cümlelik bir paragraf yazınız.",
lines:11,
key:{
 expected:"Nizâm-ı Cedid sonucu: Avrupa usullerine göre eğitilmiş modern ordu kuruldu; topçu, humbaracı, lağımcı ocakları düzenlendi, donanma güçlendi (yeniçerilerin tepkisi de kabul). Vaka-i Hayriye nedeni: yeniçerilerin bozulması, sık sık isyan etmesi, yeniliklere engel olması. Tanzimat nedeni: iç düzeni iyileştirmek, Avrupa devletlerinin baskısını azaltmak, halkın devlete güven ve bağlılığını artırmak (milliyetçilik isyanları). Tanzimat sonucu: halka can, mal güvenliği ve temel hak ve güvenceler; padişahın yetkilerinin ilk kez sınırlanması; eğitimde Meclis-i Maârif, özel gazeteler, askere almada eşitlik. Sanayi nedeni: Avrupa'nın ucuz seri üretim malları karşısında yerli esnafın rekabet edememesi, atölyelerin kapanması. Sanayi sonucu: tekstil, cam, çini, kâğıt, fişek fabrikaları; ancak sermaye, teknoloji, nitelikli iş gücü ve ulaşım eksikliğinden tam başarı sağlanamadı. Paragraf: bağlaçlar doğru kullanılmış, neden–uygulama–sonuç sırası tutarlı.",
 sample:"Nizâm-ı Cedid Ordusu – Sonuç: Avrupa usullerine göre eğitilen, modern silahlarla donatılmış yeni bir ordu kuruldu.\nVaka-i Hayriye – Neden: Yeniçerilerin düzeninin bozulması ve sık sık isyan etmesi.\nTanzimat Fermanı – Neden: İç düzeni iyileştirmek ve Avrupa devletlerinin baskısını azaltmak. Sonuç: Halka can ve mal güvenliği sağlandı; padişah ilk kez kendi yetkilerini sınırladı.\nSanayi mektepleri ve fabrikalar – Neden: Avrupa'nın ucuz malları karşısında yerli esnafın rekabet edememesi. Sonuç: Tekstil, cam, kâğıt gibi fabrikalar kuruldu ancak sermaye ve teknoloji eksikliği nedeniyle tam başarı sağlanamadı.\n\nParagraf: Osmanlı esnafı atölyelerini kapatmak zorunda kalmıştı, çünkü Avrupa fabrikalarında üretilen ucuz mallarla rekabet edemiyordu. Bu nedenle Osmanlı Devleti Batı'daki fabrikalaşma modelini örnek alarak sanayi mektepleri açtı ve tekstil, cam, kâğıt gibi ürünler için fabrikalar kurdu. Sonuç olarak yerli üretimi artırmak için önemli adımlar atıldı; ancak sermaye, teknoloji ve nitelikli iş gücü eksikliği bu çabaların tam başarıya ulaşmasını engelledi.",
 elements:["Altı boş hücrenin doğru doldurulması","Neden-uygulama-sonuç paragrafı","Bağlaçların doğru kullanımı"],
 rubric:[["Tablodaki altı boş hücrenin doğru doldurulması (her biri 2)",12],["Seçilen yeniliğin nedeni, uygulanışı ve sonucunu tutarlı biçimde bağlayan paragraf",5],["“Çünkü, bu nedenle, sonuç olarak” bağlaçlarının anlamına uygun kullanılması",3]],
 partial:["Hücrede neden ile sonuç karıştırılmışsa o hücreden puan verilmez.","Bağlaçlardan biri eksik ya da yanlış kullanılmışsa son ölçütten 1 puan düşülür."]
}},
{lvl:"zor",comp:"a",mat:"Metin + tarih şeridi",
material:`<div class="mat twosrc">
<div><span class="srclabel">Kaynak 1 · Rönesans'ın nedenleri</span><ul>
<li>Haçlı saldırıları sırasında Müslümanlardan öğrenilen matbaa sayesinde kitapların çoğaltılması</li>
<li>Eski Roma ve Yunan ile İslam dünyasına ait bilimsel eserlerin yeniden incelenmesi</li>
<li>İstanbul'un fethiyle Doğu Roma'dan kaçan bilim insanlarının getirdikleri eserlerle bilime katkıda bulunması</li>
<li>Yeni ticaret yollarıyla zenginleşen burjuva sınıfının sanata ve bilime desteği</li>
<li>Büyük seyahatlerle kilisenin bazı düşüncelerinin yanlış olduğunun anlaşılması</li>
</ul></div>
<div><span class="srclabel">Kaynak 2 · Osmanlı'daki yansıması</span><p>Osmanlı Devleti Rönesans ile başlayan bilimsel ve teknik gelişmeleri yakından takip etmiştir. Bu değişimler Osmanlı Devleti'ni özellikle askerî ve teknik alanlarda yenilik yapmaya sevk etmiştir. 17. yüzyıldan itibaren ıslahat düşüncesi önem kazanmış; haritacılık, astronomi, matematik, tıp alanlarındaki gelişmeler izlenmiş, bazı eserler Osmanlıya aktarılmıştır.</p></div>
<span class="src">Kaynak: Ders kitabından alınmıştır.</span></div>`,
stem:"Rönesans'ın nedenlerini Osmanlı Devleti ile bağlantısı açısından inceleyiniz. (1) Kaynak 1'deki nedenlerden Osmanlı Devleti veya İslam dünyasıyla doğrudan ya da dolaylı bağlantısı olan üç tanesini seçerek bağlantıyı açıklayınız. (2) Bu bağlantılardan yola çıkarak “Rönesans yalnızca Avrupa'nın kendi iç gelişmelerinin sonucudur.” görüşünü değerlendiriniz. (3) Kaynak 2'ye göre Rönesans'ın Osmanlı'da yenilik yapılmasına neden olmasının gerekçesini açıklayınız ve Osmanlı'nın bu gelişmeleri takip etmesinin neden önemli olduğunu belirtiniz.",
lines:11,

(function(){

/* ============ Veri ============ */
const BASE={kolay:10,orta:15,zor:20};

/* Dengeli zorluk dağılımı ve puanlar. İzin verilen puanlar: kolay 5, 10, 15 · orta 10, 15, 20 · zor 15, 20, 25. Toplam her senaryoda 100. */
const SCHEMES={
 6:{k:2,o:2,z:2,p:{kolay:[10,10],orta:[15,15],zor:[25,25]}},
 7:{k:2,o:3,z:2,p:{kolay:[10,5],orta:[15,15,15],zor:[20,20]}},
 8:{k:3,o:3,z:2,p:{kolay:[5,5,5],orta:[15,15,15],zor:[20,20]}}

function schemeFor(n){if(SCHEMES[n])return SCHEMES[n];const z=Math.floor(n/3),o=Math.ceil((n-z)/2),k=n-z-o;const raw=10*k+15*o+20*z,f=100/raw;
 const kp=Math.round(10*f),op=Math.round(15*f),zp=Math.round((100-k*kp-o*op)/(z||1));return {k,o,z,p:{kolay:Array(k).fill(kp),orta:Array(o).fill(op),zor:Array(z).fill(zp)}};}

 if(f===1)return {rubric:k.rubric,partial:k.partial};

 const vals=k.rubric.map((r,i)=>{const m=r[0].match(RE);if(m){const u=parseFloat(m[1].replace(",",".")),cnt=Math.round(r[1]/u);if(cnt>0&&Math.abs(cnt*u-r[1])<1e-6){fixed[i]=true;return Math.max(.5,half(u*f))*cnt;}}return Math.max(.5,half(r[1]*f));});

  order.sort((x,y)=>step<0?vals[y]-vals[x]:k.rubric[y][1]-k.rubric[x][1]);const i=order[0];vals[i]=half(vals[i]+step);diff=Math.round((diff-step)*2)/2;}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
 for(const f of files){const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);

  cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;}
 const csize=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});}

function table(rows,o){o=o||{};const cols=Math.max(...rows.map(r=>r.reduce((a,c)=>a+(c.span||1),0)));const W=o.width||9600;const cw=Math.floor(W/cols);
 return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:""}<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(b=>`<w:${b} w:val="${o.nob?"nil":"single"}" w:sz="${o.bsz||4}" w:space="0" w:color="${o.bcolor||"666666"}"/>`).join("")}</w:tblBorders><w:tblCellMar><w:top w:w="${o.pad||60}" w:type="dxa"/><w:left w:w="${o.padx||100}" w:type="dxa"/><w:bottom w:w="${o.pad||60}" w:type="dxa"/><w:right w:w="${o.padx||100}" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${Array(cols).fill(`<w:gridCol w:w="${cw}"/>`).join("")}</w:tblGrid>${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map(c=>`<w:tc><w:tcPr><w:tcW w:w="${cw*(c.span||1)}" w:type="dxa"/>${c.span>1?`<w:gridSpan w:val="${c.span}"/>`:""}${c.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${c.fill}"/>`:""}</w:tcPr>${(c.xml||"").trimEnd().endsWith("</w:p>")?c.xml:(c.xml||"")+para("")}</w:tc>`).join("")}</w:tr>`).join("")}</w:tbl>`;}

async function matXML(el,D){
 const BLOCK=/^(P|DIV|UL|OL|TABLE|H4|SVG|svg|SECTION)$/;
 function inl(node,f,parentCls){let out="";node.childNodes.forEach(n=>{
  if(n.nodeType===3){const t=n.textContent.replace(/\s+/g," ");if(t.trim()||t===" ")out+=run(t,f);}
  else if(n.nodeType===1){const tg=n.tagName;
   if(tg==="BR")out+="<w:r><w:br/></w:r>";
   else if(tg==="B"||tg==="STRONG"){out+=inl(n,{...f,b:true});if(n.parentElement&&(n.parentElement.matches(".profile,.cnode")))out+="<w:r><w:br/></w:r>";else if(n.parentElement&&n.parentElement.matches(".dialog p"))out+=run(" ",f);}
   else if(tg==="I"||tg==="EM")out+=inl(n,{...f,i:true});
   else if(n.classList.contains("age"))out+=inl(n,{...f,b:true})+run(" – ",f);
   else out+=inl(n,f);}
 });return out;}
 async function blk(node){let x="";
  for(const n of node.childNodes){
   if(n.nodeType===3){if(n.textContent.trim())x+=para(run(n.textContent.trim()));continue;}
   if(n.nodeType!==1)continue;const cl=n.classList,tg=n.tagName;
   if(cl.contains("chart")){const cv=chartCanvas(n);x+=para(D.image(canvasPNG(cv),cv.width,cv.height,6.2),{jc:"center"});continue;}
   if(tg.toLowerCase()==="svg"){const cv=await svgCanvas(n);if(cv)x+=para(D.image(canvasPNG(cv),cv.width,cv.height,4.6),{jc:"center"});continue;}
   if(cl.contains("tblwrap")){x+=await blk(n);continue;}
   if(tg==="OL"&&cl.contains("tl")){x+=table([...n.querySelectorAll("li")].map(li=>[{xml:para(run((li.querySelector(".age")||{}).textContent||"",{b:true}),{after:0}),fill:"EEEEEE"},{span:3,xml:para(run([...li.childNodes].filter(c=>!(c.classList&&c.classList.contains("age"))).map(c=>c.textContent).join("").trim()),{after:0})}]),{width:9000});x+=para("",{after:60});continue;}
   if(tg==="TABLE"){const cap=n.querySelector("caption");if(cap)x+=para(run(cap.textContent,{b:true}),{keep:true});
    const rows=[...n.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>({span:+td.getAttribute("colspan")||1,fill:td.tagName==="TH"?"EEEEEE":null,xml:para(inl(td,td.tagName==="TH"?{b:true}:{}),{after:0})})));
    x+=table(rows,{width:9000});x+=para("",{after:60});continue;}
   if(cl.contains("cmap")){const c=n.querySelector(".ccenter");x+=para(run([...c.childNodes].map(z=>z.textContent.trim()).filter(Boolean).join(" · "),{b:true}),{jc:"center"});n.querySelectorAll(".cnode").forEach(cn=>{const t=cn.querySelector("b");x+=para(run("● "+(t?t.textContent:"")+": ",{b:true})+run(cn.textContent.replace(t?t.textContent:"","").trim()),{ind:400});});continue;}
   if(cl.contains("profiles")){for(const p of n.children)x+=para(inl(p,{}),{ind:200,after:100});continue;}
   if(tg==="UL"){n.querySelectorAll(":scope>li").forEach(li=>{x+=para(run("• ")+inl(li,{}),{ind:300});});continue;}
   if(cl.contains("ph")){x+=para(inl(n,{b:true}),{shd:"DDDDDD"});continue;}
   if(cl.contains("cap")||cl.contains("srclabel")||cl.contains("mast")){x+=para(run(n.textContent.trim(),{b:true,sz:cl.contains("mast")?18:22}),{keep:true,after:60});continue;}
   if(cl.contains("src")){x+=para(run(n.textContent.trim(),{i:true,sz:17,color:"555555"}),{after:40});continue;}
   if(tg==="H4"){x+=para(inl(n,{b:true,sz:26}));continue;}

   const hasBlock=[...n.children].some(c=>BLOCK.test(c.tagName)||c.classList.contains("profile"));
   if(hasBlock)x+=await blk(n);else if(n.textContent.trim())x+=para(inl(n,{}));
  }return x;}

}

    b+=para(run("Puanlama ölçütleri:",{b:true}),{keep:true});
    b+=table([...sk.rubric.map(r=>[{span:5,xml:para(run(r[0]),{after:0})},{xml:para(run(fmt(r[1])),{jc:"right",after:0})}]),[{span:5,fill:"EEEEEE",xml:para(run("Toplam",{b:true}),{after:0})},{fill:"EEEEEE",xml:para(run(String(pts),{b:true}),{jc:"right",after:0})}]],{width:9000});
    b+=para(run("Kısmi puan:",{b:true}),{before:100,keep:true});sk.partial.forEach(e=>b+=para(run("• "+e),{ind:300}));
   });}
  b+=para(run("Yazılı Sınav Çalışma Örneği · "+COVER_SIGN,{i:true,sz:16,color:"666666"}),{jc:"center",before:400});
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="600" w:footer="600" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${D.imgs.map((_,i)=>`<Relationship Id="rImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.png"/>`).join("")}</Relationships>`;
  const files=[
   {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`},

   {name:"word/document.xml",data:doc},{name:"word/styles.xml",data:styles},{name:"word/_rels/document.xml.rels",data:rels},
   ...D.imgs.map((u,i)=>({name:`word/media/image${i+1}.png`,data:u}))];
  const blob=zip(files);
  window.__lastDocx=blob;
  if(await saveFile(baseName()+".docx",blob,blob.type))setStatus("Word dosyası hazır.");
 }catch(e){console.error(e);setStatus("Word dosyası oluşturulamadı: "+(e&&e.message||e),true);}
 finally{$("b-docx").disabled=false;}
}

/* ============ Olaylar ============ */
function init(){
 $("f-grade").innerHTML=Object.entries(GRADES).map(([k,g])=>`<option value="${k}">${esc(g.label)}</option>`).join("");$("f-grade").value=GRADE;
 fillExam();fillSen();renderSaved();newExam();
 $("f-grade").onchange=()=>{setGrade($("f-grade").value);st.exam=Object.keys(DIST)[0];st.sen=0;fillExam();fillSen();newExam();};
 $("f-exam").onchange=()=>{st.exam=$("f-exam").value;st.sen=0;fillSen();newExam();};
 $("f-sen").onchange=()=>{st.sen=+$("f-sen").value;newExam();};
 $("b-new").onclick=newExam;
 $("f-key").onchange=()=>{st.key=$("f-key").checked;render();};
 $("b-save").onclick=saveExam;
 $("b-html").onclick=async()=>{if(await saveFile(baseName()+".html",studentHTML(),"text/html"))setStatus("Öğrenci dosyası hazır. Cevap düğmeleri bu dosyada da çalışır.");};
 $("b-docx").onclick=doDocx;$("b-pdf").onclick=doPDF;
 $("sheet").addEventListener("click",e=>{const r=e.target.closest(".reveal");if(r){setOpen(r,r.getAttribute("aria-expanded")!=="true");return;}const s=e.target.closest(".swap");if(s)swap(+s.dataset.i);});
 $("saved").addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o)openSaved(o.dataset.open);const d=e.target.closest("[data-del]");if(d)delSaved(d.dataset.del);});
}
window.__tymm={st,newExam,swap,doDocx,studentHTML};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<style>:root{color-scheme:light}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151821">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Birlikte Yaşamak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: akıllı tahta sahnesi. Koyu sahne, ortada beyaz kitap sayfası, üstte bilgi şeridi, altta adım çubuğu. */
:root {
  --stage: #151821;
  --chrome: #1d212d;
  --chrome-2: #262b3a;
  --line: #343a4d;
  --text: #eef0f6;
  --muted: #9aa1b5;
  --accent: #d63b66;      /* kitabın ahududu rengi */
  --accent-soft: #f2c6d3;
  --ink: #1b47b0;          /* tükenmez kalem mavisi */
  --paper: #ffffff;
  --card-fg: #1d2233;
  --link: #2fa36b;
  --f-ui: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage); color: var(--text);
  font-family: var(--f-ui); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

/* Üst şerit */
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--chrome); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
.brand b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.jump { position: relative; display: flex; align-items: center; height: 34px; background: var(--chrome-2); border: 1px solid var(--line); border-radius: 8px; overflow: visible; }
.jump label { padding: 0 4px 0 10px; font-size: 12px; color: var(--muted); }
.jump input { width: 3.4em; height: 100%; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 0; }
.jump input:focus { outline: none; }
.jump:focus-within { border-color: var(--accent); }
.jump button { height: 100%; padding: 0 12px; border: 0; border-left: 1px solid var(--line); background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 0 7px 7px 0; }
.jumphint { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; white-space: nowrap; background: var(--accent); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 6px; pointer-events: none; }
.jumphint:empty { display: none; }
.where { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.where strong { color: var(--text); font-weight: 500; }
.credit { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border-radius: 99px; text-decoration: none; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: linear-gradient(90deg, #f58529, #dd2a7b 50%, #8134af); box-shadow: 0 2px 10px rgba(221,42,123,.35); }
.credit svg { width: 18px; height: 18px; flex: none; }
.credit span { display: flex; flex-direction: column; line-height: 1.05; }
.credit small { font-size: 9.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.credit:hover { filter: brightness(1.08); }
.credit-big { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; text-decoration: none; color: #fff; background: linear-gradient(90deg, #f58529, #dd2a7b 50%, #8134af); font-weight: 600; }
.credit-big svg { width: 26px; height: 26px; flex: none; }
.credit-big small { display: block; font-weight: 400; font-size: 12px; opacity: .92; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tbtn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
  background: var(--chrome-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px;
}
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.sel { height: 34px; background: var(--chrome-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--text); }
.sel-wrap { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

/* Sahne */
.stage { position: relative; flex: 1; overflow: hidden; min-height: 0; }
.pagewrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; perspective: 1800px; }
.sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  transition: transform .75s cubic-bezier(.65,.02,.25,1);
  background: var(--paper); box-shadow: 0 18px 50px rgba(0,0,0,.45);
}
.sheet img.pg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.spot {
  position: absolute; pointer-events: none; border-radius: calc(var(--u) * 10px);
  box-shadow: 0 0 0 400vmax rgba(14,16,24,.82);
  opacity: 0; transition: opacity .5s ease, left .75s cubic-bezier(.65,.02,.25,1), top .75s cubic-bezier(.65,.02,.25,1), width .75s cubic-bezier(.65,.02,.25,1), height .75s cubic-bezier(.65,.02,.25,1);
  z-index: 5;
}
.zoomed .spot { opacity: 1; }
.hot {
  position: absolute; z-index: 1; border-radius: calc(var(--u) * 10px); cursor: zoom-in;
  border: 2px dashed transparent; transition: border-color .2s, background .2s;
}
.hot:hover { border-color: var(--accent); background: rgba(214,59,102,.06); }
.hot span {
  position: absolute; left: -2px; top: 0; transform: translateY(-100%);
  background: var(--accent); color: #fff; font-size: calc(var(--u) * 15px); padding: .15em .6em; border-radius: .4em .4em 0 0;
  white-space: nowrap; opacity: 0; transition: opacity .2s;
}
.hot:hover span { opacity: 1; }
.zoomed .hot { display: none; }

/* Cevaplar */
.ans { position: absolute; z-index: 3; pointer-events: none; }
.ink {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; pointer-events: none;
  font-family: var(--f-hand); color: var(--ink); white-space: pre-line;
  font-size: calc(var(--u) * var(--fs, 19) * 1px); line-height: 1.55;
  padding: calc(var(--u) * 2px) calc(var(--u) * 6px);
  clip-path: inset(0 100% 0 0); transition: clip-path 1.1s ease;
}
.ans.open .ink { clip-path: inset(0 0 0 0); }
.ink.ctr { display: flex; align-items: center; justify-content: center; text-align: center; padding: 0; line-height: 1; font-weight: 700; }
.pill {
  position: absolute; pointer-events: auto; cursor: pointer; z-index: 4;
  display: inline-flex; align-items: center; gap: .35em;
  font-family: var(--f-ui); font-weight: 500; font-size: calc(var(--u) * 13px);
  padding: .3em .7em; border-radius: 99px;
  border: calc(var(--u) * 1.5px) solid rgba(214,59,102,.75);
  background: rgba(255,255,255,.35); color: var(--accent);
  backdrop-filter: blur(1px); transition: background .2s, color .2s, opacity .2s, transform .3s;
}
.pill:hover { background: var(--accent); color: #fff; }
.pill svg { width: 1.15em; height: 1.15em; }
.ans.ink-mode .pill { right: calc(var(--u) * 4px); top: calc(var(--u) * 4px); }
.ans.card-mode .pill { right: 0; bottom: 0; transform: translateY(35%); }
.pill .hide { display: none; }
.ans.open .pill .show { display: none; }
.ans.open .pill .hide { display: inline; }
.ans.open .pill { padding: .3em; opacity: .45; background: rgba(255,255,255,.2); }
.ans.open .pill:hover { opacity: 1; background: var(--accent); color: #fff; }
.ans.open .pill span { display: none !important; }
.ans.ink-mode.open .pill { top: 0; right: 0; transform: translate(55%, -55%); }
.card {
  position: absolute; left: 0; right: 0; pointer-events: auto;
  background: #fff; color: var(--card-fg); border-radius: calc(var(--u) * 12px);
  border: calc(var(--u) * 2px) solid var(--accent);
  box-shadow: 0 10px 30px rgba(20,20,40,.28);
  padding: calc(var(--u) * 12px) calc(var(--u) * 16px);
  font-family: var(--f-hand); font-size: calc(var(--u) * 18px); line-height: 1.45; color: var(--ink);
  white-space: pre-line;
  opacity: 0; transform: translateY(calc(var(--u) * -8px)) scale(.98); transition: opacity .35s, transform .35s; visibility: hidden;
}
.card small { display: block; font-family: var(--f-ui); font-size: calc(var(--u) * 12px); color: var(--accent); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .3em; }
.ans.open .card { opacity: 1; transform: none; visibility: visible; }
.card.below { top: calc(100% + var(--u) * 14px); }
.card.above { bottom: calc(100% + var(--u) * 10px); }

.lnk {
  position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center;
  border-radius: calc(var(--u) * 8px); text-decoration: none;
  outline: calc(var(--u) * 3px) solid var(--link); outline-offset: calc(var(--u) * 2px);
  animation: pulse 2.2s ease-in-out infinite;
}
.lnk span {
  position: absolute; bottom: calc(100% + var(--u) * 8px); right: 0; white-space: nowrap;
  background: rgba(255,255,255,.5); color: #1f7a4f; border: calc(var(--u) * 1.5px) solid rgba(47,163,107,.8);
  font-family: var(--f-ui); font-size: calc(var(--u) * 11px); font-weight: 500;
  padding: .25em .7em; border-radius: 99px; pointer-events: none;
}
.lnk { background: transparent; border: 0; padding: 0; cursor: pointer; }
.lnk:hover span { background: var(--link); color: #fff; }
@keyframes pulse { 50% { outline-color: rgba(47,163,107,.25); } }

/* Alt çubuk */
.bottom {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  background: var(--chrome); border-top: 1px solid var(--line);
}
.nav {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--chrome-2); border: 1px solid var(--line); cursor: pointer;
}
.nav.main { background: var(--accent); border-color: var(--accent); width: 52px; height: 52px; }
.nav:disabled { opacity: .35; cursor: default; }
.nav svg { width: 20px; height: 20px; }
.steps { display: flex; gap: 6px; align-items: center; overflow-x: auto; min-width: 0; padding: 4px 2px; scrollbar-width: none; }
.step {
  height: 30px; padding: 0 11px; border-radius: 99px; flex: none; cursor: pointer; font-size: 12px;
  background: transparent; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
}
.step:hover { color: var(--text); border-color: var(--muted); }
.step.on { background: var(--text); color: var(--stage); border-color: var(--text); font-weight: 500; }
.step i { font-style: normal; font-variant-numeric: tabular-nums; opacity: .7; margin-right: 5px; }

/* Sayfa çekmecesi */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(10,12,18,.72); display: flex; justify-content: flex-start;
}
.drawer[hidden] { display: none !important; }
.drawer-in {
  width: min(380px, 100%); height: 100%; overflow-y: auto; background: var(--chrome); border-right: 1px solid var(--line);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.drawer h2 { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; }
.thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.thumb { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; display: grid; gap: 6px; }
.thumb img { width: 100%; height: auto; aspect-ratio: 1700/2200; object-fit: cover; border-radius: 4px; border: 2px solid transparent; background: #fff; }
.thumb.on img { border-color: var(--accent); }
.thumb span { font-size: 12px; color: var(--muted); }
.thumb span b { color: var(--text); font-weight: 600; margin-right: 6px; }

.help { transition: opacity .6s; }
.help.gone { opacity: 0; pointer-events: none; }
.help { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 5; font-size: 11px; color: var(--muted); background: rgba(21,24,33,.8); padding: 6px 10px; border-radius: 8px; }
.help kbd { font-family: var(--f-ui); background: var(--chrome-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }

/* Dijital içerik penceresi */
.modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; background: rgba(8,10,16,.7); display: grid; place-items: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal[hidden] { display: none !important; }
.mbox { width: min(760px, 100%); max-height: 100%; overflow: auto; background: #fff; color: var(--card-fg); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.mbox { color-scheme: light; }
.mbox table { color: inherit; font-size: inherit; }
.mhead { position: sticky; top: 0; background: #fff; display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid #ece6ea; z-index: 1; }
.mhead small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.mhead h3 { margin: 2px 0 0; font-size: 19px; font-weight: 600; text-wrap: balance; }
.mclose { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 18px; color: var(--card-fg); flex: none; }
.mtabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
.mtabs button { border: 1px solid #e3d6dc; background: #fff; color: var(--card-fg); border-radius: 99px; padding: 6px 13px; font-size: 13px; cursor: pointer; }
.mtabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.mbody { padding: 16px 20px 22px; font-size: 15px; line-height: 1.6; }
.mbody p { margin: 0 0 10px; max-width: 65ch; }
.mbody ul { margin: 0 0 12px; padding-left: 20px; }
.mbody li { margin-bottom: 4px; }
.mbody a { color: var(--accent); }
.fx { background: #fbf1f4; border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 10px 10px 0; margin-top: 10px; }
.fx b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.src { font-size: 12.5px; color: #6b6f80; margin-top: 12px !important; }
.clim, .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.clim > div, .two > div { border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.55; min-width: 0; }
.clim b, .two b { display: block; font-size: 15px; margin-bottom: 4px; }
.clim em { font-style: normal; font-weight: 600; }
.c-k { background: #fdf6c9; } .c-a { background: #dcefc2; } .c-s { background: #fde3b4; }
.two > div { background: #f3f4f8; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 4px; }
.stats div { background: #f3f4f8; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: #555a6c; line-height: 1.35; }
.stats span { display: block; font-size: 22px; font-weight: 600; color: var(--card-fg); font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; margin: 6px 0 4px; }
.bars div { display: grid; grid-template-columns: minmax(0, 230px) 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.bars i { height: 12px; border-radius: 99px; background: #1aa0e0; width: calc(var(--w) / 21.6 * 100%); }
.bars b { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.qz { border-top: 1px solid #ece6ea; padding: 16px 20px 22px; }
.qz h4, .sorter h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.qq { margin-bottom: 14px; }
.qq p { margin: 0 0 6px; font-weight: 500; }
.qo { display: flex; flex-wrap: wrap; gap: 6px; }
.qo button { border: 1px solid #d9dbe4; background: #fff; border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--card-fg); }
.qo button.ok { background: #d9f2e4; border-color: #2fa36b; }
.qo button.no { background: #fde0e6; border-color: var(--accent); }
.ck { width: 100%; border-collapse: collapse; font-size: 14px; }
.ck th, .ck td { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: center; }
.ck th:first-child, .ck td:first-child { text-align: left; }
.ck td:first-child { line-height: 1.4; }
.ck input { width: 18px; height: 18px; accent-color: var(--accent); }
.ckbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ckbar input[type=text] { flex: 1 1 200px; min-width: 0; border: 1px solid #d9dbe4; border-radius: 10px; padding: 8px 12px; font: inherit; color: var(--card-fg); background: #fff; }
.ckbar button, .sorter .reset { border: 1px solid #d9dbe4; background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit; font-size: 13px; color: var(--card-fg); }
.score { font-weight: 600; color: var(--accent); }
.ckwrap { overflow-x: auto; }
.sorter { border-top: 1px solid #ece6ea; padding: 16px 20px 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 38px; }
.chip { border: 1px solid #c9cbd6; background: #fff; border-radius: 99px; padding: 6px 13px; cursor: pointer; font-size: 14px; color: var(--card-fg); }
.chip.sel { background: var(--card-fg); color: #fff; }
.chip.ok { background: #d9f2e4; border-color: #2fa36b; cursor: default; }
.chip.shake { animation: shake .35s; border-color: var(--accent); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.bin { border: 2px dashed #d5c7cd; border-radius: 12px; padding: 10px; min-height: 90px; cursor: pointer; background: #fff; text-align: left; font: inherit; color: var(--card-fg); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.bin > b { font-size: 14px; }
.bin.k { background: #fefbe6; } .bin.a { background: #eef7e3; } .bin.s { background: #fff3dd; } .bin.d { background: #eef2fd; }
.done { margin-top: 10px; font-weight: 600; color: #1f7a4f; }

/* İl seçimi */
.citybox { padding: 18px 20px 22px; }
.citybox p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #444a5c; max-width: 60ch; }
.citysearch { width: 100%; border: 1px solid #d9dbe4; border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 15px; color: var(--card-fg); background: #fff; margin-bottom: 12px; }
.citygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; max-height: 46vh; overflow-y: auto; padding: 2px; }
.citygrid button { border: 1px solid #e0e2ea; background: #fff; border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--card-fg); cursor: pointer; text-align: left; }
.citygrid button:hover { border-color: var(--accent); }
.citygrid button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.cityfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; font-size: 13px; color: #6b6f80; }

/* Öğrenci kayıtları */
.ckform { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 12px; }
.ckform label, .cknote { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: #555a6c; min-width: 0; }
.ckform input, .cknote textarea, .recshead input, .recshead select {
  border: 1px solid #d9dbe4; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 400; color: var(--card-fg); background: #fff; min-width: 0; }
.cknote { margin-top: 12px; }
.cknote textarea { resize: vertical; }
.ckactions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.ckactions .score { margin-right: auto; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid #d9dbe4; background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: 13px; color: var(--card-fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: #b3123d; border-color: #f0b8c6; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.ckmsg { font-size: 13px; width: 100%; order: 5; }
.ckmsg.ok { color: #1f7a4f; } .ckmsg.err { color: #b3123d; }
.editing { background: #fff6d6; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.recs { border-top: 1px solid #ece6ea; padding: 16px 20px 22px; }
.recshead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.recshead h4 { margin: 0 auto 0 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.recshead input { flex: 0 1 180px; padding: 6px 10px; font-size: 13px; }
.recshead select { padding: 6px 10px; font-size: 13px; }
.rtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rtable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b6f80; font-weight: 600; padding: 6px; border-bottom: 1px solid #e5e6ee; }
.rtable td { padding: 8px 6px; border-bottom: 1px solid #f0f0f4; vertical-align: top; }
.rtable td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.rtable td.act { white-space: nowrap; text-align: right; }
.rtable td.act .btn + .btn { margin-left: 4px; }
.rtable .sub { display: block; color: #8a8ea0; font-size: 12px; margin-top: 2px; }
.rempty { color: #6b6f80; font-size: 14px; padding: 10px 0; }
.rexport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #f6f7fb; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
.rexport > span:first-child { color: #555a6c; font-weight: 600; margin-right: 4px; }
.localnote { background: #eef6ff; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; color: #2a3550; }
.linklike { color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 600; }
.bar { display: inline-block; height: 6px; border-radius: 99px; background: #eceef4; width: 60px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 520px) { .ckform { grid-template-columns: 1fr; } .rtable .hide-sm { display: none; } }

@media (max-width: 640px) {
  .credit small { display: none; }
  .help, .sel-wrap span, .tbtn .lbl { display: none; }
  .steps .step { max-width: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .spot, .ink, .card { transition: none !important; }
  .lnk { animation: none; }
}
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <b id="bookTitle">Birlikte Yaşamak</b>
    <span class="where" id="where"></span>
  </div>
  <form class="jump" id="jump" autocomplete="off" novalidate>
    <label for="jumpIn">Sayfa</label>
    <input id="jumpIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-describedby="jumpHint">
    <button type="submit">Git</button>
    <span class="jumphint" id="jumpHint" role="status"></span>
  </form>
  <a class="credit" href="https://www.instagram.com/erdemdeniz.den/" target="_blank" rel="noopener" title="Hazırlayan: @erdemdeniz.den (Instagram)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span><small>Hazırlayan</small>@erdemdeniz.den</span>
  </a>
  <div class="tools">
    <button class="tbtn" id="btnPages" title="Sayfalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></svg>
      <span class="lbl">Sayfalar</span>
    </button>
    <button class="tbtn" id="btnAns" aria-pressed="false" title="Bu sayfanın cevaplarını göster (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span class="lbl">Cevaplar</span>
    </button>
    <button class="tbtn" id="btnCity" title="Yaşadığınız il" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span class="lbl" id="cityLbl">İl seç</span>
    </button>
    <button class="tbtn" id="btnRec" title="Öğrenci kayıtları">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="m9 13 2 2 4-4"/></svg>
      <span class="lbl">Kayıtlar</span>
    </button>
    <label class="sel-wrap"><span>Geçiş</span>
      <select class="sel" id="trans" aria-label="Sayfa geçişi">
        <option value="flip">Sayfa çevir</option>
        <option value="slide">Kaydır</option>
        <option value="zoom">Yakınlaş</option>
        <option value="fade">Solma</option>
      </select>
    </label>
    <button class="tbtn" id="btnFs" title="Tam ekran (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="lbl">Tam ekran</span>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-in">
      <a class="credit-big" href="https://www.instagram.com/erdemdeniz.den/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>@erdemdeniz.den<small>Bu etkileşimli kitabı hazırlayan · Instagram'da takip et</small></span></a>
      <h2>Sayfalar</h2>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>
  <div class="help"><kbd>←</kbd> <kbd>→</kbd> adım · <kbd>Esc</kbd> tam sayfa · <kbd>A</kbd> cevaplar · <kbd>85</kbd> + <kbd>Enter</kbd> sayfaya git · Hazırlayan: @erdemdeniz.den</div>
</main>

<footer class="bottom">
  <button class="nav" id="prevPage" title="Önceki sayfa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
  <button class="nav main" id="prev" title="Geri (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="steps" id="steps"></div>
  <button class="nav main" id="next" title="İleri (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
  <button class="nav" id="nextPage" title="Sonraki sayfa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></svg></button>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox" id="mbox"></div>
</div>

<script src="offline.js"></script>
<script src="fonts/pdf-fonts.js"></script>
<script src="data.js"></script>
<script src="panels.js"></script>
<script src="cities.js"></script>
<script>
(() => {
  document.documentElement.lang = 'tr';
  const B = window.BOOK;
  document.getElementById('bookTitle').textContent = B.title;
  try { document.title = B.title; } catch (e) {}
  // kontrol listesi ölçeği: [etiket, puan] (yüksekten düşüğe)
  const DEF_LEVELS = [['Evet', 2], ['Kısmen', 1], ['Hayır', 0]];
  const levelsOf = P => (P && P.levels) || DEF_LEVELS;
  const maxOf = P => Math.max.apply(null, levelsOf(P).map(l => l[1]));
  const legendOf = P => levelsOf(P).map(l => `${l[0]} ${l[1]}`).join(', ') + ' puan.';
  const ckPages = () => B.pages.filter(p => (p.links || []).some(l => { const P = (window.PANELS || {})[l.panel]; return P && P.checklist; })).map(p => p.n);
  const RW = B.ref[0], RH = B.ref[1];
  const stage = document.getElementById('stage');
  const stepsEl = document.getElementById('steps');
  const whereEl = document.getElementById('where');
  const btnAns = document.getElementById('btnAns');
  const transSel = document.getElementById('trans');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pct = (v, t) => (v / t * 100) + '%';
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';

  let pi = 0, si = 0, cur = null; // sayfa, adım (0 = tam sayfa)
  try { transSel.value = localStorage.getItem('trans') || 'flip'; } catch (e) {}
  transSel.addEventListener('change', () => { try { localStorage.setItem('trans', transSel.value); } catch (e) {} });

  function fit() {
    const W = stage.clientWidth, H = stage.clientHeight, pad = Math.min(28, W * 0.04);
    const s = Math.min((W - pad * 2) / RW, (H - pad * 2) / RH);
    return { W, H, u: s, pw: RW * s, ph: RH * s };
  }

  // ---- Yaşadığınız il ----
  const CITIES = window.CITIES || [], CT = window.CITY_TEXT || {};
  const hasCity = CITIES.length && B.pages.some(p => (p.answers || []).some(a => a.city));
  let city = null;
  try { const n = localStorage.getItem('kitap-il'); city = CITIES.find(c => c.ad === n) || null; } catch (e) {}
  const curCity = () => city || CITIES.find(c => c.ad === 'Ankara') || CITIES[0];
  function ansText(a) { return (a.city && CT[a.city] && CITIES.length) ? CT[a.city](curCity()) : a.text; }
  function refreshCity() {
    const lbl = document.getElementById('cityLbl'); if (lbl) lbl.textContent = city ? city.ad : 'İl seç';
    cache.forEach(w => {
      let changed = false;
      w._sheet.querySelectorAll('.ans').forEach(el => {
        const a = el._a; if (!a || !a.city) return;
        a._text = ansText(a); changed = true;
        const ink = el.querySelector('.ink'), ct = el.querySelector('.ct');
        if (ink) ink.textContent = a._text; if (ct) ct.textContent = a._text;
      });
      if (changed) { fitInk(w); if (w === cur && si) camera(cur); }
    });
  }

  function build(p, idx) {
    const wrap = document.createElement('div'); wrap.className = 'pagewrap';
    const sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = `<img class="pg" src="${p.img}" alt="Sayfa ${p.n}" draggable="false">`;
    const spot = document.createElement('div'); spot.className = 'spot'; sh.appendChild(spot);
    p.steps.forEach((st, k) => {
      const h = document.createElement('div'); h.className = 'hot';
      const [x, y, w, hh] = st.r;
      Object.assign(h.style, { left: pct(x, RW), top: pct(y, RH), width: pct(w, RW), height: pct(hh, RH) });
      h.innerHTML = `<span>${k + 1}. ${st.t}</span>`;
      h.addEventListener('click', () => go(idx, k + 1));
      sh.appendChild(h);
    });
    (p.answers || []).forEach(a => {
      const [x, y, w, h] = a.area;
      const el = document.createElement('div');
      el.className = 'ans ' + (a.mode === 'ink' ? 'ink-mode' : 'card-mode');
      Object.assign(el.style, { left: pct(x, RW), top: pct(y, RH), width: pct(w, RW), height: pct(h, RH) });
      const label = a.mode === 'ink' ? 'Cevap' : (a.label || 'Cevap');
      a._text = ansText(a);
      if (a.mode === 'ink') {
        el.innerHTML = `<div class="ink"></div><button class="pill">${eye}<span class="show">${label}</span><span class="hide">Gizle</span></button>`;
        el.querySelector('.ink').textContent = a._text;
        if (a.center) el.querySelector('.ink').classList.add('ctr');
        if (a.fs) el.querySelector('.ink').dataset.fs = a.fs;
      } else {
        const pos = (y + h) > RH * 0.72 ? 'above' : 'below';
        el.innerHTML = `<div class="card ${pos}"><small>${label === 'Cevabı göster' ? 'Cevap' : label}</small><div class="ct"></div></div><button class="pill">${eye}<span class="show">${label}</span><span class="hide">Gizle</span></button>`;
        el.querySelector('.ct').textContent = a._text;
      }
      el._a = a;
      el.querySelector('.pill').addEventListener('click', e => { e.stopPropagation(); el.classList.toggle('open'); afterToggle(); });
      sh.appendChild(el);
    });
    (p.links || []).forEach(l => {
      const [x, y, w, h] = l.area;
      let a;
      if (l.panel) {
        a = document.createElement('button'); a.className = 'lnk';
        a.addEventListener('click', e => { e.stopPropagation(); openPanel(l.panel); });
        a.innerHTML = `<span>${l.label} ▸</span>`;
      } else {
        a = document.createElement('a'); a.className = 'lnk'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = `<span>${l.label} ↗</span>`;
      }
      a.title = l.label; a.setAttribute('aria-label', l.label);
      Object.assign(a.style, { left: pct(x, RW), top: pct(y, RH), width: pct(w, RW), height: pct(h, RH) });
      sh.appendChild(a);
    });
    wrap.appendChild(sh);
    wrap._sheet = sh; wrap._spot = spot; wrap._p = p;
    return wrap;
  }

  // Mürekkep cevapları kutuya sığdır (referans birimlerde, bir kez)
  function fitInk(wrap) {
    wrap._sheet.querySelectorAll('.ink').forEach(ink => {
      let fs = +ink.dataset.fs || 19; ink.style.setProperty('--fs', fs);
      const box = ink.parentElement;
      const wasOpen = box.classList.contains('open');
      let guard = 0;
      while (ink.scrollHeight > ink.clientHeight + 1 && fs > 9 && guard++ < 40) { fs -= 0.5; ink.style.setProperty('--fs', fs); }
      if (!wasOpen) box.classList.remove('open');
    });
  }

  function camera(wrap, animate = true) {
    const f = fit(), sh = wrap._sheet, p = wrap._p;
    sh.style.width = f.pw + 'px'; sh.style.height = f.ph + 'px';
    sh.style.setProperty('--u', f.u);
    if (!animate) sh.style.transition = 'none';
    const st = wrap === cur ? si : 0;
    if (st === 0) {
      sh.style.transform = `translate(${(f.W - f.pw) / 2}px, ${(f.H - f.ph) / 2}px) scale(1)`;
      wrap.classList.remove('zoomed');
    } else {
      let [x, y, w, h] = p.steps[st - 1].r;
      // açık kartları da kadraja al
      sh.querySelectorAll('.ans.open .card').forEach(c => {
        const a = c.parentElement._a, [ax, ay, aw, ah] = a.area;
        if (!(ax >= x - 5 && ay >= y - 5 && ax + aw <= x + w + 5 && ay + ah <= y + h + 5)) return;
        const ch = c.offsetHeight / f.u;
        const top = c.classList.contains('below') ? ay + ah + 14 : ay - 10 - ch;
        const ny = Math.min(y, top - 6), nb = Math.max(y + h, top + ch + 6);
        y = ny; h = nb - ny;
      });
      const m = 14;
      x -= m; y -= m; w += m * 2; h += m * 2;
      const s = Math.min(f.W * 0.96 / (w * f.u), f.H * 0.94 / (h * f.u));
      const tx = f.W / 2 - s * (x + w / 2) * f.u, ty = f.H / 2 - s * (y + h / 2) * f.u;
      sh.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      const sp = wrap._spot;
      Object.assign(sp.style, { left: pct(x, RW), top: pct(y, RH), width: pct(w, RW), height: pct(h, RH) });
      wrap.classList.add('zoomed');
    }
    if (!animate) { sh.offsetWidth; sh.style.transition = ''; }
  }

  const cache = new Map();
  function getWrap(i) {
    if (!cache.has(i)) cache.set(i, build(B.pages[i], i));
    return cache.get(i);
  }

  function pageAnim(inEl, outEl, dir) {
    const mode = transSel.value, d = dir >= 0 ? 1 : -1;
    if (reduce || !outEl) { if (outEl) outEl.remove(); return; }
    const dur = mode === 'flip' ? 750 : 520, ease = 'cubic-bezier(.6,.05,.3,1)';
    let kin, kout;
    if (mode === 'slide') {
      kin = [{ transform: `translateX(${d * 100}%)` }, { transform: 'none' }];
      kout = [{ transform: 'none' }, { transform: `translateX(${-d * 100}%)` }];
    } else if (mode === 'zoom') {
      kin = [{ transform: 'scale(.82)', opacity: 0 }, { transform: 'none', opacity: 1 }];
      kout = [{ transform: 'none', opacity: 1 }, { transform: 'scale(1.15)', opacity: 0 }];
    } else if (mode === 'fade') {
      kin = [{ opacity: 0 }, { opacity: 1 }];
      kout = [{ opacity: 1 }, { opacity: 0 }];
    } else {
      inEl.style.transformOrigin = d > 0 ? '100% 50%' : '0% 50%';
      outEl.style.transformOrigin = d > 0 ? '0% 50%' : '100% 50%';
      kin = [{ transform: `rotateY(${d * 70}deg)`, opacity: 0, offset: 0 }, { opacity: 1, offset: .5 }, { transform: 'none', opacity: 1 }];
      kout = [{ transform: 'none', opacity: 1 }, { transform: `rotateY(${-d * 70}deg)`, opacity: 0 }];
    }
    outEl.style.pointerEvents = 'none';
    inEl.animate(kin, { duration: dur, easing: ease });
    const a = outEl.animate(kout, { duration: dur, easing: ease, fill: 'forwards' });
    a.onfinish = () => { outEl.remove(); outEl.style.pointerEvents = ''; a.cancel(); inEl.style.transformOrigin = ''; };
  }

  function go(np, ns, opts = {}) {
    np = Math.max(0, Math.min(B.pages.length - 1, np));
    const p = B.pages[np];
    ns = Math.max(0, Math.min(p.steps.length, ns));
    const pageChanged = np !== pi || !cur;
    const dir = np - pi;
    pi = np; si = ns;
    if (pageChanged) {
      const old = cur;
      cur = getWrap(np);
      if (!cur.isConnected) stage.insertBefore(cur, stage.querySelector('.help'));
      camera(cur, false);
      if (!cur._fitted) { fitInk(cur); cur._fitted = true; }
      if (old && old !== cur) pageAnim(cur, old, dir);
      syncAnsBtn();
      if (ns > 0) requestAnimationFrame(() => camera(cur));
    } else {
      camera(cur);
    }
    renderSteps();
    try { history.replaceState(null, '', `#p${p.n}-${si}`); } catch (e) {}
  }

  function renderSteps() {
    const p = B.pages[pi];
    const items = [{ t: 'Tam sayfa' }, ...p.steps];
    stepsEl.innerHTML = items.map((s, k) =>
      `<button class="step${k === si ? ' on' : ''}" data-k="${k}" title="${s.t}">${k ? `<i>${k}</i>` : ''}${s.t}</button>`).join('');
    const onEl = stepsEl.querySelector('.on'); if (onEl && onEl.scrollIntoView) { try { onEl.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
    const st = si ? p.steps[si - 1].t : 'Tam sayfa';
    whereEl.innerHTML = `<strong>Sayfa ${p.n}</strong>${p.section ? ' · ' + p.section : ''} · ${st}`;
    if (document.activeElement !== jumpIn) jumpIn.value = p.n;
    document.getElementById('prev').disabled = pi === 0 && si === 0;
    document.getElementById('next').disabled = pi === B.pages.length - 1 && si === p.steps.length;
    document.getElementById('prevPage').disabled = pi === 0;
    document.getElementById('nextPage').disabled = pi === B.pages.length - 1;
    document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('on', i === pi));
  }
  stepsEl.addEventListener('click', e => { const b = e.target.closest('.step'); if (b) go(pi, +b.dataset.k); });

  function next() {
    const p = B.pages[pi];
    if (si < p.steps.length) go(pi, si + 1); else if (pi < B.pages.length - 1) go(pi + 1, 0);
  }
  function prev() {
    if (si > 0) go(pi, si - 1);
    else if (pi > 0) go(pi - 1, B.pages[pi - 1].steps.length);
  }
  function afterToggle() { syncAnsBtn(); if (si) setTimeout(() => camera(cur), 30); }
  function syncAnsBtn() {
    const all = cur ? cur.querySelectorAll('.ans') : [];
    btnAns.disabled = !all.length; btnAns.style.opacity = all.length ? '' : '.4';
    btnAns.setAttribute('aria-pressed', all.length && [...all].every(a => a.classList.contains('open')) ? 'true' : 'false');
  }
  function toggleAll() {
    const all = [...cur.querySelectorAll('.ans')];
    if (!all.length) return;
    const open = !all.every(a => a.classList.contains('open'));
    all.forEach(a => a.classList.toggle('open', open));
    afterToggle();
  }

  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('nextPage').onclick = () => go(pi + 1, 0);
  document.getElementById('prevPage').onclick = () => go(pi - 1, 0);
  btnAns.onclick = toggleAll;

  const drawer = document.getElementById('drawer');
  document.getElementById('thumbs').innerHTML = B.pages.map((p, i) =>
    `<button class="thumb" data-i="${i}"><img src="${p.img}" alt="" loading="lazy"><span><b>${p.n}</b>${p.section || p.steps[0].t}</span></button>`).join('');
  document.getElementById('thumbs').addEventListener('click', e => {
    const t = e.target.closest('.thumb'); if (!t) return; drawer.hidden = true; go(+t.dataset.i, 0);
  });
  document.getElementById('btnPages').onclick = () => { drawer.hidden = !drawer.hidden; };
  drawer.addEventListener('click', e => { if (e.target === drawer) drawer.hidden = true; });

  // sayfa numarasıyla geçiş
  const jumpForm = document.getElementById('jump'), jumpIn = document.getElementById('jumpIn'), jumpHint = document.getElementById('jumpHint');
  const firstN = B.pages[0].n, lastN = B.pages[B.pages.length - 1].n;
  jumpIn.placeholder = firstN;
  let hintT;
  const hint = t => { jumpHint.textContent = t; clearTimeout(hintT); if (t) hintT = setTimeout(() => { jumpHint.textContent = ''; }, 2600); };
  jumpForm.addEventListener('submit', e => {
    e.preventDefault();
    const n = parseInt(String(jumpIn.value).replace(/\D/g, ''), 10);
    const i = B.pages.findIndex(p => p.n === n);
    if (i < 0) { hint(`Bu kitapta ${firstN}–${lastN} arası sayfalar var`); jumpIn.select(); return; }
    hint(''); drawer.hidden = true; go(i, 0); jumpIn.blur();
  });
  jumpIn.addEventListener('focus', () => { try { jumpIn.select(); } catch (e) {} });
  jumpIn.addEventListener('keydown', e => { if (e.key === 'Escape') { jumpIn.value = B.pages[pi].n; jumpIn.blur(); } });
  jumpIn.addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== jumpIn && !jumpHint.textContent) jumpIn.value = B.pages[pi].n; }, 150); });

  // tam ekran (eski tarayıcılar için önekli)
  document.getElementById('btnFs').onclick = () => {
    const d = document, el = d.documentElement;
    try {
      const fsEl = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement;
      if (fsEl) (d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen).call(d);
      else {
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
      }
    } catch (e) {}
  };

  document.addEventListener('keydown', e => {
    if (!modal.hidden) { if (e.key === 'Escape') closePanel(); return; }
    if (e.target.matches('select, input, textarea')) return;
    if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); jumpIn.value = e.key; jumpIn.focus(); try { jumpIn.setSelectionRange(1, 1); } catch (x) {} return; }
    if (e.key.toLowerCase() === 'g') { e.preventDefault(); jumpIn.focus(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' ) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'PageDown') go(pi + 1, 0);
    else if (e.key === 'PageUp') go(pi - 1, 0);
    else if (e.key === 'Escape') { if (!drawer.hidden) drawer.hidden = true; else go(pi, 0); }
    else if (e.key.toLowerCase() === 'a') toggleAll();
    else if (e.key.toLowerCase() === 'f') document.getElementById('btnFs').click();
  });

  // dokunmatik kaydırma
  let tx0 = null;
  stage.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null;
    if (Math.abs(dx) > 60) (dx < 0 ? next : prev)();
  });

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => cur && camera(cur, false), 80); });

  // ---- Dijital içerik pencereleri ----
  const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function openPanel(id, openRec) {
    const P = (window.PANELS || {})[id]; if (!P) return;
    let h = `<div class="mhead"><div><small>Dijital içerik</small><h3 id="mtitle">${esc(P.title)}</h3></div><button class="mclose" aria-label="Kapat">✕</button></div>`;
    if (P.tabs) {
      if (P.tabs.length > 1) h += `<div class="mtabs">${P.tabs.map((t, i) => `<button data-t="${i}" class="${i ? '' : 'on'}">${esc(t.t)}</button>`).join('')}</div>`;
      h += `<div class="mbody" id="mtab"></div>`;
    }
    if (P.checklist) {
      h += `<div class="mbody"><div id="ckedit"></div>
        <div class="ckform">
          <label>Öğrenci veya grup adı<input type="text" id="ckname" autocomplete="off"></label>
          <label>Sınıf / şube<input type="text" id="ckclass" placeholder="ör. 6-A" autocomplete="off"></label>
        </div>
        <div class="ckwrap"><table class="ck"><thead><tr><th>Ölçüt</th>${levelsOf(P).map(l => `<th>${esc(l[0])}</th>`).join('')}</tr></thead><tbody>
        ${P.checklist.map((c, i) => `<tr><td>${i + 1}. ${esc(c)}</td>${levelsOf(P).map(l => `<td><input type="radio" name="ck${i}" value="${l[1]}" aria-label="${esc(l[0])}"></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        <label class="cknote">Öğretmen notu (isteğe bağlı)<textarea id="cknote" rows="2"></textarea></label>
        <div class="ckactions"><span class="score" id="ckscore"></span><button class="btn" id="ckreset">Temizle</button><button class="btn primary" id="cksave">Kaydet</button><span class="ckmsg" id="ckmsg" role="status"></span></div>
        <p class="src">${esc(legendOf(P))}</p></div>
        <div class="recs"><div class="recshead"><h4>Bu listenin kayıtları</h4><input type="search" id="recq" placeholder="Öğrenci ara" aria-label="Öğrenci ara"></div><div id="reclist"></div></div>`;
    }
    if (P.quiz) {
      h += `<div class="qz"><h4>Kendini dene</h4>${P.quiz.map((q, i) => `<div class="qq"><p>${i + 1}. ${esc(q.q)}</p><div class="qo">${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>`;
    }
    if (P.sort) {
      const items = P.sort.items.map((it, i) => ({ t: it[0], g: it[1], i })).sort(() => Math.random() - .5);
      h += `<div class="sorter"><h4>Eşleştir</h4><p style="margin:0 0 10px">${esc(P.sort.prompt)} Önce karta, sonra doğru kutuya dokun.</p>
        <div class="chips" id="chips">${items.map(it => `<button class="chip" data-g="${it.g}">${esc(it.t)}</button>`).join('')}</div>
        <div class="bins">${P.sort.groups.map((g, i) => `<button class="bin ${['k', 'a', 's', 'd'][i] || ''}" data-g="${i}"><b>${esc(g)}</b></button>`).join('')}</div>
        <div class="done" id="sdone" hidden>Tebrikler, hepsi doğru!</div></div>`;
    }
    store.listeners.clear();
    mbox.innerHTML = h;
    modal.hidden = false;
    mbox.scrollTop = 0;
    mbox.querySelector('.mclose').onclick = closePanel;
    if (P.tabs) {
      const show = i => {
        const t = P.tabs[i];
        let html = t.html || '';
        if (t.video) html += `<p><a href="${esc(t.video)}" target="_blank" rel="noopener">▶ Videoyu izle ↗</a></p>`;
        mbox.querySelector('#mtab').innerHTML = html;
        mbox.querySelectorAll('.mtabs button').forEach(b => b.classList.toggle('on', +b.dataset.t === i));
      };
      mbox.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => show(+b.dataset.t));
      show(0);
    }
    mbox.querySelectorAll('.qo button').forEach(b => b.onclick = () => {
      const q = P.quiz[+b.dataset.q], ok = +b.dataset.o === q.a;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('ok', 'no'));
      b.classList.add(ok ? 'ok' : 'no');
      if (!ok) b.parentElement.children[q.a].classList.add('ok');
    });
    if (P.checklist) setupChecklist(id, P, openRec);
    if (P.sort) {
      let sel = null;
      const chips = mbox.querySelector('#chips');
      chips.querySelectorAll('.chip').forEach(c => c.onclick = () => {
        if (c.classList.contains('ok')) return;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('sel'));
        sel = c; c.classList.add('sel');
      });
      mbox.querySelectorAll('.bin').forEach(bin => bin.onclick = () => {
        if (!sel) return;
        if (sel.dataset.g === bin.dataset.g) {
          sel.classList.remove('sel'); sel.classList.add('ok'); bin.appendChild(sel); sel = null;
          if (!chips.querySelector('.chip')) mbox.querySelector('#sdone').hidden = false;
        } else {
          const c = sel; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        }
      });
    }
    mbox.querySelector('.mclose').focus();
  }
  function closePanel() { modal.hidden = true; mbox.innerHTML = ''; store.listeners.clear(); }

  // ---- Kayıt deposu (claude.ai paylaşılan veritabanı) ----
  const store = { db: null, canEdit: null, downloads: null, records: [], state: 'loading', listeners: new Set() };
  const notify = () => store.listeners.forEach(f => { try { f(); } catch (e) {} });
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  // Claude dışında (USB, kendi web siteniz): kayıtlar bu tarayıcıda saklanır, dosyalar normal indirilir
  const LOCAL = !window.claude;
  store.local = LOCAL;
  function makeLocalDb() {
    const KEY = 'kitap-kayitlar:' + (B.id || B.title);
    const subs = [];
    const all = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } };
    const save = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { throw { code: 'quota_exceeded' }; } };
    const snap = () => {
      const o = all();
      const docs = Object.keys(o).map(id => ({ id, exists: true, data: () => o[id] })).sort((a, b) => String(b.data().tarih).localeCompare(String(a.data().tarih)));
      return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false } };
    };
    const fire = () => subs.forEach(f => f(snap()));
    addEventListener('storage', e => { if (e.key === KEY) fire(); });
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return {
      collection: () => ({
        orderBy: () => ({ onSnapshot: f => { subs.push(f); setTimeout(() => f(snap()), 0); return () => {}; } }),
        add: async d => { const o = all(); const id = newId(); o[id] = d; save(o); fire(); return { id }; }
      }),
      doc: p => {
        const id = p.split('/')[1];
        return {
          set: async d => { const o = all(); o[id] = d; save(o); fire(); },
          delete: async () => { const o = all(); delete o[id]; save(o); fire(); }
        };
      },
      importAll: list => { const o = all(); let n = 0; list.forEach(r => { if (r && r.ogrenci && r.tarih) { const id = r.id || newId(); const c = Object.assign({}, r); delete c.id; o[id] = c; n++; } }); save(o); fire(); return n; }
    };
  }
  const localDownloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'application/json' });
      const url = URL.createObjectURL(blob);
      if (/\.pdf$/i.test(filename)) {
        // PDF yeni sekmede açılır: oradan yazdırılabilir ya da kaydedilebilir
        const w = window.open(url, '_blank');
        if (w) { setTimeout(() => URL.revokeObjectURL(url), 120000); return { status: 'opened' }; }
      }
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: 'saved' };
    }
  };
  (async () => {
    if (LOCAL) {
      let canStore = false;
      try { localStorage.setItem('kitap-test', '1'); localStorage.removeItem('kitap-test'); canStore = true; } catch (e) {}
      store.downloads = localDownloads;
      if (!canStore) { store.state = 'nostore'; notify(); return; }
      store.db = makeLocalDb(); store.downloads = localDownloads; store.canEdit = true;
      store.db.collection('kayitlar').orderBy('tarih', 'desc').onSnapshot(snap => {
        store.records = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        store.state = 'ok'; notify();
      });
      return;
    }
    const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, dl] = await Promise.all([use('db'), use('user'), use('downloads')]);
    store.db = db || null; store.downloads = dl || null;
    try { store.canEdit = user ? await user.canEdit() : null; } catch (e) { store.canEdit = null; }
    if (!store.db) { store.state = 'off'; notify(); return; }
    if (store.canEdit === false) { store.state = 'noaccess'; notify(); return; }
    const timer = setTimeout(() => { if (store.state === 'loading') { store.state = 'slow'; notify(); } }, 10000);
    store.db.collection('kayitlar').orderBy('tarih', 'desc').onSnapshot(snap => {
      store.records = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) clearTimeout(timer);
      store.state = 'ok'; notify();
    }, err => { clearTimeout(timer); store.state = err && err.code === 'revoked' ? 'off' : 'error'; notify(); });
  })();

  const fmtDate = iso => { try { return new Date(iso).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const trLower = t => String(t || '').toLocaleLowerCase('tr-TR');
  function stateMsg() {
    return {
      nostore: 'Bu tarayıcı, dosyadan açılan sayfaların kayıt saklamasına izin vermiyor (bazı Android cihazlarda olur). Kayıt girmek için kitabı web adresinden ya da Chrome/Firefox ile açın.',
      off: 'Kayıtlar bu görünümde kullanılamıyor. Kitabı claude.ai hesabınızla oturum açarak açtığınızda kayıt yapabilirsiniz.',
      noaccess: 'Öğrenci kayıtlarını yalnızca kitabın sahibi ve düzenleme yetkisi olan öğretmenler görebilir ve girebilir.',
      loading: 'Kayıtlar yükleniyor…',
      slow: 'Kayıtlara şu an ulaşılamıyor. İnternet bağlantınızı kontrol edin; bağlantı gelince liste kendiliğinden yenilenir.',
      error: 'Kayıtlar yüklenemedi. Sayfayı daha sonra yeniden açmayı deneyin.'
    }[store.state] || '';
  }
  // ortak kayıt tablosu
  function recTable(rows, { showList, onOpen }) {
    if (store.state !== 'ok') return `<p class="rempty">${stateMsg()}</p>`;
    if (!rows.length) return `<p class="rempty">${store.records.length ? 'Aramanızla eşleşen kayıt yok.' : 'Henüz kayıt yok. Formu doldurup Kaydet\'e bastığınızda kayıt burada listelenir.'}</p>`;
    return `<div class="ckwrap"><table class="rtable"><thead><tr><th>Öğrenci</th><th class="hide-sm">Sınıf</th>${showList ? '<th class="hide-sm">Liste</th>' : ''}<th>Puan</th><th class="hide-sm">Tarih</th><th></th></tr></thead><tbody>${
      rows.map(r => `<tr><td>${esc(r.ogrenci)}${r.not ? `<span class="sub">${esc(r.not)}</span>` : ''}</td><td class="hide-sm">${esc(r.sinif || '–')}</td>${showList ? `<td class="hide-sm">${esc(r.baslik || '')}</td>` : ''}<td class="num">${r.toplam} / ${r.max}<span class="bar"><i style="width:${r.max ? Math.round(r.toplam / r.max * 100) : 0}%"></i></span></td><td class="num hide-sm">${fmtDate(r.tarih)}</td><td class="act">${store.downloads ? `<button class="btn sm" data-pdf="${esc(r.id)}" title="Bu öğrencinin sayfasını PDF olarak indir">PDF</button>` : ''}<button class="btn sm" data-open="${esc(r.id)}">Aç</button><button class="btn sm danger" data-del="${esc(r.id)}">Sil</button></td></tr>`).join('')
    }</tbody></table></div>`;
  }
  function wireTable(box, onOpen) {
    box.querySelectorAll('[data-pdf]').forEach(b => b.onclick = async () => {
      const r = store.records.find(x => x.id === b.dataset.pdf); if (!r) return;
      const t = b.textContent; b.disabled = true; b.textContent = '…';
      try { await makePdf([r], 'detay'); b.textContent = '✓'; }
      catch (e) { b.textContent = '!'; b.title = pdfErr(e); }
      setTimeout(() => { if (b.isConnected) { b.textContent = t; b.disabled = false; } }, 1800);
    });
    box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => onOpen(store.records.find(r => r.id === b.dataset.open)));
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Emin misiniz?'; setTimeout(() => { if (b.isConnected) { b.dataset.sure = ''; b.textContent = 'Sil'; } }, 4000); return; }
      b.disabled = true; b.textContent = 'Siliniyor…';
      try { await store.db.doc('kayitlar/' + b.dataset.del).delete(); } catch (e) { b.disabled = false; b.textContent = 'Silinemedi'; }
    });
  }

  function setupChecklist(id, P, openRec) {
    const $ = q => mbox.querySelector(q);
    const max = P.checklist.length * maxOf(P);
    let editing = null;
    $('#ckclass').value = lsGet('sinif');
    const read = () => P.checklist.map((_, i) => { const x = mbox.querySelector(`input[name="ck${i}"]:checked`); return x ? +x.value : null; });
    const upd = () => {
      const v = read(), n = v.filter(x => x !== null).length, s = v.reduce((a, b) => a + (b || 0), 0);
      $('#ckscore').textContent = `Puan: ${s} / ${max}` + (n < v.length ? ` · ${v.length - n} ölçüt boş` : '');
    };
    const msg = (t, cls) => { const m = $('#ckmsg'); m.textContent = t; m.className = 'ckmsg ' + (cls || ''); };
    const setEditing = r => {
      editing = r || null;
      $('#ckedit').innerHTML = r ? `<div class="editing"><span><b>${esc(r.ogrenci)}</b> kaydını düzenliyorsunuz (${fmtDate(r.tarih)}).</span><button class="btn sm" id="cknew">Yeni kayıt başlat</button></div>` : '';
      if (r) $('#cknew').onclick = () => { clear(); };
      $('#cksave').textContent = r ? 'Değişiklikleri kaydet' : 'Kaydet';
    };
    const clear = (keepMsg) => {
      mbox.querySelectorAll('.ck input').forEach(x => x.checked = false);
      $('#ckname').value = ''; $('#cknote').value = '';
      setEditing(null); upd(); if (!keepMsg) msg('');
    };
    const load = r => {
      if (!r) return;
      clear();
      $('#ckname').value = r.ogrenci || ''; $('#ckclass').value = r.sinif || ''; $('#cknote').value = r.not || '';
      (r.puanlar || []).forEach((v, i) => { if (v !== null && v !== undefined) { const x = mbox.querySelector(`input[name="ck${i}"][value="${v}"]`); if (x) x.checked = true; } });
      setEditing(r); upd(); mbox.scrollTop = 0;
    };
    mbox.querySelectorAll('.ck input').forEach(x => x.onchange = upd);
    $('#ckreset').onclick = () => clear();
    $('#cksave').onclick = async () => {
      const ad = $('#ckname').value.trim();
      if (!ad) { msg('Kaydetmek için öğrenci veya grup adını yazın.', 'err'); $('#ckname').focus(); return; }
      if (!store.db || store.state === 'off' || store.state === 'noaccess' || store.state === 'nostore') { msg(stateMsg(), 'err'); return; }
      const v = read();
      const body = {
        panel: id, baslik: P.title, sayfa: B.pages[pi] ? B.pages[pi].n : null,
        ogrenci: ad, sinif: $('#ckclass').value.trim(), not: $('#cknote').value.trim(),
        puanlar: v, toplam: v.reduce((a, b) => a + (b || 0), 0), max,
        tarih: editing ? editing.tarih : new Date().toISOString()
      };
      if (editing) body.guncelleme = new Date().toISOString();
      lsSet('sinif', body.sinif);
      const btn = $('#cksave'); btn.disabled = true; msg('Kaydediliyor…');
      try {
        if (editing) await store.db.doc('kayitlar/' + editing.id).set(body);
        else await store.db.collection('kayitlar').add(body);
        const was = editing;
        clear(true);
        msg(was ? `${ad} kaydı güncellendi.` : `${ad} kaydedildi. Sıradaki öğrenciye geçebilirsiniz.`, 'ok');
        $('#ckname').focus();
      } catch (e) {
        const c = e && e.code;
        msg(c === 'invalid_argument' ? 'Bu hesapla kayıt yapma yetkiniz yok.' : c === 'quota_exceeded' ? 'Kayıt alanı doldu. Eski kayıtlardan bazılarını silin.' : 'Kaydedilemedi. Bağlantınızı kontrol edip tekrar deneyin.', 'err');
      } finally { btn.disabled = false; }
    };
    const renderList = () => {
      const box = $('#reclist'); if (!box) return;
      const q = trLower($('#recq').value.trim());
      const rows = store.records.filter(r => r.panel === id && (!q || trLower(r.ogrenci).includes(q) || trLower(r.sinif).includes(q)));
      box.innerHTML = recTable(rows, { showList: false });
      wireTable(box, load);
      $('#cksave').disabled = store.state === 'noaccess';
    };
    $('#recq').oninput = renderList;
    store.listeners.add(renderList);
    renderList(); upd();
    if (openRec) load(store.records.find(r => r.id === openRec));
  }

  // ---- PDF oluşturma (jsPDF, Türkçe karakterler için gömülü yazı tipi) ----
  const loadScript = src => new Promise((ok, no) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => no({ code: 'lib' }); document.head.appendChild(sc);
  });
  let pdfReady = null;
  function pdfLibs() {
    if (!pdfReady) pdfReady = (async () => {
      const libs = window.OFFLINE_LIBS || ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
      for (const l of libs) await loadScript(l);
      if (window.PDF_FONTS) return window.PDF_FONTS;
      const b64 = async u => {
        const r = await fetch(u); if (!r.ok) throw { code: 'font' };
        const by = new Uint8Array(await r.arrayBuffer()); let s = '';
        for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000));
        return btoa(s);
      };
      const [reg, bold] = await Promise.all([b64('fonts/Carlito-Regular.ttf'), b64('fonts/Carlito-Bold.ttf')]);
      return { reg, bold };
    })().catch(e => { pdfReady = null; throw e; });
    return pdfReady;
  }
  const pdfErr = e => e && e.code === 'lib' ? 'PDF aracı yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.'
    : e && e.code === 'font' ? 'Yazı tipi yüklenemedi. Tekrar deneyin.'
    : e && (e.code === 'declined' || e.code === 'cancelled') ? 'İndirme iptal edildi.'
    : e && e.code === 'unavailable' ? 'Bu görünümde dosya indirilemiyor.'
    : 'PDF oluşturulamadı. Tekrar deneyin.';
  const slug = t => trLower(t).replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kayit';

  async function makePdf(rows, mode, cls) {
    if (!store.downloads) throw { code: 'unavailable' };
    const f = await pdfLibs();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    doc.addFileToVFS('Carlito-Regular.ttf', f.reg); doc.addFont('Carlito-Regular.ttf', 'Carlito', 'normal');
    doc.addFileToVFS('Carlito-Bold.ttf', f.bold); doc.addFont('Carlito-Bold.ttf', 'Carlito', 'bold');
    doc.setFont('Carlito', 'normal');
    const W = 210, M = 16, ACC = [214, 59, 102], INK = [29, 34, 51], MUTED = [110, 114, 130];
    const now = new Date().toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const head = (title, sub) => {
      doc.setFillColor(...ACC); doc.rect(0, 0, W, 4, 'F');
      doc.setFont('Carlito', 'bold'); doc.setFontSize(9); doc.setTextColor(...ACC);
      doc.text(B.title.toLocaleUpperCase('tr-TR') + ' · ÖĞRENCİ KAYITLARI', M, 13);
      doc.setFontSize(17); doc.setTextColor(...INK); doc.text(title, M, 21);
      doc.setFont('Carlito', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED); doc.text(sub, M, 27);
      doc.setDrawColor(230, 225, 230); doc.line(M, 31, W - M, 31);
    };
    const tableStyle = {
      styles: { font: 'Carlito', fontSize: 10, textColor: INK, cellPadding: 2.2, lineColor: [232, 233, 240], lineWidth: 0.2 },
      headStyles: { font: 'Carlito', fontStyle: 'bold', fillColor: [246, 240, 243], textColor: ACC, fontSize: 9 },
      alternateRowStyles: { fillColor: [251, 251, 253] },
      margin: { left: M, right: M, top: 20, bottom: 18 }
    };
    let fname;
    if (mode === 'ozet') {
      const lists = [...new Set(rows.map(r => r.baslik))];
      head(lists.length === 1 ? lists[0] : 'Kayıt özeti', `${cls ? 'Sınıf: ' + cls + ' · ' : ''}${rows.length} kayıt · Oluşturma: ${now}`);
      const avg = rows.reduce((a, r) => a + (r.max ? r.toplam / r.max : 0), 0) / rows.length;
      doc.autoTable(Object.assign({}, tableStyle, {
        startY: 36,
        head: [['#', 'Öğrenci / grup', 'Sınıf', ...(lists.length > 1 ? ['Liste'] : []), 'Puan', '%', 'Tarih']],
        body: rows.map((r, i) => [i + 1, r.ogrenci, r.sinif || '–', ...(lists.length > 1 ? [r.baslik] : []), `${r.toplam} / ${r.max}`, r.max ? Math.round(r.toplam / r.max * 100) : 0, fmtDate(r.tarih)]),
        columnStyles: { 0: { cellWidth: 9, textColor: MUTED } }
      }));
      let y = doc.lastAutoTable.finalY + 8;
      if (y > 270) { doc.addPage(); y = 24; }
      doc.setFont('Carlito', 'bold'); doc.setFontSize(11); doc.setTextColor(...INK);
      doc.text(`Sınıf ortalaması: %${Math.round(avg * 100)}`, M, y);
      fname = `kayit-ozeti${cls ? '-' + slug(cls) : ''}.pdf`;
    } else {
      rows.forEach((r, idx) => {
        if (idx) doc.addPage();
        const P = (window.PANELS || {})[r.panel] || {};
        const crit = P.checklist || (r.puanlar || []).map((_, i) => `Ölçüt ${i + 1}`);
        head(r.ogrenci, `${r.sinif ? 'Sınıf: ' + r.sinif + ' · ' : ''}${r.baslik || ''} · Kayıt: ${fmtDate(r.tarih)}`);
        // puan kutusu
        doc.setFillColor(251, 241, 244); doc.roundedRect(W - M - 46, 9, 46, 18, 3, 3, 'F');
        doc.setFont('Carlito', 'bold'); doc.setFontSize(18); doc.setTextColor(...ACC);
        doc.text(`${r.toplam} / ${r.max}`, W - M - 23, 19.5, { align: 'center' });
        doc.setFont('Carlito', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
        doc.text(`PUAN · %${r.max ? Math.round(r.toplam / r.max * 100) : 0}`, W - M - 23, 24.5, { align: 'center' });
        const mark = (v, want) => v === want ? 'X' : '';
        const LV = levelsOf(P), colW = LV.length > 3 ? 20 : 18;
        const colStyles = {};
        LV.forEach((l, k) => { const t = LV.length > 1 ? k / (LV.length - 1) : 0; colStyles[k + 1] = { halign: 'center', cellWidth: colW, fontStyle: 'bold', textColor: [Math.round(31 + (214 - 31) * t), Math.round(122 + (59 - 122) * t), Math.round(79 + (102 - 79) * t)] }; });
        doc.autoTable(Object.assign({}, tableStyle, {
          startY: 37,
          head: [['Ölçüt'].concat(LV.map(l => l[0]))],
          body: crit.map((c, i) => { const v = (r.puanlar || [])[i]; return [`${i + 1}. ${c}`].concat(LV.map(l => mark(v, l[1]))); }),
          columnStyles: colStyles
        }));
        let y = doc.lastAutoTable.finalY + 8;
        doc.setFont('Carlito', 'bold'); doc.setFontSize(10); doc.setTextColor(...INK);
        doc.text('Öğretmen notu', M, y);
        doc.setFont('Carlito', 'normal'); doc.setTextColor(...INK);
        const note = doc.splitTextToSize(r.not || '—', W - M * 2);
        doc.text(note, M, y + 6);
        y += 10 + note.length * 4.6;
        doc.setDrawColor(200, 200, 210);
        doc.line(M, y + 12, M + 60, y + 12); doc.line(W - M - 60, y + 12, W - M, y + 12);
        doc.setFontSize(9); doc.setTextColor(...MUTED);
        doc.text('Öğretmen imzası', M, y + 17); doc.text('Veli imzası', W - M - 60, y + 17);
        doc.setFontSize(8.5); doc.text(legendOf(P), M, 285);
      });
      fname = rows.length === 1 ? `${slug(rows[0].ogrenci)}-kontrol-listesi.pdf` : `ogrenci-sayfalari${cls ? '-' + slug(cls) : ''}.pdf`;
    }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFont('Carlito', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
      doc.text(`${i} / ${n}`, W - M, 290, { align: 'right' });
      doc.text('Hazırlayan: @erdemdeniz.den (Instagram)', W / 2, 290, { align: 'center' });
    }
    return store.downloads.save({ filename: fname, data: doc.output('blob') });
  }

  // Tüm kayıtlar penceresi
  function openRecords() {
    mbox.innerHTML = `<div class="mhead"><div><small>Öğrenci kayıtları</small><h3 id="mtitle">Kayıtlar</h3></div><button class="mclose" aria-label="Kapat">✕</button></div>
      <div class="recs" style="border-top:0"><div class="recshead"><h4 id="rcount">Tüm kayıtlar</h4>
        <select id="rclass" aria-label="Sınıfa göre süz"><option value="">Tüm sınıflar</option></select>
        <input type="search" id="rq" placeholder="Öğrenci ara" aria-label="Öğrenci ara">
        </div>
        <div class="rexport" id="rexport" hidden>
          <span>Görünen kayıtları indir:</span>
          <button class="btn sm primary" id="rpdf1">PDF · Özet liste</button>
          <button class="btn sm primary" id="rpdf2">PDF · Her öğrenci ayrı sayfa</button>
          <button class="btn sm" id="rcsv">Excel (CSV)</button>
          ${store.local ? '<button class="btn sm" id="rbak">Yedek al</button>' : ''}
          <span class="ckmsg" id="rmsg" role="status"></span>
        </div>
        ${store.local ? `<div class="localnote">Bu cihazda çalışıyorsunuz: kayıtlar yalnızca bu tarayıcıda saklanır. Başka bir bilgisayara ya da tahtaya taşımak için <b>Yedek al</b> ile dosya indirip orada <label class="linklike">Yedek yükle<input type="file" id="rimp" accept=".json,application/json" hidden></label> ile açın.<span class="ckmsg" id="rimpmsg" role="status"></span></div>` : ''}
        <div id="rlist"></div>
        <p class="src">Yazdırmak için indirilen PDF dosyasını açıp yazdır komutunu kullanın. Yeni kayıt girmek için kitaptaki kontrol listesini ya da puanlama anahtarını açın${ckPages().length ? ' (sayfa ' + ckPages().join(', ') + ', karekod)' : ''}.</p></div>`;
    modal.hidden = false;
    const $ = q => mbox.querySelector(q);
    $('.mclose').onclick = closePanel;
    const filtered = () => {
      const q = trLower($('#rq').value.trim()), c = $('#rclass').value;
      return store.records.filter(r => (!c || (r.sinif || '') === c) && (!q || trLower(r.ogrenci).includes(q)));
    };
    const render = () => {
      const sel = $('#rclass'), cur = sel.value;
      const classes = [...new Set(store.records.map(r => r.sinif || '').filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr'));
      sel.innerHTML = '<option value="">Tüm sınıflar</option>' + classes.map(c => `<option${c === cur ? ' selected' : ''}>${esc(c)}</option>`).join('');
      const rows = filtered();
      $('#rcount').textContent = store.state === 'ok' ? `${store.records.length} kayıt` : 'Kayıtlar';
      $('#rlist').innerHTML = recTable(rows, { showList: true });
      wireTable($('#rlist'), r => { if (r) { store.listeners.clear(); openPanel(r.panel, r.id); } });
      $('#rexport').hidden = !(store.downloads && store.state === 'ok' && rows.length);
    };
    $('#rq').oninput = render; $('#rclass').onchange = render;
    const runPdf = async (btn, mode) => {
      const rows = filtered(); if (!rows.length) return;
      const m = $('#rmsg'); btn.disabled = true; m.className = 'ckmsg'; m.textContent = 'PDF hazırlanıyor…';
      try {
        const res = await makePdf(rows, mode, $('#rclass').value);
        m.className = 'ckmsg ok'; m.textContent = res && res.status === 'opened' ? 'PDF yeni sekmede açıldı. Oradan yazdırabilir ya da kaydedebilirsiniz.' : res && res.status === 'saved' ? 'PDF indirildi. Yazdırmak için dosyayı açın.' : 'PDF hazır.';
      } catch (e) { m.className = 'ckmsg err'; m.textContent = pdfErr(e); }
      finally { btn.disabled = false; }
    };
    $('#rpdf1').onclick = e => runPdf(e.currentTarget, 'ozet');
    $('#rpdf2').onclick = e => runPdf(e.currentTarget, 'detay');
    if (store.local) {
      const bak = $('#rbak');
      if (bak) bak.onclick = () => {
        const d = new Date().toISOString().slice(0, 10);
        store.downloads.save({ filename: `kitap-kayitlari-yedek-${d}.json`, data: JSON.stringify({ tur: 'kitap-kayitlari', surum: 1, kayitlar: store.records }, null, 1) });
      };
      const imp = $('#rimp');
      if (imp) imp.onchange = async () => {
        const f = imp.files && imp.files[0]; if (!f) return;
        const m = $('#rimpmsg');
        try {
          const j = JSON.parse(await f.text());
          const list = Array.isArray(j) ? j : (j && j.kayitlar) || [];
          const n = store.db.importAll(list);
          m.className = 'ckmsg ok'; m.textContent = `${n} kayıt yüklendi. Aynı kayıtlar varsa üzerine yazıldı.`;
        } catch (e) { m.className = 'ckmsg err'; m.textContent = 'Bu dosya okunamadı. "Yedek al" ile indirilen .json dosyasını seçin.'; }
        imp.value = '';
      };
    }
    $('#rcsv').onclick = async () => {
      const rows = filtered();
      const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
      const head = ['Tarih', 'Liste', 'Sınıf', 'Öğrenci', 'Puan', 'En yüksek', 'Ölçüt puanları', 'Not'];
      const lines = [head.map(q).join(';')].concat(rows.map(r => [fmtDate(r.tarih), r.baslik, r.sinif, r.ogrenci, r.toplam, r.max, (r.puanlar || []).map(x => x === null ? '-' : x).join(' '), r.not].map(q).join(';')));
      try { await store.downloads.save({ filename: 'ogrenci-kayitlari.csv', data: '\ufeff' + lines.join('\r\n') }); } catch (e) {}
    };
    store.listeners.clear(); store.listeners.add(render); render();
    $('.mclose').focus();
  }
  document.getElementById('btnRec').onclick = openRecords;

  function openCity(first) {
    store.listeners.clear();
    mbox.innerHTML = `<div class="mhead"><div><small>Yaşadığınız il</small><h3 id="mtitle">Hangi ilde yaşıyorsunuz?</h3></div><button class="mclose" aria-label="Kapat">✕</button></div>
      <div class="citybox">
        <p>"Yaşadığınız il" sorularındaki örnek cevaplar seçtiğiniz ile göre hazırlanır. Seçiminizi üstteki konum düğmesinden istediğiniz zaman değiştirebilirsiniz.</p>
        <input class="citysearch" id="cityq" type="search" placeholder="İl ara (ör. Düzce)" aria-label="İl ara" autocomplete="off">
        <div class="citygrid" id="citygrid">${CITIES.map(c => `<button data-c="${esc(c.ad)}" class="${city && city.ad === c.ad ? 'on' : ''}">${esc(c.ad)}</button>`).join('')}</div>
        <div class="cityfoot"><span>${CITIES.length} il</span>${first ? '<button class="btn" id="cityskip">Şimdi değil (Ankara örneği)</button>' : ''}</div>
      </div>`;
    modal.hidden = false;
    const q = mbox.querySelector('#cityq'), grid = mbox.querySelector('#citygrid');
    mbox.querySelector('.mclose').onclick = closePanel;
    const sk = mbox.querySelector('#cityskip'); if (sk) sk.onclick = () => { try { localStorage.setItem('kitap-il-soruldu', '1'); } catch (e) {} closePanel(); };
    q.oninput = () => { const v = trLower(q.value.trim()); grid.querySelectorAll('button').forEach(b => { b.hidden = v && !trLower(b.dataset.c).includes(v); }); };
    q.onkeydown = e => { if (e.key === 'Enter') { const b = [...grid.querySelectorAll('button')].find(x => !x.hidden); if (b) b.click(); } };
    grid.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      city = CITIES.find(c => c.ad === b.dataset.c) || null;
      try { localStorage.setItem('kitap-il', city.ad); localStorage.setItem('kitap-il-soruldu', '1'); } catch (e) {}
      refreshCity(); closePanel();
    };
    setTimeout(() => { try { q.focus(); } catch (e) {} }, 50);
  }
  if (hasCity) {
    const bc = document.getElementById('btnCity'); bc.hidden = false; bc.onclick = () => openCity(false);
    refreshCity();
    let asked = false; try { asked = !!localStorage.getItem('kitap-il-soruldu'); } catch (e) { asked = true; }
    if (!asked && !city) setTimeout(() => { if (modal.hidden) openCity(true); }, 900);
  }
  modal.addEventListener('click', e => { if (e.target === modal) closePanel(); });

  // başlangıç: #p78-2 gibi bağlantıları destekle
  let sp = 0, ss = 0;
  const m = /^#p(\d+)-(\d+)$/.exec(location.hash);
  if (m) { const i = B.pages.findIndex(p => p.n === +m[1]); if (i >= 0) { sp = i; ss = +m[2]; } }
  pi = sp;
  go(sp, ss);
  ((document.fonts && document.fonts.ready) || Promise.resolve()).then(() => { cache.forEach(w => { w._fitted = false; }); if (cur) { fitInk(cur); cur._fitted = true; } });
  setTimeout(() => { const h = document.querySelector('.help'); if (h) h.classList.add('gone'); }, 7000);
  // görselleri önden yükle
  setTimeout(() => B.pages.forEach(p => { const i = new Image(); i.src = p.img; }), 1500);
})();
</script>

</body>

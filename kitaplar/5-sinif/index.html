:root { --bg:#12131f; --panel:#1b1d2e; --line:rgba(255,255,255,.09); --fg:#f4f4fb; --mut:#a9abc6; --pk:#e0457b; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(1100px 600px at 90% -10%, rgba(224,69,123,.28), transparent 60%), radial-gradient(900px 600px at -10% 110%, rgba(99,102,241,.22), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--fg); font: 16px/1.45 Lexend, system-ui, sans-serif; }
[hidden] { display: none !important; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 34px max(24px, env(safe-area-inset-left)) 60px max(24px, env(safe-area-inset-right)); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.kick { display: inline-flex; gap: 10px; align-items: center; font-weight: 600; font-size: 13px; letter-spacing: .16em; color: #ffd0de;
  border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 7px 14px 7px 7px; border-radius: 99px; }
.kick b { background: var(--pk); color: #fff; padding: 3px 10px; border-radius: 99px; letter-spacing: .08em; }
h1 { margin: 16px 0 6px; font-weight: 800; font-size: clamp(34px, 5vw, 58px); line-height: 1; letter-spacing: -.03em; }
h1 span { color: #ff6b98; }
.lead { margin: 0; color: var(--mut); font-size: 18px; }
.lead em { font-style: normal; font-family: Kalam, cursive; font-weight: 700; color: #ffe27a; font-size: 22px; }
.ig { display: flex; gap: 10px; align-items: center; background: linear-gradient(90deg,#f58529,#dd2a7b,#8134af); padding: 9px 18px; border-radius: 99px; font-weight: 600; font-size: 16px; color: #fff; text-decoration: none; white-space: nowrap; }
.ig:hover { filter: brightness(1.1); transform: translateY(-1px); }
.hl { display: flex; align-items: center; gap: 26px; }
.bookc { width: 132px; aspect-ratio: 3/4; border-radius: 4px 12px 12px 4px; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform: rotate(-4deg); flex: none; }
@media (max-width: 640px) { .bookc { width: 84px; } .hl { gap: 16px; } }
.ig small { display: block; font-size: 10px; letter-spacing: .16em; opacity: .9; }
nav { position: sticky; top: 0; z-index: 5; margin: 26px -8px 8px; padding: 10px 8px; display: flex; gap: 8px; flex-wrap: wrap;
  background: rgba(18,19,31,.82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
nav button { font: 500 14px Lexend, sans-serif; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
nav button i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--c); color: #fff; }
nav button:hover { background: rgba(255,255,255,.12); }
section { margin-top: 34px; scroll-margin-top: 80px; }
.ah { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.ah .num { width: 54px; height: 54px; border-radius: 16px; background: var(--c); display: grid; place-items: center; font-weight: 800; font-size: 26px; box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 45%, transparent); flex: none; }
.ah small { display: block; color: var(--mut); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.ah h2 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; transition: transform .15s, border-color .15s, background .15s; position: relative; }
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--c); background: #20223a; }
.card img { width: 104px; height: 134px; object-fit: cover; object-position: top; border-radius: 10px; background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.card .k { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--c); text-transform: uppercase; }
.card .t { margin-top: 4px; font-weight: 600; font-size: 17px; line-height: 1.3; }
.card .m { margin-top: 8px; color: var(--mut); font-size: 13px; }
.card .go { margin-top: 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: #fff; background: var(--c); padding: 5px 12px; border-radius: 99px; }
.card .last { position: absolute; top: -9px; right: 12px; background: #ffe27a; color: #3a2a00; font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 3px 9px; border-radius: 99px; }
footer { margin-top: 50px; color: var(--mut); font-size: 13px; text-align: center; }
/* okuyucu */
#reader { position: fixed; inset: 0; z-index: 50; background: #151821; }
#reader iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#home { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: 14px; z-index: 3; display: flex; gap: 8px; align-items: center;
  font: 600 14px Lexend, sans-serif; color: #fff; background: rgba(30,32,52,.92); border: 1px solid rgba(255,255,255,.18); padding: 10px 16px 10px 12px; border-radius: 99px; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.45); }
#home:hover { background: var(--pk); }
#loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(18,19,31,.88); }
#loading div { text-align: center; font-weight: 600; font-size: 18px; }
#loading i { display: block; margin: 0 auto 14px; width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255,255,255,.18); border-top-color: var(--pk); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .card { grid-template-columns: 84px 1fr; } .card img { width: 84px; height: 108px; } }
</style>
</head>

<script>
(function () {
  const C = ['#2f7fd6', '#e0457b', '#e88a1a', '#16a34a', '#7a52c7', '#0e9aa7'];
  const LKEY = 'app-son-5';
  const $ = id => document.getElementById(id);
  const txt = id => document.getElementById(id).textContent;
  const dec = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new TextDecoder().decode(u); };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let last = null; try { last = localStorage.getItem(LKEY); } catch (e) {}
  const nav = $('nav'), areas = $('areas');
  MENU.forEach((a, i) => {
    const c = C[i % C.length];
    const b = document.createElement('button'); b.style.setProperty('--c', c);
    b.innerHTML = `<i>${a.u}</i>${esc(a.title)}`; b.onclick = () => document.getElementById('a' + a.u).scrollIntoView({ behavior: 'smooth' });
    nav.appendChild(b);
    const s = document.createElement('section'); s.id = 'a' + a.u; s.style.setProperty('--c', c);
    s.innerHTML = `<div class="ah"><div class="num">${a.u}</div><div><small>${a.u}. Öğrenme Alanı</small><h2>${esc(a.title)}</h2></div></div><div class="grid"></div>`;
    a.topics.forEach(t => {
      const card = document.createElement('button'); card.className = 'card'; card.dataset.id = t.id;
      card.innerHTML = `${t.id === last ? '<span class="last">SON AÇILAN</span>' : ''}<img src="${t.thumb}" alt=""><div><div class="k">${t.k}. Konu</div><div class="t">${esc(t.name)}</div><div class="m">Sayfa ${esc(t.pages)} · ${t.n} sayfa</div><span class="go">Aç ▸</span></div>`;
      card.onclick = () => openTopic(t);
      s.querySelector('.grid').appendChild(card);
    });
    areas.appendChild(s);
  });
  if (location.hash) { const tg = document.getElementById(location.hash.slice(1)); if (tg) setTimeout(() => tg.scrollIntoView(), 50); }
  let SHELL = null, frame = null;
  function openTopic(t) {
    $('ltxt').textContent = t.name + ' açılıyor…'; $('loading').hidden = false;
    setTimeout(async () => {
      try {
        const get = async u => { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.text(); };
        if (!SHELL) SHELL = await get('veri/shell.html');
        const base = new URL('veri/i/', location.href).href;
        const data = (await get('veri/d/' + t.id + '.txt')).replace(/@IMG:([^@]+)@/g, (m, k) => base + k + '.jpg');
        const panels = await get('veri/p/' + t.id + '.txt');
        const html = SHELL.split('__TITLE__').join(esc(t.name)).replace('/*__DATA__*/', () => data).replace('/*__PANELS__*/', () => panels);
        closeTopic(true);
        frame = document.createElement('iframe'); frame.setAttribute('allow', 'fullscreen'); frame.setAttribute('allowfullscreen', '');
        $('reader').appendChild(frame); $('reader').hidden = false; $('menu').hidden = true;
        const d = frame.contentDocument; d.open(); d.write(html); d.close();
        setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) {} }, 300);
        try { localStorage.setItem(LKEY, t.id); } catch (e) {}
        last = t.id;
        document.querySelectorAll('.card .last').forEach(e => e.remove());
        const cd = document.querySelector(`.card[data-id="${t.id}"]`); if (cd) cd.insertAdjacentHTML('afterbegin', '<span class="last">SON AÇILAN</span>');
        document.title = t.name + ' · 5. Sınıf';
      } catch (e) { alert('Konu açılamadı: ' + e.message); }
      $('loading').hidden = true;
    }, 40);
  }
  function closeTopic(keep) {
    if (frame) { frame.remove(); frame = null; }
    if (!keep) { $('reader').hidden = true; $('menu').hidden = false; document.title = 'Sosyal Bilgiler 5. Sınıf Etkileşimli Ders Kitabı';
      const cd = document.querySelector(`.card[data-id="${last}"]`); if (cd) { cd.scrollIntoView({ block: 'center' }); cd.focus(); } }
  }
  $('home').onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); closeTopic(false); };
})();
</script>
